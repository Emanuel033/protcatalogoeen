<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Envases La Económica del Norte</title>
    
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Librerías -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- JS Propio -->
    <script src="assets/js/firebase-config.js" defer></script>
    <script src="assets/js/app.js" defer></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-indigo-900 text-white sticky top-0 z-40 shadow-xl" id="main-nav">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center justify-between w-full md:w-auto">
                <div class="flex items-center gap-3">
                    <div class="bg-white text-indigo-900 p-2 rounded-xl font-bold h-10 w-10 flex items-center justify-center">E</div>
                    <div><h1 class="text-lg font-bold">Envases La Económica</h1><p class="text-[10px] text-indigo-300 uppercase">Catálogo Digital</p></div>
                </div>
                <div class="flex gap-2 md:hidden">
                    <button onclick="startQRScanner()" class="bg-indigo-800 p-2 rounded-full text-indigo-200"><i class="fa-solid fa-qrcode"></i></button>
                    <button onclick="startTour()" class="bg-indigo-800 p-2 rounded-full text-indigo-200"><i class="fa-solid fa-circle-question"></i></button>
                </div>
            </div>
            <div class="w-full md:w-96 flex gap-2 relative">
                <input type="text" id="searchInput" onkeyup="debouncedFilter()" placeholder="Buscar..." class="w-full py-2.5 pl-4 pr-10 rounded-xl bg-indigo-800/50 text-white placeholder-indigo-300 focus:bg-white focus:text-slate-800 transition-all text-sm outline-none">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-xmark"></i></button>
                <button onclick="startTour()" class="hidden md:flex items-center gap-2 bg-indigo-800 px-4 rounded-xl text-indigo-200 hover:text-white transition whitespace-nowrap"><i class="fa-solid fa-circle-info"></i><span class="text-xs font-bold">Ayuda</span></button>
            </div>
        </div>
    </nav>

    <div class="bg-indigo-800 hero-pattern text-white relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 py-8 md:py-12 relative z-10">
            <h2 class="text-2xl md:text-4xl font-bold mb-2">Soluciones en Envases</h2>
            <p class="text-indigo-200 text-sm md:text-base max-w-2xl">Encuentra la más amplia variedad de envases industriales en Monterrey.</p>
        </div>
    </div>

    <div class="bg-white border-b border-slate-200 sticky top-[64px] z-30 shadow-sm" id="categories-bar">
        <div class="max-w-7xl mx-auto px-4 py-3"><div id="categories-container" class="flex gap-2 overflow-x-auto hide-scroll pb-1"></div></div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div id="products-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-20 text-slate-400">Cargando catálogo...</div>
        </div>
        <div id="pagination-controls" class="hidden flex justify-center items-center gap-4 mt-10 pt-6 border-t border-slate-200">
            <button onclick="changePage(-1)" id="btn-prev" class="px-4 py-2 bg-white border rounded shadow-sm">Anterior</button>
            <span id="page-info" class="text-sm font-bold">Pág 1</span>
            <button onclick="changePage(1)" id="btn-next" class="px-4 py-2 bg-white border rounded shadow-sm">Siguiente</button>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto pt-10 pb-6">
        <div class="max-w-7xl mx-auto px-4 text-center md:text-left">
            <p class="text-sm text-slate-500">© 2026 Envases La Económica del Norte.</p>
        </div>
    </footer>

    <!-- Botones Flotantes y Modales -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 translate-y-24 opacity-0 z-50 pointer-events-none text-sm font-medium">Msg</div>
    <button onclick="scrollToTop()" id="scroll-top-btn" class="fixed bottom-36 right-6 z-40 bg-slate-800/80 text-white p-3 rounded-full shadow-lg"><i class="fa-solid fa-arrow-up"></i></button>

    <div id="qr-scanner-modal" class="fixed inset-0 z-[100] hidden bg-slate-900/95 flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white rounded-2xl overflow-hidden relative shadow-2xl">
            <div class="p-4 bg-indigo-900 text-white flex justify-between items-center"><h3 class="font-bold">Escanear</h3><button onclick="stopQRScanner()"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="reader" class="w-full bg-black"></div>
        </div>
    </div>

    <div id="fab-container" class="fixed bottom-6 right-6 z-40 flex flex-col gap-3 items-end">
        <button onclick="openGeneralWhatsApp()" class="bg-white text-green-500 p-3 rounded-full shadow-lg hover:scale-110 transition border border-green-100"><i class="fa-brands fa-whatsapp text-xl"></i></button>
        <button id="cart-fab" onclick="toggleCart()" class="bg-indigo-600 text-white p-4 rounded-full shadow-lg group hover:scale-110 relative"><i class="fa-solid fa-cart-shopping"></i><span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-indigo-600 scale-0 transition-transform">0</span></button>
    </div>

    <!-- UI Carrito -->
    <div id="cart-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/60 transition-opacity opacity-0" id="cart-backdrop" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 h-full w-full md:w-[500px] bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform" id="cart-panel">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50"><h2 class="text-lg font-bold"><i class="fa-solid fa-bag-shopping"></i> Pedido</h2><button onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="flex-1 overflow-y-auto bg-slate-50/50"><div id="cart-items" class="p-4 space-y-3"></div>
                <div id="cart-config" class="p-4 bg-white border-t hidden">
                    <div class="mb-4"><label class="text-xs font-bold text-slate-500 uppercase">Cliente</label><div class="flex gap-2"><input type="text" id="client-name" placeholder="Nombre / Negocio" class="flex-1 border rounded px-3 py-2 text-sm" onchange="savePrefs()"><button onclick="setPublicoGeneral()" class="text-xs bg-slate-100 px-3 rounded border">Público</button></div></div>
                    <div class="mb-4"><label class="text-xs font-bold text-slate-500 uppercase">Entrega</label><div class="grid grid-cols-3 gap-2"><button onclick="setDelivery('recoger')" id="btn-recoger" class="option-btn rounded p-2 text-xs">Sucursal</button><button onclick="setDelivery('local')" id="btn-local" class="option-btn rounded p-2 text-xs">Local</button><button onclick="setDelivery('foraneo')" id="btn-foraneo" class="option-btn rounded p-2 text-xs">Foráneo</button></div></div>
                    <div id="panel-recoger" class="hidden text-sm bg-slate-50 p-2 border rounded mt-2"><div class="flex flex-wrap gap-2"><button onclick="setPayment('Efectivo')" class="pay-btn option-btn px-3 py-1 rounded text-xs">Efectivo</button><button onclick="setPayment('Tarjeta')" class="pay-btn option-btn px-3 py-1 rounded text-xs">Tarjeta</button></div></div>
                    <div id="panel-local" class="hidden text-sm bg-orange-50 p-2 border border-orange-100 rounded mt-2"><input type="text" id="delivery-address" placeholder="Dirección..." class="w-full border p-1 mb-2 text-xs" onchange="savePrefs()"><div class="flex flex-wrap gap-2"><button onclick="setPayment('Transferencia')" class="pay-btn option-btn px-3 py-1 rounded text-xs">Transf.</button><button onclick="setPayment('Efectivo')" class="pay-btn option-btn px-3 py-1 rounded text-xs">Efectivo</button></div></div>
                    <div id="panel-foraneo" class="hidden text-sm bg-indigo-50 p-2 border border-indigo-100 rounded mt-2"><input type="text" id="fletera-name" placeholder="Fletera..." class="w-full border p-1 mb-2 text-xs" onchange="savePrefs()"><div class="flex gap-2"><button onclick="setOcurre(true)" id="btn-ocurre-si" class="option-btn flex-1 text-xs">Ocurre</button><button onclick="setOcurre(false)" id="btn-ocurre-no" class="option-btn flex-1 text-xs">Domicilio</button></div><div class="flex gap-2 mt-2"><button onclick="setPayment('Transferencia')" class="pay-btn option-btn px-3 py-1 rounded text-xs">Transf.</button></div></div>
                    <div id="bank-info" class="hidden mt-2 p-2 bg-slate-800 text-slate-200 rounded text-xs">Banco: BANORTE | Cuenta: 0184214699</div>
                </div>
            </div>
            <div class="p-5 border-t bg-white shadow-lg">
                <div class="flex justify-between mb-4 font-bold text-lg"><span class="text-slate-600 text-sm">Total Piezas:</span><span id="cart-total" class="text-indigo-900">0</span></div>
                <button onclick="startQRScanner()" class="w-full bg-indigo-50 text-indigo-700 font-bold py-3 rounded-xl mb-3 text-sm border border-indigo-200">Escanear otro</button>
                <button onclick="sendWhatsApp()" class="w-full bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg mb-3">Enviar Pedido WhatsApp</button>
                <button onclick="clearCart()" class="w-full text-red-400 text-xs font-bold uppercase py-2">Vaciar</button>
            </div>
        </div>
    </div>

    <div id="tour-overlay" onclick="endTour()"></div>
    <div id="tour-tooltip"><h4 id="tour-title" class="font-bold"></h4><p id="tour-desc" class="text-sm"></p><div class="flex justify-between mt-2"><span id="tour-step-count" class="text-xs"></span><button id="tour-next-btn" onclick="nextStep()" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs">Siguiente</button></div></div>
    <div id="lightbox" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/90" onclick="this.classList.add('hidden')"><img id="lightbox-img" class="max-w-[95%] max-h-[90vh] rounded" onclick="event.stopPropagation()"></div>
</body>
</html>
