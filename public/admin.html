<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin ERP - Envases La Económica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- Scripts -->
    <script src="assets/js/firebase-config.js" defer></script>
    <script src="assets/js/admin.js" defer></script>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex font-sans text-slate-800">
    <div id="loading-screen" class="fixed inset-0 z-50 bg-white flex items-center justify-center"><div class="animate-spin w-12 h-12 border-4 border-t-indigo-600 rounded-full"></div></div>

    <aside class="w-64 bg-indigo-900 text-white flex-col hidden md:flex z-20">
        <div class="p-6 border-b border-indigo-800"><h1 class="text-2xl font-black flex items-center gap-2"><i class="fa-solid fa-cube"></i> ADMIN</h1></div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showSection('dashboard')" class="w-full text-left px-4 py-3 rounded-xl bg-indigo-800"><i class="fa-solid fa-chart-pie w-5"></i> Resumen</button>
            <button onclick="showSection('catalog')" class="w-full text-left px-4 py-3 rounded-xl text-indigo-100 hover:bg-indigo-800"><i class="fa-solid fa-boxes-stacked w-5"></i> Catálogo</button>
            <button onclick="showSection('inventory')" class="w-full text-left px-4 py-3 rounded-xl text-indigo-100 hover:bg-indigo-800"><i class="fa-solid fa-clipboard-list w-5"></i> Stock</button>
            <button onclick="showSection('scanner')" class="w-full text-left px-4 py-3 rounded-xl text-indigo-100 hover:bg-indigo-800"><i class="fa-solid fa-qrcode w-5"></i> Escáner Entradas</button>
        </nav>
        <div class="p-4 border-t border-indigo-800"><button onclick="logout()" class="w-full py-2 bg-indigo-950 text-indigo-300 rounded hover:bg-red-900">Cerrar Sesión</button></div>
    </aside>

    <div class="flex-1 flex flex-col h-full relative">
        <header class="bg-white border-b p-4 md:hidden flex justify-between"><h1 class="font-bold">ADMIN</h1><button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button></header>

        <main id="admin-content" class="flex-1 overflow-y-auto p-4 md:p-8 hidden bg-slate-50">
            <!-- Dashboard -->
            <div id="dashboard" class="fade-in max-w-5xl mx-auto">
                <h2 class="text-2xl font-bold mb-6">Resumen</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-xs font-bold text-slate-400">TOTAL</div><div class="text-3xl font-black text-indigo-600" id="total-products">...</div></div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-xs font-bold text-slate-400">CATEGORÍAS</div><div class="text-3xl font-black text-emerald-500" id="total-categories">...</div></div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm"><div class="text-xs font-bold text-slate-400">ACTIVOS</div><div class="text-3xl font-black text-blue-500" id="active-products">...</div></div>
                    <button onclick="openModal('create')" class="bg-indigo-600 text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center hover:bg-indigo-700"><i class="fa-solid fa-plus text-2xl"></i><span class="font-bold text-sm">Nuevo</span></button>
                </div>
            </div>

            <!-- Catálogo -->
            <div id="catalog" class="hidden fade-in max-w-6xl mx-auto">
                <div class="flex justify-between mb-4"><input type="text" id="searchCatalog" onkeyup="renderCatalog()" placeholder="Buscar..." class="border rounded-xl px-4 py-2 w-full max-w-sm"><button onclick="openModal('create')" class="ml-2 bg-indigo-600 text-white px-4 py-2 rounded-xl"><i class="fa-solid fa-plus"></i></button></div>
                <div class="bg-white rounded-2xl shadow border overflow-hidden"><table class="w-full text-left"><tbody id="catalog-body" class="divide-y"></tbody></table><div class="p-3 text-center"><button onclick="loadMore('cat')" class="text-indigo-600 text-xs font-bold">Ver más</button></div></div>
            </div>

            <!-- Inventario -->
            <div id="inventory" class="hidden fade-in max-w-3xl mx-auto">
                <input type="text" id="searchInventory" onkeyup="renderInventory()" placeholder="Buscar para ajustar stock..." class="w-full px-4 py-3 rounded-xl border mb-4">
                <div id="inventory-grid" class="space-y-3 pb-20"></div>
                <button onclick="loadMore('inv')" class="w-full py-3 text-center text-indigo-500 text-sm font-bold">Ver más</button>
            </div>

            <!-- Escáner -->
            <div id="scanner" class="hidden fade-in h-full flex flex-col items-center justify-center">
                <div class="bg-white p-2 rounded-3xl border-4 relative overflow-hidden w-full max-w-md aspect-square">
                    <div id="reader" class="w-full h-full bg-black"></div>
                    <div id="scan-overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center opacity-0 pointer-events-none transition text-center p-4"></div>
                </div>
                <div class="mt-4 bg-gray-900 text-white px-6 py-4 rounded-2xl w-full max-w-md text-center"><p class="text-[10px] text-gray-400 font-bold uppercase">Último Agregado</p><div id="scanProdName" class="font-bold text-lg">...</div><div class="text-2xl font-black text-indigo-400" id="scanTotal">0</div></div>
            </div>
        </main>
    </div>

    <!-- Modales (Producto / QR) -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-bold text-lg mb-4">Producto</h3>
            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-3">
                <input type="hidden" id="prodId">
                <input type="text" id="name" required placeholder="Nombre" class="w-full border rounded p-2">
                <div class="grid grid-cols-2 gap-3"><input type="text" id="category" list="cat-list" placeholder="Categoría" class="border rounded p-2"><input type="number" id="piezas" placeholder="Piezas x Paq" class="border rounded p-2"></div>
                <datalist id="cat-list"><option>Botellas</option><option>Garrafas</option><option>Tapas</option></datalist>
                <input type="text" id="image" onchange="previewImage(this.value)" placeholder="URL Imagen" class="w-full border rounded p-2">
                <div id="imgPreviewBox" class="hidden text-center bg-slate-50 p-2 rounded"><img id="imgPreview" class="h-20 mx-auto object-contain"></div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded">Guardar</button>
            </form>
        </div>
    </div>

    <div id="qr-modal" class="fixed inset-0 z-[60] hidden bg-slate-900/80 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl text-center">
            <h3 id="qr-prod-name" class="font-bold mb-4">Producto</h3>
            <canvas id="qr-canvas" class="border-2 border-dashed p-2 rounded mb-4"></canvas>
            <div class="flex gap-2 justify-center"><button onclick="printQR()" class="bg-indigo-600 text-white px-4 py-2 rounded">Imprimir</button><button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="bg-slate-200 px-4 py-2 rounded">Cerrar</button></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl translate-y-32 transition-transform duration-300 z-[100] border-l-4 border-indigo-500"><span id="toast-msg"></span></div>
</body>
</html>
