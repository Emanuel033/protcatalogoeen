<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin 5.3 - ERP Móvil Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Ajustes Lector QR Móvil */
        #reader video { object-fit: cover; border-radius: 16px; }
        .success-flash { animation: flashGreen 0.6s ease-out; }
        @keyframes flashGreen { 0% { background-color: rgba(34, 197, 94, 0.9); } 100% { background-color: transparent; } }
        
        /* Ocultar flechas en input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-slate-800 h-screen flex flex-col overflow-hidden text-xs md:text-sm">
    
    <div id="loader" class="fixed inset-0 bg-slate-900 z-[60] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="animate-spin h-12 w-12 border-4 border-indigo-500 border-t-transparent rounded-full mb-4"></div>
        <p class="text-xs tracking-widest uppercase font-semibold animate-pulse">Cargando ERP...</p>
    </div>

    <div id="main-content" class="max-w-full mx-auto bg-white shadow-2xl border-x border-gray-200 hidden flex-col h-full w-full relative">
        
        <div class="bg-indigo-900 px-4 py-2 flex justify-between items-center shrink-0 h-14">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-700 p-1.5 rounded-lg text-white shadow"><i class="fa-solid fa-boxes-stacked text-lg"></i></div>
                <div>
                    <h1 class="text-white text-base font-bold tracking-tight leading-none">ERP Económica</h1>
                    <div class="flex items-center gap-1 text-indigo-300 text-[10px] mt-0.5"><i class="fa-solid fa-user-shield"></i><span id="user-info">...</span></div>
                </div>
            </div>
            <button onclick="logout()" class="text-[10px] bg-red-500/20 hover:bg-red-500 text-red-100 hover:text-white px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden md:inline">Salir</span>
            </button>
        </div>

        <div class="flex shrink-0 bg-white shadow-sm z-20">
            <button onclick="switchTab('catalogo')" id="tab-catalogo" class="flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-indigo-600 text-indigo-700 transition-colors">
                <i class="fa-solid fa-tags text-lg"></i> <span class="text-[10px] uppercase tracking-wide">Catálogo</span>
            </button>
            <button onclick="switchTab('inventario')" id="tab-inventario" class="flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-clipboard-check text-lg"></i> <span class="text-[10px] uppercase tracking-wide">Inventario</span>
            </button>
        </div>

        <div id="view-catalogo" class="flex flex-col h-full overflow-hidden bg-gray-50">
            <div class="border-b bg-white shrink-0 shadow-sm z-10">
                <details id="addFormDetails" class="group px-4 py-2">
                    <summary class="list-none flex justify-between items-center cursor-pointer outline-none">
                        <h2 class="font-bold text-indigo-800 text-[11px] uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-circle-plus text-indigo-500"></i> Nuevo Producto
                        </h2>
                        <div class="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 group-open:rotate-180 transition-transform"><i class="fa-solid fa-chevron-down text-[10px]"></i></div>
                    </summary>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-2 animate-in fade-in zoom-in-95 duration-200 mt-3 pb-2">
                        <div class="col-span-1 md:col-span-3"><input id="prodName" onkeydown="checkEnter(event)" type="text" placeholder="Nombre" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-xs outline-none transition-all"></div>
                        <div class="col-span-1 md:col-span-2"><input id="prodCat" onkeydown="checkEnter(event)" type="text" placeholder="Categoría" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-xs outline-none transition-all"></div>
                        <div class="col-span-1 md:col-span-2"><input id="prodPcs" onkeydown="checkEnter(event)" type="number" placeholder="Pzas x Paq" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-xs outline-none transition-all"></div>
                        
                        <div class="col-span-1 md:col-span-5 flex gap-2 items-center">
                            <div class="flex-grow relative"><input id="prodFile" onkeydown="checkEnter(event)" oninput="previewImage(this.value)" type="text" placeholder="URL Imagen" class="w-full px-3 py-2 pl-8 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-xs outline-none transition-all"><i class="fa-solid fa-image absolute left-2.5 top-2.5 text-gray-400"></i></div>
                            <div id="imgPreviewBox" class="w-8 h-8 rounded-lg border overflow-hidden hidden shadow-sm"><img id="imgPreview" class="w-full h-full object-cover"></div>
                            
                            <label class="flex items-center gap-1 cursor-pointer bg-gray-100 px-2 py-1.5 rounded-lg border hover:bg-gray-200 transition-colors">
                                <input id="prodOldDate" type="checkbox" class="w-3.5 h-3.5 text-indigo-600 rounded">
                                <span class="text-[9px] font-bold text-gray-600 uppercase">Antiguo</span>
                            </label>
                            
                            <button onclick="uploadProduct()" id="btnUpload" class="bg-indigo-600 text-white font-bold w-10 h-8 rounded-lg shadow-md hover:bg-indigo-700 hover:-translate-y-0.5 transition-all"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </details>
            </div>

            <div class="px-4 py-2 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-2 shrink-0">
                <div class="relative w-full md:w-1/3">
                    <i class="fa-solid fa-search absolute left-3 top-2 text-gray-400 text-xs"></i>
                    <input id="searchInput" onkeyup="filterProducts()" type="text" placeholder="Buscar producto..." class="w-full pl-8 pr-4 py-1.5 bg-gray-100 border-transparent rounded-full text-xs outline-none focus:bg-white focus:ring-2 focus:ring-indigo-100 transition-all">
                </div>
                <div class="flex gap-2 w-full md:w-auto justify-end items-center">
                    <div class="flex items-center gap-1 bg-indigo-50 p-1 rounded-lg border border-indigo-100 hidden md:flex">
                        <span class="text-[9px] font-bold text-indigo-800 uppercase px-1">Masivo:</span>
                        <input id="massQtyInput" type="number" placeholder="#" class="w-12 px-1 text-xs text-center h-6 rounded border-none outline-none">
                        <button onclick="applyMassUpdate()" class="bg-indigo-600 text-white rounded w-6 h-6"><i class="fa-solid fa-check text-[10px]"></i></button>
                    </div>
                    <button onclick="printFilteredQRs()" class="bg-purple-600 text-white py-1.5 px-3 rounded-lg shadow-sm text-[10px] font-bold uppercase tracking-wide" title="Imprimir QRs Visibles"><i class="fa-solid fa-print"></i> QRs</button>
                    <button onclick="filterIncomplete()" class="bg-orange-100 text-orange-600 p-1.5 rounded-lg border border-orange-200" title="Sin piezas"><i class="fa-solid fa-triangle-exclamation"></i></button>
                    <button onclick="exportToExcel('catalogo')" class="bg-green-100 text-green-700 p-1.5 rounded-lg border border-green-200" title="Excel"><i class="fa-solid fa-file-excel"></i></button>
                </div>
            </div>

            <div class="flex-grow overflow-auto relative">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead class="bg-gray-100/80 backdrop-blur-sm text-[10px] uppercase text-gray-500 font-bold sticky top-0 z-10 border-b">
                        <tr>
                            <th class="py-2 px-2 w-14 text-center">Img</th>
                            <th class="py-2 px-2">Descripción del Producto</th>
                            <th class="py-2 px-2 w-20 text-center">Pzas/Paq</th>
                            <th class="py-2 px-2 w-16 text-center">Vis.</th>
                            <th class="py-2 px-2 w-32 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-xs text-gray-700 bg-white"></tbody>
                </table>
            </div>
        </div>

        <div id="view-inventario" class="hidden flex-col h-full overflow-hidden bg-gray-100 relative">
            
            <div class="bg-white p-3 border-b shrink-0 flex justify-between items-center shadow-sm z-10">
                <div class="relative w-2/3 md:w-1/2">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                    <input id="searchInvInput" onkeyup="renderInventoryTable()" type="text" placeholder="Buscar para ajuste manual..." class="w-full pl-8 pr-4 py-2 bg-gray-100 rounded-xl text-xs outline-none focus:bg-white focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="exportToExcel('inventario')" class="bg-green-600 text-white w-9 h-9 flex justify-center items-center rounded-xl shadow-md" title="Exportar Contpaqi">
                        <i class="fa-solid fa-file-csv text-lg"></i>
                    </button>
                    <button onclick="resetAllStock()" class="bg-red-100 text-red-600 w-9 h-9 flex justify-center items-center rounded-xl" title="Todo a CERO">
                        <i class="fa-solid fa-trash-arrow-up text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="flex-grow overflow-auto p-3 pb-24" id="inventoryCardsContainer">
                </div>

            <button onclick="openScannerModal()" class="fixed bottom-6 right-6 md:absolute md:bottom-8 md:right-8 w-16 h-16 bg-indigo-600 text-white rounded-full shadow-[0_8px_16px_rgba(79,70,229,0.4)] flex items-center justify-center hover:bg-indigo-700 hover:scale-105 active:scale-95 transition-all z-30 ring-4 ring-indigo-100">
                <i class="fa-solid fa-qrcode text-2xl"></i>
            </button>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black/95 z-[70] hidden flex-col">
        <div class="p-4 flex justify-between items-center bg-black/50 backdrop-blur-md text-white shrink-0 absolute top-0 w-full z-20">
            <div>
                <h3 class="font-bold text-lg leading-none"><i class="fa-solid fa-expand text-indigo-400"></i> Escáner Físico</h3>
                <p class="text-[10px] text-gray-300 mt-1">Apunta la cámara al QR del paquete</p>
            </div>
            <button onclick="closeScannerModal()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <div class="flex-grow relative flex flex-col justify-center items-center p-4 pt-20">
            <div id="reader" class="w-full max-w-sm overflow-hidden rounded-3xl border-2 border-indigo-500/30 shadow-[0_0_40px_rgba(99,102,241,0.2)] bg-black relative">
                <div id="scanOverlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                    <div class="bg-white/20 backdrop-blur-sm rounded-full p-4 mb-2 shadow-xl">
                        <i class="fa-solid fa-check text-5xl text-white drop-shadow-md"></i>
                    </div>
                    <div id="overlayQty" class="text-4xl font-black text-white drop-shadow-lg tracking-tighter">+24</div>
                </div>
            </div>
            
            <div class="mt-8 w-full max-w-sm bg-gray-900 rounded-2xl p-5 border border-gray-800 shadow-xl text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>
                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest mb-2"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Último Agregado</p>
                <div id="scanProdName" class="text-white font-bold text-base leading-tight min-h-[1.2rem]">Esperando lectura...</div>
                
                <div class="mt-3 inline-block bg-gray-800 rounded-xl px-4 py-2 border border-gray-700">
                    <span class="text-gray-400 text-xs mr-2">Stock Total:</span>
                    <span id="scanTotal" class="text-2xl font-black text-indigo-400">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-1/2 translate-x-1/2 md:translate-x-0 md:right-6 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-2xl translate-y-32 transition-transform duration-300 z-[100] border-l-4 border-indigo-500 flex items-center gap-3 w-max max-w-[90vw]">
        <div id="toast-icon-bg" class="w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0">
            <i id="toast-icon" class="fa-solid fa-check text-green-400 text-xs"></i>
        </div>
        <p id="toast-msg" class="text-xs font-semibold text-slate-100 tracking-wide">Mensaje de prueba</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            databaseURL: "https://productoseen-default-rtdb.firebaseio.com",
            projectId: "productoseen",
            storageBucket: "productoseen.firebasestorage.app",
            messagingSenderId: "1052892398028",
            appId: "1:1052892398028:web:055e67f2aa4bce0d9c9d69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let currentUser = null;
        let allProducts = []; 
        let currentFilteredProducts = [];
        let html5QrCode = null; 

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user; 
                try {
                    const snap = await db.ref('usuarios_permisos/' + user.uid).once('value');
                    if (snap.exists() && snap.val().redireccion === "admin.html") {
                        document.getElementById('user-info').innerText = user.email.split('@')[0];
                        document.getElementById('loader').classList.add('opacity-0', 'pointer-events-none');
                        document.getElementById('main-content').classList.remove('hidden');
                        document.getElementById('main-content').classList.add('flex');
                        setupRealtimeListener(); 
                    } else throw new Error("Permisos insuficientes.");
                } catch (error) { alert(error.message); window.location.href = "login.html"; }
            } else window.location.href = "login.html";
        });

        async function logout() { await auth.signOut(); window.location.href = "login.html"; }

        function setupRealtimeListener() {
            db.ref('productos').orderByChild('createdAt').on('value', (snapshot) => {
                allProducts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => { allProducts.push({id: child.key, ...child.val()}); });
                    allProducts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                }
                filterProducts();
                renderInventoryTable();
            });
        }

        // === NAVEGACIÓN TABS ===
        function switchTab(tabName) {
            const vCat = document.getElementById('view-catalogo'), vInv = document.getElementById('view-inventario');
            const tCat = document.getElementById('tab-catalogo'), tInv = document.getElementById('tab-inventario');

            if (tabName === 'catalogo') {
                vCat.classList.remove('hidden'); vCat.classList.add('flex'); 
                vInv.classList.add('hidden'); vInv.classList.remove('flex');
                
                tCat.className = "flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-indigo-600 text-indigo-700 transition-colors";
                tInv.className = "flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition-colors";
                
                closeScannerModal();
            } else {
                vInv.classList.remove('hidden'); vInv.classList.add('flex'); 
                vCat.classList.add('hidden'); vCat.classList.remove('flex');
                
                tInv.className = "flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-indigo-600 text-indigo-700 transition-colors";
                tCat.className = "flex-1 py-3 px-2 flex flex-col items-center gap-1 font-bold border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition-colors";
                
                renderInventoryTable();
            }
        }

        // === VISTA CATÁLOGO (PC) ===
        window.filterProducts = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentFilteredProducts = allProducts.filter(p => (p.name || '').toLowerCase().includes(term) || (p.category || '').toLowerCase().includes(term));
            renderTable(currentFilteredProducts);
        };

        function renderTable(products) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            products.forEach(p => {
                const isActive = p.activo !== false; 
                const fallbackImg = "https://via.placeholder.com/100?text=IMG";
                const tr = document.createElement('tr');
                tr.className = `group hover:bg-indigo-50/50 transition-colors ${!isActive ? 'opacity-50 grayscale' : ''}`;
                tr.innerHTML = `
                    <td class="p-2 text-center align-middle"><div class="w-10 h-10 mx-auto bg-gray-100 rounded-lg shadow-sm overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'"></div></td>
                    <td class="p-2 align-middle">
                        <input onchange="updateProduct('${p.id}','name',this.value, this)" value="${p.name || ''}" class="block w-full font-bold text-gray-800 bg-transparent border-none text-xs focus:ring-0 outline-none">
                        <input onchange="updateProduct('${p.id}','category',this.value, this)" value="${p.category || ''}" class="block w-full text-[10px] text-indigo-500 font-medium bg-transparent border-none focus:ring-0 outline-none mt-0.5">
                    </td>
                    <td class="p-2 align-middle text-center"><input type="number" onchange="updateProduct('${p.id}','piezas',this.value, this)" value="${p.piezas || ''}" class="w-16 mx-auto bg-gray-50 border border-gray-200 rounded text-center text-xs py-1 outline-none focus:border-indigo-500"></td>
                    <td class="p-2 text-center align-middle">
                        <label class="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" class="sr-only peer" onchange="updateProduct('${p.id}', 'activo', this.checked)" ${isActive ? 'checked' : ''}>
                          <div class="w-7 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-green-500"></div>
                        </label>
                    </td>
                    <td class="p-2 text-center align-middle">
                        <div class="flex items-center justify-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="printSingleQR('${p.id}')" class="text-purple-500 hover:bg-purple-100 w-7 h-7 rounded flex items-center justify-center transition" title="Imprimir QR"><i class="fa-solid fa-qrcode"></i></button>
                            <button onclick="cloneProduct('${p.id}')" class="text-blue-500 hover:bg-blue-100 w-7 h-7 rounded flex items-center justify-center transition" title="Clonar"><i class="fa-solid fa-copy"></i></button>
                            <button onclick="makeProductOld('${p.id}')" class="text-orange-400 hover:bg-orange-100 w-7 h-7 rounded flex items-center justify-center transition" title="Hacer Antiguo"><i class="fa-solid fa-clock-rotate-left"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:bg-red-100 w-7 h-7 rounded flex items-center justify-center transition" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // === IMPRESIÓN ===
        function buildPrintHTML(productsToPrint, qtyPerProduct) {
            let html = `<html><head><title>Etiquetas</title><style>
                body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
                .label { display: inline-block; width: 140px; border: 1px dashed #ccc; margin: 5px; padding: 10px; page-break-inside: avoid; }
                img { max-width: 100%; height: auto; }
                .title { font-size: 10px; font-weight: bold; margin-bottom: 5px; height: 30px; overflow: hidden; }
                .qty-badge { font-size: 14px; font-weight: 900; background: #000; color: #fff; padding: 4px; border-radius: 4px; margin-top: 5px; display: inline-block;}
            </style></head><body>`;
            productsToPrint.forEach(p => {
                const pzas = p.piezas || 1;
                const qrValue = `ID:${p.id}|P:${pzas}`; 
                const qr = new QRious({ value: qrValue, size: 300, level: 'M' });
                for(let i=0; i<qtyPerProduct; i++) html += `<div class="label"><div class="title">${p.name}</div><img src="${qr.toDataURL()}"><div class="qty-badge">${pzas} PZAS</div></div>`;
            });
            html += `</body><script>setTimeout(() => { window.print(); window.close(); }, 500);<\/script></html>`;
            return html;
        }

        window.printFilteredQRs = () => {
            if (currentFilteredProducts.length === 0) return showToast("Filtra productos primero", "error");
            const qty = prompt("¿Etiquetas POR CADA PRODUCTO?", "1");
            if (!qty || qty <= 0) return;
            const pw = window.open('', '_blank'); pw.document.write(buildPrintHTML(currentFilteredProducts, qty)); pw.document.close();
        };

        window.printSingleQR = (id) => {
            const p = allProducts.find(x => x.id === id); if (!p) return;
            const qty = prompt(`¿Cuántas etiquetas para:\n${p.name}?`, "1");
            if (!qty || qty <= 0) return;
            const pw = window.open('', '_blank'); pw.document.write(buildPrintHTML([p], qty)); pw.document.close();
        };

        // === VISTA INVENTARIO (CARDS MÓVIL) ===
        function renderInventoryTable() {
            const term = document.getElementById('searchInvInput').value.toLowerCase();
            const container = document.getElementById('inventoryCardsContainer');
            container.innerHTML = "";
            const filtered = allProducts.filter(p => (p.name || '').toLowerCase().includes(term));

            filtered.forEach(p => {
                const stock = p.stock || 0;
                const fallbackImg = "https://via.placeholder.com/100?text=IMG";
                
                const card = document.createElement('div');
                card.className = `bg-white p-3 rounded-2xl shadow-sm border border-gray-100 mb-3 flex items-center gap-3 transition-colors ${stock > 0 ? 'border-l-4 border-l-indigo-500' : ''}`;
                
                card.innerHTML = `
                    <div class="w-12 h-12 bg-gray-100 rounded-xl overflow-hidden shrink-0 shadow-sm border border-gray-200">
                        <img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'">
                    </div>
                    <div class="flex-grow min-w-0">
                        <h3 class="font-bold text-gray-800 text-xs truncate">${p.name}</h3>
                        <p class="text-[10px] text-gray-400 truncate">${p.category||'Sin categoría'} • Pzas/Paq: <span class="font-bold text-gray-500">${p.piezas||0}</span></p>
                    </div>
                    
                    <div class="flex items-center gap-1 bg-gray-50 p-1 rounded-xl border border-gray-200 shrink-0">
                        <button onclick="adjustStock('${p.id}', -1)" class="w-8 h-8 rounded-lg bg-white text-gray-600 hover:text-red-500 shadow-sm font-bold flex justify-center items-center text-lg active:scale-90 transition-transform"><i class="fa-solid fa-minus text-[10px]"></i></button>
                        
                        <input type="number" onchange="updateProduct('${p.id}','stock',this.value)" value="${stock}" class="w-10 text-center bg-transparent font-black text-indigo-700 outline-none text-sm">
                        
                        <button onclick="adjustStock('${p.id}', 1)" class="w-8 h-8 rounded-lg bg-white text-gray-600 hover:text-green-500 shadow-sm font-bold flex justify-center items-center text-lg active:scale-90 transition-transform"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
            
            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 mt-10"><i class="fa-solid fa-box-open text-4xl mb-2 opacity-50"></i><p>No se encontraron productos.</p></div>`;
            }
        }

        window.adjustStock = async (id, amount) => {
            const prod = allProducts.find(p => p.id === id); if (!prod) return;
            const newStock = Math.max(0, (prod.stock || 0) + amount);
            await db.ref('productos/'+id).update({stock: newStock});
        };

        window.resetAllStock = async () => {
            if(!confirm("⚠️ ADVERTENCIA ⚠️\n¿Poner TODO a CERO?")) return;
            const updates = {}; allProducts.forEach(prod => updates['/productos/' + prod.id + '/stock'] = 0);
            await db.ref().update(updates); showToast("Inventario reiniciado", "success");
        };

        // ====================================================
        // LECTOR QR FLOTANTE MEJORADO (CON SOPORTE A QRs VIEJOS)
        // ====================================================
        window.openScannerModal = () => {
            document.getElementById('scannerModal').classList.remove('hidden'); document.getElementById('scannerModal').classList.add('flex');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch((err) => { showToast("Error al iniciar cámara", "error"); });
        };

        window.closeScannerModal = () => {
            document.getElementById('scannerModal').classList.add('hidden'); document.getElementById('scannerModal').classList.remove('flex');
            if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(err => console.log(err));
        };

        function triggerSuccessFeedback() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); osc.connect(ctx.destination); osc.frequency.value = 1200; osc.start(); setTimeout(() => osc.stop(), 80);
            if ("vibrate" in navigator) navigator.vibrate([100]);
        }

        let lastScanTime = 0;
        async function onScanSuccess(decodedText) {
            const now = Date.now();
            if (now - lastScanTime < 1500) return; // Anti-rebote
            
            try {
                let scannedId = null;
                let scannedPzas = null;

                // 1. Detección Inteligente de Formato QR
                if (decodedText.startsWith('ID:')) {
                    // Formato NUEVO (Admin 5.1+): "ID:-Nx123|P:24"
                    const parts = decodedText.split('|');
                    scannedId = parts[0].split(':')[1];
                    scannedPzas = parseInt(parts[1].split(':')[1]);
                } else if (decodedText.includes('?add=')) {
                    // Formato VIEJO (Admin 4.3): "https://...?add=-Nx123"
                    scannedId = decodedText.split('?add=')[1];
                }

                if (!scannedId) return; // Si no es nuestro formato, ignora.

                const prod = allProducts.find(p => p.id === scannedId);
                if (!prod) { showToast("El producto no existe", "error"); return; }

                // Si era un QR viejo (no traía piezas grabadas), usamos las de la Base de Datos
                if (scannedPzas === null || isNaN(scannedPzas)) {
                    scannedPzas = prod.piezas || 1; 
                }

                // 2. Ejecutar Lógica de Inventario
                lastScanTime = now;
                triggerSuccessFeedback(); 

                const nuevoStock = (prod.stock || 0) + scannedPzas;
                await db.ref('productos/'+scannedId).update({stock: nuevoStock});

                // 3. UI Feedback en Modal
                const overlay = document.getElementById('scanOverlay');
                document.getElementById('overlayQty').innerText = `+${scannedPzas}`;
                overlay.classList.remove('opacity-0'); overlay.classList.add('success-flash');
                
                document.getElementById('scanProdName').innerText = prod.name;
                document.getElementById('scanTotal').innerText = nuevoStock;

                setTimeout(() => { overlay.classList.add('opacity-0'); overlay.classList.remove('success-flash'); }, 600);
            } catch (err) { console.error(err); }
        }

        // === FUNCIONES CRUD EXTRAS ===
        window.uploadProduct = async () => { 
            if (!currentUser) return;
            const name = document.getElementById('prodName').value, cat = document.getElementById('prodCat').value, url = document.getElementById('prodFile').value, pcs = document.getElementById('prodPcs').value, isOld = document.getElementById('prodOldDate').checked, btn = document.getElementById('btnUpload');
            if(!name) return showToast("Falta nombre", "error");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`; btn.disabled = true;
            try { await db.ref('productos').push({ name, category: cat, image: url, piezas: pcs ? Number(pcs) : 0, stock: 0, activo: true, createdAt: isOld ? new Date('2024-01-01').getTime() : firebase.database.ServerValue.TIMESTAMP }); showToast("Guardado", "success"); ['prodName','prodCat','prodFile','prodPcs'].forEach(id => document.getElementById(id).value = ""); document.getElementById('imgPreviewBox').classList.add('hidden'); document.getElementById('prodOldDate').checked = false; document.getElementById('prodName').focus(); } 
            catch(e) { showToast(e.message, "error"); } finally { btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i>`; btn.disabled = false; }
        };

        window.updateProduct = async (id, field, val, el) => { if(!currentUser) return; if (field === 'piezas' || field === 'stock') val = Number(val); if(el) el.classList.add('bg-indigo-50'); try { await db.ref('productos/'+id).update({[field]: val}); if(el) { el.classList.replace('bg-indigo-50', 'bg-green-50'); setTimeout(() => el.classList.remove('bg-green-50'), 500); } } catch(e) { showToast("Error", "error"); } };
        window.makeProductOld = async (id) => { if(confirm("¿Hacer Antiguo?")) { await db.ref('productos/'+id).update({createdAt: new Date('2024-01-01').getTime()}); showToast("Listo", "success"); } };
        window.cloneProduct = (id) => { const p = allProducts.find(x => x.id === id); if(!p) return; ['Name','Cat','Pcs','File'].forEach(k => document.getElementById(`prod${k}`).value = p[k.toLowerCase()] || p[k==='Pcs'?'piezas':'image']); document.getElementById('addFormDetails').open = true; document.getElementById('prodName').focus(); };
        window.deleteProduct = async (id) => { if(confirm("¿Borrar?")) await db.ref('productos/'+id).remove(); };
        window.applyMassUpdate = async () => { const q = document.getElementById('massQtyInput').value; if(!q) return; if(confirm(`¿Actualizar items?`)) { const u = {}; currentFilteredProducts.forEach(p => u[`/productos/${p.id}/piezas`] = Number(q)); await db.ref().update(u); showToast("Actualizado", "success"); } };
        
        window.exportToExcel = (tipo) => {
            let csv = "\uFEFF";
            if (tipo === 'inventario') {
                csv += "Nombre,Categoria,Stock_Contado\n";
                allProducts.forEach(p => csv += `"${(p.name||"").replace(/"/g,'""')}","${(p.category||"").replace(/"/g,'""')}",${p.stock||0}\n`);
            } else {
                csv += "Nombre,Categoria,PiezasxPaq,Activo\n";
                allProducts.forEach(p => csv += `"${(p.name||"").replace(/"/g,'""')}","${(p.category||"").replace(/"/g,'""')}",${p.piezas||0},${p.activo!==false?"SI":"NO"}\n`);
            }
            const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); a.download = `${tipo}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
        };

        window.previewImage = (url) => { const b = document.getElementById('imgPreviewBox'), i = document.getElementById('imgPreview'); if(url && url.length > 10) { b.classList.remove('hidden'); i.src = url; i.onerror = () => b.classList.add('hidden'); } else b.classList.add('hidden'); }
        function showToast(msg, type="success") { 
            const t = document.getElementById('toast'), i = document.getElementById('toast-icon'), bg = document.getElementById('toast-icon-bg'); 
            document.getElementById('toast-msg').innerText = msg; 
            i.className = type === 'error' ? "fa-solid fa-xmark text-red-500 text-xs" : "fa-solid fa-check text-green-400 text-xs"; 
            bg.className = type === 'error' ? "w-6 h-6 rounded-full bg-red-500/20 flex items-center justify-center shrink-0" : "w-6 h-6 rounded-full bg-green-500/20 flex items-center justify-center shrink-0";
            t.classList.replace(type==='error'?'border-indigo-500':'border-red-500', type==='error'?'border-red-500':'border-indigo-500'); 
            t.classList.remove('translate-y-32'); setTimeout(() => t.classList.add('translate-y-32'), 2500); 
        }
    </script>
</body>
</html>
