<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin 6.0 - ERP App UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* Ocultar scrollbars para look de App */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden text-sm selection:bg-indigo-100">
    
    <div id="loader" class="fixed inset-0 bg-indigo-900 z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="animate-spin h-14 w-14 border-4 border-indigo-400 border-t-white rounded-full mb-6 shadow-[0_0_15px_rgba(255,255,255,0.2)]"></div>
        <p class="text-xs tracking-[0.2em] font-bold animate-pulse text-indigo-100">INICIANDO ERP...</p>
    </div>

    <div id="main-content" class="w-full max-w-md mx-auto bg-slate-50 hidden flex-col h-full relative shadow-2xl">
        
        <div class="bg-white px-5 py-4 flex justify-between items-center shrink-0 z-20 shadow-sm rounded-b-3xl relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-boxes-stacked text-lg"></i>
                </div>
                <div>
                    <h1 class="text-slate-800 text-lg font-extrabold tracking-tight leading-none">Económica</h1>
                    <p id="user-info" class="text-[10px] text-slate-400 font-medium uppercase tracking-wider mt-0.5">Cargando...</p>
                </div>
            </div>
            <button onclick="logout()" class="w-9 h-9 bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>

        <div id="view-catalogo" class="flex flex-col h-full overflow-hidden relative">
            <div class="px-4 py-3 shrink-0 z-10">
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input id="searchInput" onkeyup="filterProducts()" type="text" placeholder="Buscar producto..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all shadow-sm font-medium">
                    </div>
                    <button onclick="openMassActions()" class="w-12 h-12 bg-white border border-slate-200 text-slate-600 rounded-2xl flex items-center justify-center shadow-sm hover:bg-slate-50 transition-colors shrink-0">
                        <i class="fa-solid fa-layer-group"></i>
                    </button>
                </div>
            </div>

            <div class="flex-grow overflow-y-auto px-4 pb-28 pt-1" id="catalogCardsContainer">
                </div>
        </div>

        <div id="view-inventario" class="hidden flex-col h-full overflow-hidden relative">
            <div class="px-4 py-3 shrink-0 z-10 flex gap-2">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input id="searchInvInput" onkeyup="renderInventoryTable()" type="text" placeholder="Buscar para ajuste..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all shadow-sm font-medium">
                </div>
                <button onclick="exportToExcel('inventario')" class="w-12 h-12 bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center shadow-sm hover:bg-emerald-100 transition-colors shrink-0">
                    <i class="fa-solid fa-file-excel text-lg"></i>
                </button>
            </div>

            <div class="flex-grow overflow-y-auto px-4 pb-32" id="inventoryCardsContainer">
                </div>

            <button onclick="openScannerModal()" class="absolute bottom-24 right-5 w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-500 text-white rounded-[20px] shadow-[0_10px_25px_rgba(79,70,229,0.4)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-30">
                <i class="fa-solid fa-qrcode text-2xl"></i>
            </button>
        </div>

        <div class="absolute bottom-0 w-full glass-nav pb-6 pt-3 px-6 z-40 rounded-t-3xl">
            <div class="flex justify-between items-center relative">
                
                <button onclick="switchTab('catalogo')" id="tab-catalogo" class="flex flex-col items-center gap-1 w-20 text-indigo-600 transition-colors">
                    <i class="fa-solid fa-tags text-xl mb-0.5"></i>
                    <span class="text-[10px] font-bold tracking-wide">Catálogo</span>
                </button>

                <button onclick="openAddModal()" class="absolute left-1/2 -translate-x-1/2 -top-10 w-14 h-14 bg-slate-900 text-white rounded-full shadow-lg shadow-slate-400/50 flex items-center justify-center hover:bg-black active:scale-90 transition-all border-4 border-white">
                    <i class="fa-solid fa-plus text-xl"></i>
                </button>

                <button onclick="switchTab('inventario')" id="tab-inventario" class="flex flex-col items-center gap-1 w-20 text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-clipboard-check text-xl mb-0.5"></i>
                    <span class="text-[10px] font-bold tracking-wide">Inventario</span>
                </button>
            </div>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[80] hidden flex-col justify-end">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-[2rem] p-6 slide-up shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-extrabold text-slate-800">Nuevo Producto</h2>
                <button onclick="closeAddModal()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Nombre del Producto</label>
                    <input id="prodName" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-400 focus:bg-white transition-colors" placeholder="Ej. Envase 500ml">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Categoría</label>
                        <input id="prodCat" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-400 focus:bg-white" placeholder="Ej. PET">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">Pzas x Paquete</label>
                        <input id="prodPcs" type="number" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-400 focus:bg-white" placeholder="0">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 block">URL de Imagen</label>
                    <div class="flex gap-2">
                        <input id="prodFile" oninput="previewImage(this.value)" type="text" class="flex-grow bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-400 focus:bg-white" placeholder="https://...">
                        <div id="imgPreviewBox" class="w-12 h-12 rounded-xl border border-slate-200 overflow-hidden hidden shrink-0"><img id="imgPreview" class="w-full h-full object-cover"></div>
                    </div>
                </div>
                
                <div class="pt-2">
                    <button onclick="uploadProduct()" id="btnUpload" class="w-full bg-indigo-600 text-white font-bold rounded-xl py-4 shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all text-sm">
                        Guardar Producto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="optionsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[80] hidden flex-col justify-end" onclick="if(event.target === this) closeOptionsModal()">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-[2rem] p-6 slide-up shadow-2xl relative pb-8">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
            <h3 id="optProdName" class="text-center font-bold text-slate-800 text-lg mb-6 px-4 truncate">Nombre Producto</h3>
            
            <div class="space-y-2">
                <button onclick="actionClone()" class="w-full flex items-center p-4 rounded-2xl bg-slate-50 hover:bg-slate-100 transition-colors text-slate-700 font-semibold">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-4"><i class="fa-solid fa-copy"></i></div>
                    Clonar Producto
                </button>
                <button onclick="actionMakeOld()" class="w-full flex items-center p-4 rounded-2xl bg-slate-50 hover:bg-slate-100 transition-colors text-slate-700 font-semibold">
                    <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center mr-4"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    Mover al final (Hacer Antiguo)
                </button>
                <button onclick="actionDelete()" class="w-full flex items-center p-4 rounded-2xl bg-red-50 hover:bg-red-100 transition-colors text-red-600 font-bold mt-4">
                    <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center mr-4"><i class="fa-solid fa-trash"></i></div>
                    Eliminar Producto
                </button>
            </div>
        </div>
    </div>

    <div id="massActionsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[80] hidden flex-col justify-end" onclick="if(event.target === this) closeMassActions()">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-[2rem] p-6 slide-up shadow-2xl relative pb-8">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
            <h3 class="font-bold text-slate-800 text-lg mb-6">Acciones de Catálogo</h3>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="printFilteredQRs('inventario')" class="bg-purple-50 hover:bg-purple-100 border border-purple-100 text-purple-700 p-4 rounded-2xl font-bold flex flex-col items-center justify-center gap-2 transition-colors">
                    <i class="fa-solid fa-box text-2xl"></i> Imprimir Cajas
                </button>
                <button onclick="printFilteredQRs('vitrina')" class="bg-pink-50 hover:bg-pink-100 border border-pink-100 text-pink-700 p-4 rounded-2xl font-bold flex flex-col items-center justify-center gap-2 transition-colors">
                    <i class="fa-solid fa-store text-2xl"></i> Imprimir Vitrina
                </button>
            </div>

            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-4">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">Edición Masiva (Pzas/Paq)</label>
                <div class="flex gap-2">
                    <input id="massQtyInput" type="number" placeholder="Ej. 100" class="flex-grow px-4 py-2 rounded-xl border border-slate-200 outline-none focus:border-indigo-400">
                    <button onclick="applyMassUpdate()" class="bg-indigo-600 text-white px-4 rounded-xl font-bold"><i class="fa-solid fa-check"></i> Aplicar</button>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="filterIncomplete(); closeMassActions();" class="flex-1 bg-orange-50 text-orange-600 py-3 rounded-xl font-bold border border-orange-100"><i class="fa-solid fa-triangle-exclamation"></i> Sin piezas</button>
                <button onclick="exportToExcel('catalogo'); closeMassActions();" class="flex-1 bg-emerald-50 text-emerald-600 py-3 rounded-xl font-bold border border-emerald-100"><i class="fa-solid fa-file-excel"></i> Excel Catálogo</button>
            </div>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black/95 z-[90] hidden flex-col">
        <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent text-white shrink-0 absolute top-0 w-full z-20">
            <div>
                <h3 class="font-bold text-lg leading-none"><i class="fa-solid fa-expand text-indigo-400"></i> Escáner Físico</h3>
                <p class="text-[10px] text-gray-300 mt-1">Apunta la cámara al QR del paquete</p>
            </div>
            <button onclick="closeScannerModal()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-colors backdrop-blur-md"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="flex-grow relative flex flex-col justify-center items-center p-4">
            <div id="reader" class="w-full max-w-sm overflow-hidden rounded-[2rem] border-4 border-indigo-500/30 shadow-[0_0_50px_rgba(99,102,241,0.15)] bg-black relative">
                <div id="scanOverlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-200">
                    <div class="bg-white/20 backdrop-blur-md rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-2xl"><i class="fa-solid fa-check text-5xl text-white drop-shadow-md"></i></div>
                    <div id="overlayQty" class="text-5xl font-black text-white drop-shadow-lg tracking-tighter">+24</div>
                </div>
            </div>
            
            <div class="mt-8 w-full max-w-sm bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-2xl text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2"><i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Último Escaneo</p>
                <div id="scanProdName" class="text-white font-bold text-lg leading-tight min-h-[1.5rem] px-2">Esperando lectura...</div>
                <div class="mt-4 inline-flex items-center justify-center bg-slate-800 rounded-2xl px-5 py-3 border border-slate-700">
                    <span class="text-slate-400 text-xs font-semibold mr-3 uppercase tracking-wider">Total Stock:</span>
                    <span id="scanTotal" class="text-3xl font-black text-indigo-400">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3.5 rounded-2xl shadow-2xl -translate-y-32 transition-transform duration-300 z-[100] flex items-center gap-3 w-max max-w-[90vw]">
        <div id="toast-icon-bg" class="w-7 h-7 rounded-full flex items-center justify-center shrink-0">
            <i id="toast-icon" class="text-sm"></i>
        </div>
        <p id="toast-msg" class="text-sm font-semibold tracking-wide">Mensaje</p>
    </div>

    <script>
        // ==========================================
        // CÓDIGO JS (Lógica versión 5.5 INTACTA + UI 6.0)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            databaseURL: "https://productoseen-default-rtdb.firebaseio.com",
            projectId: "productoseen",
            storageBucket: "productoseen.firebasestorage.app",
            messagingSenderId: "1052892398028",
            appId: "1:1052892398028:web:055e67f2aa4bce0d9c9d69"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let currentUser = null;
        let allProducts = []; 
        let currentFilteredProducts = [];
        let html5QrCode = null; 
        let selectedProdId = null; // Para el menú de 3 puntos

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user; 
                try {
                    const snap = await db.ref('usuarios_permisos/' + user.uid).once('value');
                    if (snap.exists() && snap.val().redireccion === "admin.html") {
                        document.getElementById('user-info').innerText = user.email.split('@')[0];
                        document.getElementById('loader').classList.add('opacity-0', 'pointer-events-none');
                        document.getElementById('main-content').classList.remove('hidden');
                        document.getElementById('main-content').classList.add('flex');
                        setupRealtimeListener(); 
                    } else throw new Error("Permisos insuficientes.");
                } catch (error) { alert(error.message); window.location.href = "login.html"; }
            } else window.location.href = "login.html";
        });

        async function logout() { await auth.signOut(); window.location.href = "login.html"; }

        function setupRealtimeListener() {
            db.ref('productos').orderByChild('createdAt').on('value', (snapshot) => {
                allProducts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => { allProducts.push({id: child.key, ...child.val()}); });
                    allProducts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                }
                filterProducts();
                renderInventoryTable();
            });
        }

        // TABS NATIVOS
        function switchTab(tabName) {
            const vCat = document.getElementById('view-catalogo'), vInv = document.getElementById('view-inventario');
            const tCat = document.getElementById('tab-catalogo'), tInv = document.getElementById('tab-inventario');

            if (tabName === 'catalogo') {
                vCat.classList.remove('hidden'); vCat.classList.add('flex'); 
                vInv.classList.add('hidden'); vInv.classList.remove('flex');
                
                tCat.className = "flex flex-col items-center gap-1 w-20 text-indigo-600 transition-colors";
                tInv.className = "flex flex-col items-center gap-1 w-20 text-slate-400 hover:text-slate-600 transition-colors";
                closeScannerModal();
            } else {
                vInv.classList.remove('hidden'); vInv.classList.add('flex'); 
                vCat.classList.add('hidden'); vCat.classList.remove('flex');
                
                tInv.className = "flex flex-col items-center gap-1 w-20 text-indigo-600 transition-colors";
                tCat.className = "flex flex-col items-center gap-1 w-20 text-slate-400 hover:text-slate-600 transition-colors";
                renderInventoryTable();
            }
        }

        // VISTA CATÁLOGO (DISEÑO CARDS)
        window.filterProducts = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentFilteredProducts = allProducts.filter(p => (p.name || '').toLowerCase().includes(term) || (p.category || '').toLowerCase().includes(term));
            renderCatalogCards(currentFilteredProducts);
        };

        function renderCatalogCards(products) {
            const container = document.getElementById('catalogCardsContainer');
            container.innerHTML = "";
            
            products.forEach(p => {
                const isActive = p.activo !== false; 
                const fallbackImg = "https://via.placeholder.com/150?text=IMG";
                const card = document.createElement('div');
                card.className = `bg-white rounded-[1.25rem] p-4 shadow-sm border border-slate-100 mb-3 fade-in ${!isActive ? 'opacity-60 grayscale' : ''}`;
                card.innerHTML = `
                    <div class="flex gap-3 mb-3">
                        <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0 bg-slate-50 border border-slate-100"><img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'"></div>
                        <div class="flex-grow min-w-0">
                            <input onchange="updateProduct('${p.id}','name',this.value, this)" value="${p.name || ''}" class="w-full font-bold text-slate-800 text-sm bg-transparent border-none outline-none focus:border-b focus:border-indigo-400 truncate placeholder-slate-300">
                            <input onchange="updateProduct('${p.id}','category',this.value, this)" value="${p.category || ''}" class="w-full text-xs text-indigo-500 font-semibold bg-transparent border-none outline-none mt-0.5 truncate placeholder-slate-300" placeholder="Categoría">
                            <div class="flex items-center mt-1.5 bg-slate-50 w-max px-2 py-0.5 rounded text-[10px] text-slate-500 font-medium">
                                PZAS/PAQ: <input type="number" onchange="updateProduct('${p.id}','piezas',this.value, this)" value="${p.piezas || ''}" class="w-10 ml-1 bg-transparent text-center font-bold text-slate-700 outline-none">
                            </div>
                        </div>
                        <div class="shrink-0 flex flex-col items-end justify-between">
                            <label class="relative inline-flex items-center cursor-pointer">
                              <input type="checkbox" class="sr-only peer" onchange="updateProduct('${p.id}', 'activo', this.checked)" ${isActive ? 'checked' : ''}>
                              <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500 shadow-inner"></div>
                            </label>
                            <button onclick="openOptionsModal('${p.id}', '${p.name ? p.name.replace(/'/g, "\\'") : ''}')" class="text-slate-400 p-1 mt-2 hover:text-slate-800"><i class="fa-solid fa-ellipsis-vertical text-lg px-2"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-2 pt-3 border-t border-slate-100">
                        <button onclick="printSingleQR('${p.id}', 'inventario')" class="flex-1 bg-purple-50 text-purple-700 hover:bg-purple-100 py-2 rounded-xl text-xs font-bold transition-colors"><i class="fa-solid fa-box mr-1"></i> Caja</button>
                        <button onclick="printSingleQR('${p.id}', 'vitrina')" class="flex-1 bg-pink-50 text-pink-700 hover:bg-pink-100 py-2 rounded-xl text-xs font-bold transition-colors"><i class="fa-solid fa-store mr-1"></i> 1 Pza</button>
                    </div>
                `;
                container.appendChild(card);
            });
            if(products.length === 0) container.innerHTML = `<div class="text-center text-slate-400 mt-10"><i class="fa-solid fa-folder-open text-4xl mb-3 opacity-30"></i><p class="font-medium">No se encontraron productos</p></div>`;
        }

        // ==========================================
        // UI EXTRAS: MODALES (NUEVO, OPCIONES, MASIVAS)
        // ==========================================
        window.openAddModal = () => { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); setTimeout(()=>document.getElementById('prodName').focus(), 100); }
        window.closeAddModal = () => { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }
        
        window.openOptionsModal = (id, name) => { selectedProdId = id; document.getElementById('optProdName').innerText = name; document.getElementById('optionsModal').classList.remove('hidden'); document.getElementById('optionsModal').classList.add('flex'); }
        window.closeOptionsModal = () => { selectedProdId = null; document.getElementById('optionsModal').classList.add('hidden'); document.getElementById('optionsModal').classList.remove('flex'); }
        
        window.openMassActions = () => { document.getElementById('massActionsModal').classList.remove('hidden'); document.getElementById('massActionsModal').classList.add('flex'); }
        window.closeMassActions = () => { document.getElementById('massActionsModal').classList.add('hidden'); document.getElementById('massActionsModal').classList.remove('flex'); }

        window.actionClone = () => { if(selectedProdId) cloneProduct(selectedProdId); closeOptionsModal(); }
        window.actionMakeOld = () => { if(selectedProdId) makeProductOld(selectedProdId); closeOptionsModal(); }
        window.actionDelete = () => { if(selectedProdId) deleteProduct(selectedProdId); closeOptionsModal(); }


        // LÓGICA DE IMPRESIÓN (Idéntica 5.5)
        function buildPrintHTML(productsToPrint, qtyPerProduct, printType, baseUrl) {
            let html = `<html><head><title>Etiquetas</title><style>
                body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
                .label { display: inline-block; width: 140px; border: 1px dashed #ccc; margin: 5px; padding: 10px; page-break-inside: avoid; }
                img { max-width: 100%; height: auto; }
                .title { font-size: 10px; font-weight: bold; margin-bottom: 5px; height: 30px; overflow: hidden; }
                .qty-badge { font-size: 14px; font-weight: 900; background: ${printType === 'vitrina' ? '#ec4899' : '#000'}; color: #fff; padding: 4px; border-radius: 4px; margin-top: 5px; display: inline-block;}
            </style></head><body>`;
            
            productsToPrint.forEach(p => {
                let pzasToPrint = 1;
                let qrValue = "";
                if (printType === 'inventario') {
                    pzasToPrint = p.piezas || 1;
                    qrValue = `ID:${p.id}|P:${pzasToPrint}`; 
                } else {
                    const nameAndCat = ((p.name || '') + ' ' + (p.category || '')).toLowerCase();
                    const isBolsa = nameAndCat.includes('bolsa');
                    pzasToPrint = isBolsa ? (p.piezas || 100) : 1;
                    qrValue = `${baseUrl}/?add=${p.id}`; 
                }
                const qr = new QRious({ value: qrValue, size: 300, level: 'M' });
                for(let i=0; i<qtyPerProduct; i++) {
                    html += `<div class="label"><div class="title">${p.name}</div><img src="${qr.toDataURL()}"><div class="qty-badge">${pzasToPrint} PZAS</div></div>`;
                }
            });
            html += `</body><script>setTimeout(() => { window.print(); window.close(); }, 500);<\/script></html>`;
            return html;
        }

        function getBaseUrl() {
            let baseUrl = localStorage.getItem('een_catalog_url');
            if (!baseUrl) {
                baseUrl = prompt("Para generar códigos URL de Vitrina, ingresa tu página web:\n(Ej: https://productoseen.web.app)", window.location.origin);
                if (baseUrl) {
                    if(!baseUrl.startsWith('http')) baseUrl = 'https://' + baseUrl;
                    if(baseUrl.endsWith('/')) baseUrl = baseUrl.slice(0, -1);
                    localStorage.setItem('een_catalog_url', baseUrl);
                }
            }
            return baseUrl;
        }

        window.printFilteredQRs = (printType) => {
            if (currentFilteredProducts.length === 0) return showToast("Filtra productos primero", "error");
            let baseUrl = "";
            if (printType === 'vitrina') {
                baseUrl = getBaseUrl();
                if (!baseUrl) return showToast("Se requiere URL", "error");
            }
            closeMassActions();
            const qty = prompt(`¿Cuántas etiquetas POR CADA PRODUCTO?`, "1");
            if (!qty || qty <= 0) return;
            const pw = window.open('', '_blank'); pw.document.write(buildPrintHTML(currentFilteredProducts, qty, printType, baseUrl)); pw.document.close();
        };

        window.printSingleQR = (id, printType) => {
            const p = allProducts.find(x => x.id === id); if (!p) return;
            let baseUrl = "";
            if (printType === 'vitrina') {
                baseUrl = getBaseUrl();
                if (!baseUrl) return showToast("Se requiere URL", "error");
            }
            const qty = prompt(`Etiquetas para:\n${p.name}\n\n¿Cuántas?`, "1");
            if (!qty || qty <= 0) return;
            const pw = window.open('', '_blank'); pw.document.write(buildPrintHTML([p], qty, printType, baseUrl)); pw.document.close();
        };

        // VISTA INVENTARIO MÓVIL (DISEÑO MEJORADO)
        function renderInventoryTable() {
            const term = document.getElementById('searchInvInput').value.toLowerCase();
            const container = document.getElementById('inventoryCardsContainer');
            container.innerHTML = "";
            const filtered = allProducts.filter(p => (p.name || '').toLowerCase().includes(term));

            filtered.forEach(p => {
                const stock = p.stock || 0;
                const fallbackImg = "https://via.placeholder.com/150?text=IMG";
                const card = document.createElement('div');
                card.className = `bg-white p-3.5 rounded-[1.25rem] shadow-sm border mb-3 flex items-center gap-3 transition-colors fade-in ${stock > 0 ? 'border-indigo-200 bg-indigo-50/10' : 'border-slate-100'}`;
                card.innerHTML = `
                    <div class="w-14 h-14 bg-slate-50 rounded-xl overflow-hidden shrink-0 border border-slate-100"><img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'"></div>
                    <div class="flex-grow min-w-0 pr-1">
                        <h3 class="font-bold text-slate-800 text-sm truncate">${p.name}</h3>
                        <p class="text-[10px] font-semibold text-slate-400 truncate mt-0.5">${p.category||'Sin categoría'} <span class="text-indigo-400 ml-1">Pzas/Paq: ${p.piezas||0}</span></p>
                    </div>
                    <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-2xl border border-slate-200 shrink-0">
                        <button onclick="adjustStock('${p.id}', -1)" class="w-10 h-10 rounded-xl bg-white text-slate-500 hover:text-red-500 shadow-sm flex justify-center items-center active:scale-90 transition-transform"><i class="fa-solid fa-minus"></i></button>
                        <input type="number" onchange="updateProduct('${p.id}','stock',this.value, this)" value="${stock}" class="w-12 text-center bg-transparent font-black text-indigo-600 text-base outline-none">
                        <button onclick="adjustStock('${p.id}', 1)" class="w-10 h-10 rounded-xl bg-white text-slate-500 hover:text-emerald-500 shadow-sm flex justify-center items-center active:scale-90 transition-transform"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
            if(filtered.length === 0) container.innerHTML = `<div class="text-center text-slate-400 mt-10"><i class="fa-solid fa-box-open text-4xl mb-3 opacity-30"></i><p class="font-medium">Sin resultados</p></div>`;
        }

        window.adjustStock = async (id, amount) => {
            const prod = allProducts.find(p => p.id === id); if (!prod) return;
            const newStock = Math.max(0, (prod.stock || 0) + amount);
            await db.ref('productos/'+id).update({stock: newStock});
        };

        window.resetAllStock = async () => {
            if(!confirm("⚠️ ADVERTENCIA ⚠️\n¿Poner el inventario de TODO el catálogo a CERO?")) return;
            const updates = {}; allProducts.forEach(prod => updates['/productos/' + prod.id + '/stock'] = 0);
            await db.ref().update(updates); showToast("Inventario en Cero", "success");
        };

        // ESCÁNER (LÓGICA INTACTA 5.5)
        window.openScannerModal = () => {
            document.getElementById('scannerModal').classList.remove('hidden'); document.getElementById('scannerModal').classList.add('flex');
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch((err) => { showToast("Error al iniciar cámara", "error"); });
        };

        window.closeScannerModal = () => {
            document.getElementById('scannerModal').classList.add('hidden'); document.getElementById('scannerModal').classList.remove('flex');
            if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(err => console.log(err));
        };

        let lastScanTime = 0;
        async function onScanSuccess(decodedText) {
            const now = Date.now();
            if (now - lastScanTime < 1500) return; 
            try {
                let scannedId = null, scannedPzas = null;
                if (decodedText.startsWith('ID:')) {
                    const parts = decodedText.split('|');
                    scannedId = parts[0].split(':')[1];
                    scannedPzas = parseInt(parts[1].split(':')[1]);
                } else if (decodedText.includes('add=')) {
                    scannedId = decodedText.split('add=')[1].split('&')[0];
                }
                if (!scannedId) return; 
                const prod = allProducts.find(p => p.id === scannedId);
                if (!prod) { showToast("El producto no existe", "error"); return; }
                if (scannedPzas === null || isNaN(scannedPzas)) scannedPzas = prod.piezas || 1; 

                lastScanTime = now;
                try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); osc.connect(ctx.destination); osc.frequency.value = 1200; osc.start(); setTimeout(() => osc.stop(), 80); } catch(e){}
                try { if ("vibrate" in navigator) navigator.vibrate([100]); } catch(e){}

                const nuevoStock = (prod.stock || 0) + scannedPzas;
                await db.ref('productos/'+scannedId).update({stock: nuevoStock});

                const overlay = document.getElementById('scanOverlay');
                document.getElementById('overlayQty').innerText = `+${scannedPzas}`;
                overlay.classList.remove('opacity-0'); overlay.classList.add('success-flash');
                document.getElementById('scanProdName').innerText = prod.name;
                document.getElementById('scanTotal').innerText = nuevoStock;

                setTimeout(() => { overlay.classList.add('opacity-0'); overlay.classList.remove('success-flash'); }, 600);
            } catch (err) { console.error(err); }
        }

        // CRUD
        window.uploadProduct = async () => { 
            if (!currentUser) return;
            const name = document.getElementById('prodName').value, cat = document.getElementById('prodCat').value, url = document.getElementById('prodFile').value, pcs = document.getElementById('prodPcs').value;
            if(!name) return showToast("Falta el nombre", "error");
            
            const btn = document.getElementById('btnUpload');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`; btn.disabled = true;
            try { 
                await db.ref('productos').push({ name, category: cat, image: url, piezas: pcs ? Number(pcs) : 0, stock: 0, activo: true, createdAt: firebase.database.ServerValue.TIMESTAMP }); 
                showToast("Producto Creado", "success"); 
                ['prodName','prodCat','prodFile','prodPcs'].forEach(id => document.getElementById(id).value = ""); 
                document.getElementById('imgPreviewBox').classList.add('hidden'); 
                closeAddModal();
            } 
            catch(e) { showToast("Error al guardar", "error"); } 
            finally { btn.innerHTML = `Guardar Producto`; btn.disabled = false; }
        };

        window.updateProduct = async (id, field, val, el) => { 
            if(!currentUser) return; 
            if (field === 'piezas' || field === 'stock') val = Number(val); 
            if(el && el.tagName === 'INPUT' && field !== 'activo') el.classList.add('text-indigo-500'); 
            try { 
                await db.ref('productos/'+id).update({[field]: val}); 
                if(el && el.tagName === 'INPUT' && field !== 'activo') { 
                    el.classList.replace('text-indigo-500', 'text-emerald-500'); 
                    setTimeout(() => el.classList.replace('text-emerald-500', 'text-slate-800'), 800); 
                } 
            } catch(e) { showToast("Error", "error"); } 
        };

        window.makeProductOld = async (id) => { if(confirm("¿Mover al final de la lista?")) { await db.ref('productos/'+id).update({createdAt: new Date('2024-01-01').getTime()}); showToast("Listo", "success"); } };
        window.cloneProduct = (id) => { 
            const p = allProducts.find(x => x.id === id); if(!p) return; 
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodCat').value = p.category;
            document.getElementById('prodPcs').value = p.piezas;
            document.getElementById('prodFile').value = p.image || '';
            previewImage(p.image);
            openAddModal();
        };
        window.deleteProduct = async (id) => { if(confirm("¿Borrar definitivamente?")) await db.ref('productos/'+id).remove(); };
        
        window.filterIncomplete = () => {
            currentFilteredProducts = allProducts.filter(p => !p.piezas || p.piezas <= 0);
            renderCatalogCards(currentFilteredProducts);
            showToast("Mostrando sin piezas", "success");
        };

        window.applyMassUpdate = async () => { const q = document.getElementById('massQtyInput').value; if(!q) return; if(confirm(`¿Aplicar ${q} pzas a los resultados actuales?`)) { const u = {}; currentFilteredProducts.forEach(p => u[`/productos/${p.id}/piezas`] = Number(q)); await db.ref().update(u); showToast("Aplicado", "success"); closeMassActions(); } };
        
        window.exportToExcel = (tipo) => {
            let csv = "\uFEFF";
            if (tipo === 'inventario') {
                csv += "Nombre,Categoria,Stock_Contado\n";
                allProducts.forEach(p => csv += `"${(p.name||"").replace(/"/g,'""')}","${(p.category||"").replace(/"/g,'""')}",${p.stock||0}\n`);
            } else {
                csv += "Nombre,Categoria,PiezasxPaq,Activo\n";
                allProducts.forEach(p => csv += `"${(p.name||"").replace(/"/g,'""')}","${(p.category||"").replace(/"/g,'""')}",${p.piezas||0},${p.activo!==false?"SI":"NO"}\n`);
            }
            const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' })); a.download = `${tipo}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
        };

        window.previewImage = (url) => { const b = document.getElementById('imgPreviewBox'), i = document.getElementById('imgPreview'); if(url && url.length > 10) { b.classList.remove('hidden'); i.src = url; i.onerror = () => b.classList.add('hidden'); } else b.classList.add('hidden'); }
        
        function showToast(msg, type="success") { 
            const t = document.getElementById('toast'), i = document.getElementById('toast-icon'), bg = document.getElementById('toast-icon-bg'); 
            document.getElementById('toast-msg').innerText = msg; 
            i.className = type === 'error' ? "fa-solid fa-xmark text-red-500" : "fa-solid fa-check text-emerald-500"; 
            bg.className = type === 'error' ? "bg-red-100" : "bg-emerald-100";
            
            t.classList.remove('-translate-y-32'); t.classList.add('translate-y-0');
            setTimeout(() => { t.classList.remove('translate-y-0'); t.classList.add('-translate-y-32'); }, 2500); 
        }
    </script>
</body>
</html>
