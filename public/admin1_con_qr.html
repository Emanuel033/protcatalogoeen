<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador Maestro - EEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .input-modern { background-color: #f1f5f9; border: 1px solid transparent; transition: all 0.2s ease; }
        .input-modern:focus { background-color: #ffffff; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }

        .cb-modern { width: 1.15rem; height: 1.15rem; border-radius: 0.375rem; border-color: #cbd5e1; color: #2563eb; cursor: pointer; transition: all 0.2s; }
        .cb-modern:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            databaseURL: "https://productoseen-default-rtdb.firebaseio.com",
            projectId: "productoseen",
            storageBucket: "productoseen.firebasestorage.app",
            messagingSenderId: "1052892398028",
            appId: "1:1052892398028:web:055e67f2aa4bce0d9c9d69"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const rtdb = firebase.database();
        const productsRef = db.collection('productos_master');
        const facturacionRef = db.collection('catalogo_facturacion');
    </script>

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-sm shadow-blue-200">
                <i class="fas fa-layer-group text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Panel Master</h1>
                <p class="text-xs text-slate-500 font-medium mt-1" id="headerSubtitle">Gestión de Catálogo y Facturación</p>
            </div>
        </div>
        <div>
            <button onclick="openEditModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition shadow-sm flex items-center gap-2">
                <i class="fas fa-plus text-xs"></i> Crear Producto
            </button>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0 z-0">
        <div class="bg-slate-100 p-1 rounded-xl flex gap-1 w-full md:w-auto">
            <button onclick="switchTab('master')" id="tabBtn-master" class="flex-1 md:flex-none px-6 py-2 rounded-lg font-semibold text-sm text-slate-600 transition hover:text-slate-900 bg-white shadow-sm text-blue-600">
                <i class="fas fa-database mr-1"></i> Catálogo
            </button>
            <button onclick="switchTab('inventario')" id="tabBtn-inventario" class="flex-1 md:flex-none px-6 py-2 rounded-lg font-semibold text-sm text-slate-600 transition hover:text-slate-900">
                <i class="fas fa-boxes mr-1"></i> Inventario
            </button>
            <button onclick="switchTab('import')" id="tabBtn-import" class="flex-1 md:flex-none px-6 py-2 rounded-lg font-semibold text-sm text-slate-600 transition hover:text-slate-900 relative">
                <i class="fas fa-cloud-download-alt mr-1"></i> Importar
                <span id="importBadge" class="absolute top-1 right-2 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full shadow hidden">0</span>
            </button>
        </div>

        <div class="relative w-full md:w-96 hidden" id="globalSearchContainer">
            <i class="fas fa-search absolute left-4 top-3 text-slate-400 text-sm"></i>
            <input type="text" id="globalSearch" onkeyup="handleGlobalSearch()" placeholder="Buscar producto, SKU o categoría..." class="w-full pl-10 pr-4 py-2.5 rounded-xl input-modern text-sm font-medium">
        </div>
    </div>

    <main class="flex-1 overflow-hidden relative">
        
        <div id="view-master" class="h-full flex flex-col w-full p-6 max-w-7xl mx-auto fade-in"></div>
        <div id="view-inventario" class="h-full flex flex-col w-full p-6 max-w-7xl mx-auto hidden fade-in"></div>
        <div id="view-import" class="h-full flex flex-col w-full p-6 max-w-7xl mx-auto hidden fade-in"></div>

    </main>

    <div id="bulkActionBar" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl z-40 hidden flex items-center gap-4 fade-in"></div>

    <div id="massEditModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"></div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 lg:p-6 opacity-0 transition-opacity duration-300"></div>

    <div id="scannerModal" class="fixed inset-0 bg-black/95 z-[90] hidden flex-col md:justify-center md:items-center p-4"></div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl hidden z-[100] font-semibold text-sm flex items-center gap-3 w-max">
        <i class="fas fa-check-circle text-green-400"></i> <span id="toastMsg"></span>
    </div>

    <button id="scannerFAB" onclick="openScannerModal()" class="fixed bottom-6 right-6 w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-40 hidden">
        <i class="fas fa-qrcode text-2xl"></i>
    </button>

    <script>
        // GLOBALES & INICIALIZACIÓN
        let allItems = [], facturacionCatalog = [], baseItems = [];
        let currentTab = 'master';
        let subcollectionListener = null;
        let html5QrCode = null, isScanPaused = false, currentScannedProd = null;

        window.onload = () => {
            document.getElementById('globalSearchContainer').classList.remove('hidden');
            initializeViews();
            setupListeners();
        }

        function initializeViews(){
            document.getElementById('view-master').innerHTML = `
                <div class="flex flex-wrap justify-between items-end gap-4 mb-4 shrink-0">
                    <div class="flex gap-4">
                        <div class="bg-white px-5 py-4 rounded-2xl shadow-sm border border-slate-200 min-w-[140px]">
                            <p class="text-[11px] text-slate-500 font-bold uppercase tracking-wider mb-1">Productos Master</p>
                            <p class="text-3xl font-black text-slate-800" id="count-total">0</p>
                        </div>
                        <div onclick="togglePendingFilter()" class="bg-white hover:bg-slate-50 cursor-pointer transition px-5 py-4 rounded-2xl shadow-sm border border-slate-200 min-w-[140px] relative overflow-hidden group">
                            <div class="absolute inset-0 bg-amber-500/5 transition-opacity opacity-0 group-hover:opacity-100"></div>
                            <p class="text-[11px] text-amber-600 font-bold uppercase tracking-wider mb-1">Falta Configurar</p>
                            <p class="text-3xl font-black text-amber-600" id="count-pending">0</p>
                        </div>
                    </div>
                    <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2.5 rounded-xl border border-slate-200 font-semibold text-sm shadow-sm hover:bg-slate-50 transition select-none">
                        <input type="checkbox" id="filterPending" onchange="filterTable()" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                        <span class="text-slate-700">Mostrar solo Faltantes</span>
                    </label>
                </div>
                <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative">
                    <div class="overflow-y-auto flex-1 hide-scroll p-1">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 border-b border-slate-100 sticky top-0 z-10 text-slate-500 text-xs uppercase tracking-wider font-semibold">
                                <tr>
                                    <th class="px-4 py-4 rounded-tl-xl w-12 text-center"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="cb-modern focus:ring-blue-500"></th>
                                    <th class="px-6 py-4">Producto</th>
                                    <th class="px-6 py-4">Categoría</th>
                                    <th class="px-6 py-4">Cód. Facturación</th>
                                    <th class="px-6 py-4 text-right rounded-tr-xl">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>`;

            document.getElementById('view-inventario').innerHTML = `
                <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative">
                    <div class="overflow-y-auto flex-1 hide-scroll p-2" id="inventoryGrid"></div>
                </div>`;

            document.getElementById('view-import').innerHTML = `
                <div class="mb-4 shrink-0 bg-blue-50 border border-blue-100 rounded-2xl p-5 flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl shrink-0"><i class="fas fa-sync-alt"></i></div>
                    <div>
                        <h2 class="font-bold text-slate-900 text-lg">Pendientes de Importar</h2>
                        <p class="text-sm text-slate-600 mt-0.5">Aquí están los códigos de tu sistema que aún no existen en el Catálogo Master.</p>
                    </div>
                </div>
                <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="overflow-y-auto flex-1 hide-scroll p-1">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-50 border-b border-slate-100 sticky top-0 z-10 text-slate-500 text-xs uppercase tracking-wider font-semibold">
                                <tr>
                                    <th class="px-6 py-4 w-1/4 rounded-tl-xl">Cód. Facturación</th>
                                    <th class="px-6 py-4">Descripción Oficial</th>
                                    <th class="px-6 py-4 text-right rounded-tr-xl w-32">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="importTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>`;

            document.getElementById('scannerModal').innerHTML = `
                <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent text-white shrink-0 absolute top-0 left-0 w-full z-20">
                    <div>
                        <h3 class="font-bold text-base leading-none"><i class="fas fa-qrcode text-blue-400"></i> Auditoría de Inventario</h3>
                        <p class="text-[10px] text-gray-300 mt-0.5">Escanea el QR de un producto</p>
                    </div>
                    <button onclick="closeScannerModal()" class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-red-500 transition-colors backdrop-blur-md"><i class="fas fa-times"></i></button>
                </div>
                <div class="w-full max-w-xs overflow-hidden rounded-[2rem] border-4 border-blue-500/30 shadow-[0_0_40px_rgba(59,130,241,0.15)] bg-black relative transition-all duration-300">
                    <div id="reader"></div>
                </div>
                <div id="scanPanelAdjust" class="hidden absolute bottom-0 w-full max-w-sm bg-white rounded-t-3xl p-5 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-30 slide-up border-t border-slate-200 pb-8"></div>`;
        }

        function setupListeners() {
            productsRef.onSnapshot((snapshot) => {
                allItems = []; baseItems = []; let pendingCount = 0;
                snapshot.forEach((doc) => {
                    const item = { id: doc.id, ...doc.data() };
                    allItems.push(item);
                    if(!item.tipo_item || item.tipo_item === 'PIEZA_BASE') baseItems.push(item);
                    if (!item.codigo_sistema_oficial || item.codigo_sistema_oficial.trim() === '') pendingCount++;
                });
                document.getElementById('count-total').innerText = allItems.length;
                document.getElementById('count-pending').innerText = pendingCount;
                handleGlobalSearch(); 
            });

            facturacionRef.onSnapshot((snapshot) => {
                facturacionCatalog = [];
                snapshot.forEach(doc => { facturacionCatalog.push({ id: doc.id, ...doc.data() }); });
                handleGlobalSearch();
            });
        }

        function showToast(msg, type = 'success') { /*...*/ }

        // NAVEGACIÓN Y RENDERIZADO DE VISTAS
        function switchTab(tab) {
            currentTab = tab;
            clearBulkSelection();
            ['master', 'inventario', 'import'].forEach(t => {
                const btn = document.getElementById(`tabBtn-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.remove('hover:text-slate-900');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.add('hover:text-slate-900');
                    view.classList.add('hidden');
                }
            });

            document.getElementById('scannerFAB').classList.toggle('hidden', tab !== 'inventario');
            const subtitles = { master: 'Gestión de Catálogo', inventario: 'Auditoría de Stock', import: 'Sincronizar con Sistema' };
            document.getElementById('headerSubtitle').innerText = subtitles[tab];

            document.getElementById('globalSearch').value = '';
            handleGlobalSearch();
        }

        function handleGlobalSearch() {
            clearBulkSelection();
            if (currentTab === 'master') filterTable();
            else if (currentTab === 'inventario') renderInventoryView();
            else renderImportTable();
        }

        // VISTA: INVENTARIO
        function renderInventoryView() {
            const grid = document.getElementById('inventoryGrid');
            const term = document.getElementById('globalSearch').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allItems.filter(p => (p.nombre_flexible || '').toLowerCase().includes(term) || (p.codigo_sistema_oficial || '').toLowerCase().includes(term));
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div class="text-center py-12 text-slate-500"><i class="fas fa-box-open text-4xl mb-3"></i><p class="font-semibold">No se encontraron productos</p></div>`;
                return;
            }
            
            const cardsHTML = filtered.map(p => {
                const stock = p.stock_total_piezas || 0;
                const pzasPaq = p.piezas_por_caja_original || 1;
                return `
                <div class="bg-white p-3 rounded-xl border flex flex-col gap-2 transition-colors fade-in hover:shadow-md ${stock > 0 ? 'border-slate-200' : 'border-amber-200 bg-amber-50/30'}">
                    <div class="flex items-center gap-3">
                        <img src="${p.imagen_url || 'https://via.placeholder.com/40'}" class="w-10 h-10 object-cover rounded-lg border border-slate-200 shrink-0">
                        <div class="flex-grow min-w-0">
                            <h3 class="font-bold text-slate-800 text-sm leading-snug truncate">${p.nombre_flexible}</h3>
                            <p class="text-[10px] font-bold text-slate-400 mt-0.5 font-mono">${p.codigo_sistema_oficial || 'S/SKU'}</p>
                        </div>
                        <div class="shrink-0 flex flex-col items-end bg-slate-100 p-2 rounded-lg border border-slate-200 w-24">
                            <span class="text-[8px] text-slate-500 font-bold mb-0.5 uppercase tracking-wider">Stock</span>
                            <input id="inv-stock-${p.id}" type="number" onchange="updateStock('${p.id}', this.value)" value="${stock}" class="w-full text-right bg-transparent py-0.5 font-black text-blue-700 text-xl outline-none transition-all p-0">
                        </div>
                    </div>
                </div>`;
            }).join('');
            grid.innerHTML = `<div class="space-y-2">${cardsHTML}</div>`;
        }

        async function updateStock(id, newValue) {
            const stock = parseInt(newValue);
            if (isNaN(stock) || stock < 0) {
                showToast('Valor de stock inválido', 'error');
                renderInventoryView(); // Re-render to show original value
                return;
            }
            try {
                await productsRef.doc(id).update({ stock_total_piezas: stock });
                showToast('Stock actualizado');
            } catch(e) {
                showToast('Error al actualizar', 'error');
            }
        }
        
        // VISTA: CATÁLOGO MASTER
        function filterTable() { /* Implementación original */ }
        function togglePendingFilter() { /* ... */ }
        // ... resto de funciones de Master y Bulk

        // VISTA: IMPORTAR
        function renderImportTable() { /* Implementación original */ }

        // LÓGICA DEL ESCÁNER QR
        window.openScannerModal = () => {
            document.getElementById('scannerModal').classList.remove('hidden'); 
            document.getElementById('scannerModal').classList.add('flex');
            isScanPaused = false;
            resetScanUI();

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch((err) => { showToast("Error de cámara", "error"); });
        };

        window.closeScannerModal = () => {
            document.getElementById('scannerModal').classList.add('hidden'); 
            document.getElementById('scannerModal').classList.remove('flex');
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        };

        function onScanSuccess(decodedText) {
            if (isScanPaused) return;
            try {
                if (!decodedText.startsWith('SKU:')) return; 
                const scannedSku = decodedText.split(':')[1];
                
                const prod = allItems.find(p => p.codigo_sistema_oficial === scannedSku);
                if (!prod) { showToast(`SKU [${scannedSku}] no encontrado`, "error"); return; }

                isScanPaused = true;
                currentScannedProd = prod;
                
                navigator.vibrate(50);

                document.getElementById('reader').classList.add('opacity-40');
                const panelAdj = document.getElementById('scanPanelAdjust');
                panelAdj.classList.remove('hidden');
                panelAdj.innerHTML = `
                    <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>
                    <h3 class="font-bold text-slate-900 text-base leading-tight truncate px-2 text-center">${prod.nombre_flexible}</h3>
                    <p class="text-center text-[10px] text-slate-500 font-bold mt-1 mb-4 bg-slate-100 py-1 px-3 rounded-full w-max mx-auto border border-slate-200"><i class="fas fa-box-open text-blue-500 mr-1"></i> Contiene <span class="font-bold text-slate-800">${prod.piezas_por_caja_original || 1}</span> pzas x caja</p>
                    <div class="space-y-2.5">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div><label class="text-xs font-bold text-slate-500">Cajas</label><input id="adjInputPaq" type="number" value="1" class="w-full text-center font-black text-blue-700 text-3xl outline-none bg-slate-100 p-2 rounded-lg mt-1"></div>
                            <div><label class="text-xs font-bold text-slate-500">Piezas</label><input id="adjInputSue" type="number" value="0" class="w-full text-center font-black text-slate-800 text-3xl outline-none bg-slate-100 p-2 rounded-lg mt-1"></div>
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2.5">
                        <button onclick="cancelAdjust()" class="w-14 h-14 shrink-0 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl font-bold flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
                        <button onclick="confirmAdjust()" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md flex items-center justify-center active:scale-95 transition-all text-2xl font-black"><i class="fas fa-check mr-2"></i> Guardar</button>
                    </div>`;
                
            } catch (err) { console.error(err); isScanPaused = false; }
        }

        function resetScanUI() {
            document.getElementById('reader').classList.remove('opacity-40');
            document.getElementById('scanPanelAdjust').classList.add('hidden');
            currentScannedProd = null;
        }

        window.cancelAdjust = () => { resetScanUI(); isScanPaused = false; };

        async function confirmAdjust() {
            if(!currentScannedProd) return;
            const cajas = parseInt(document.getElementById('adjInputPaq').value) || 0;
            const sueltas = parseInt(document.getElementById('adjInputSue').value) || 0;
            const pzasPorCaja = currentScannedProd.piezas_por_caja_original || 1;
            const totalContado = (cajas * pzasPorCaja) + sueltas;

            try {
                await productsRef.doc(currentScannedProd.id).update({ stock_total_piezas: totalContado });
                showToast(`${currentScannedProd.nombre_flexible}\nStock actualizado a: ${totalContado}`);
                navigator.vibrate([100, 50, 100]);
                resetScanUI();
                isScanPaused = false; // Listo para el siguiente escaneo
            } catch(e) {
                showToast('Error al guardar en la nube', 'error');
            }
        };

        // --- FUNCIONES PARA QR ---
        function getBaseUrl() { /* Implementación original */ }
        function buildPrintHTML(product, qty, printType, baseUrl) { /* ... */ }
        function printSingleQR(id, printType) { /* ... */ }

        // ... El resto de tus funciones de Modales, Forms, etc.
    </script>
</body>
