<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Envases La Económica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- JS Logic -->
    <script src="assets/js/firebase-config.js" defer></script>
    <script src="assets/js/login.js" defer></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full glass-effect p-8 rounded-2xl shadow-2xl relative overflow-hidden fade-in">
        <div class="text-center mb-8">
            <div class="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-cube text-3xl text-indigo-600"></i></div>
            <h1 class="text-2xl font-bold text-slate-800">Panel Admin</h1>
        </div>
        <div class="space-y-4">
            <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo</label><div class="relative"><i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="email" id="email" class="w-full pl-10 pr-4 py-3 rounded-xl border bg-slate-50/50" onkeyup="checkEnter(event)"></div></div>
            <div><label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label><div class="relative"><i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="password" id="password" class="w-full pl-10 pr-10 py-3 rounded-xl border bg-slate-50/50" onkeyup="checkEnter(event)"><button onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-eye" id="toggleIcon"></i></button></div></div>
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Iniciar Sesión</button>
            <div class="flex justify-between mt-4 text-sm"><button onclick="forgotPassword()" class="text-indigo-500">¿Olvidaste contraseña?</button><a href="index.html" class="text-slate-400">Volver al Catálogo</a></div>
        </div>
        <div id="status-msg" class="hidden mt-4 text-center text-sm font-medium p-2 rounded-lg flex items-center justify-center gap-2"><i></i><span></span></div>
    </div>
</body>
</html>
