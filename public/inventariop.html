<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auditoría Continua - EEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
        #reader video { object-fit: cover; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .mic-active { animation: pulse-red 1.5s infinite; color: #ef4444 !important; }
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <script src="assets/js/firebase-config.js"></script>

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-4 flex flex-col md:flex-row md:justify-between items-center z-20 shrink-0 gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-900/50 shrink-0">
                <i class="fas fa-clipboard-list text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight leading-none" data-i18n="titulo">Inventario Continuo</h1>
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mt-1" id="catStatus">Cargando catálogo...</p>
            </div>
        </div>
        
        <div class="flex gap-3 w-full md:w-auto flex-wrap">
            <button onclick="toggleLang()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-4 py-2 rounded-xl font-bold transition-all flex items-center gap-2">
                <span id="langFlag">🇲🇽</span> <span id="langText">ES</span>
            </button>
            <button onclick="descargarCSVLocal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-blue-900/20 transition-all flex items-center gap-2">
                <i class="fas fa-file-excel"></i> <span>CSV</span>
            </button>
            <button onclick="enviarAuditoriaLote()" class="flex-1 md:w-auto bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-emerald-500/20 transition-all">
                <i class="fas fa-cloud-upload-alt mr-2"></i><span data-i18n="btnGuardar">Guardar Nube</span>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto custom-scroll p-4 max-w-5xl mx-auto w-full flex flex-col gap-6 relative">
        
        <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 flex flex-col gap-4 shrink-0">
            <div class="flex gap-2">
                <button id="btnStartScan" onclick="startScanner()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-4 rounded-2xl font-bold transition-all flex items-center justify-center gap-2 shrink-0">
                    <i class="fas fa-camera text-xl"></i>
                </button>
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="manualCode" list="opcionesProductos" data-i18n-placeholder="buscarPlaceholder" placeholder="Buscar código o nombre..." class="w-full h-full bg-slate-900 border border-slate-700 text-white text-base font-bold rounded-2xl py-4 pl-12 pr-4 focus:border-blue-500 outline-none transition-all" onkeypress="if(event.key === 'Enter') agregarALista(this.value)" onchange="verificarSeleccion(this.value)">
                </div>
            </div>
            
            <div id="readerWrapper" class="hidden w-full bg-slate-900 rounded-2xl overflow-hidden aspect-video relative border border-slate-700">
                <div id="reader" class="absolute inset-0 w-full h-full"></div>
                <button onclick="stopScanner()" class="absolute top-2 right-2 bg-red-500 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg z-10"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <div id="emptyState" class="text-center py-12 text-slate-500 flex flex-col items-center">
            <i class="fas fa-boxes text-6xl mb-4 text-slate-700"></i>
            <p class="font-bold text-lg" data-i18n="listaVacia">La lista está vacía.</p>
            <p class="text-sm mt-1" data-i18n="listaVaciaSub">Busca o escanea un producto para comenzar.</p>
        </div>

        <div id="listaInventario" class="flex flex-col gap-4 pb-20"></div>

        <datalist id="opcionesProductos"></datalist>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl hidden z-50 font-bold text-sm items-center gap-3 w-max border border-slate-600 transition-opacity duration-300">
        <i id="toastIcon" class="fas fa-info-circle text-blue-400 text-lg"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // ==========================================
        // SISTEMA BILINGÜE
        // ==========================================
        const diccionarios = {
            es: {
                titulo: "Inventario Continuo",
                buscarPlaceholder: "Buscar código o nombre...",
                listaVacia: "La lista está vacía.",
                listaVaciaSub: "Busca o escanea un producto para comenzar.",
                btnGuardar: "Guardar Nube",
                stockSistema: "STOCK SISTEMA",
                totalFisico: "TOTAL FÍSICO",
                ajuste: "AJUSTE",
                entrada: "ENTRADA",
                salida: "SALIDA",
                ok: "CORRECTO",
                sueltas: "Sueltas (1pz)",
                paquete: "Paquete",
                caja: "Caja",
                btnNuevoEmpaque: "Añadir empaque no registrado",
                promptPiezas: "¿Cuántas piezas tiene este nuevo paquete/caja?",
                codigoNuevo: "Código no registrado. Agregado para registro temporal.",
                desconocido: "Desconocido / Sin Registro",
                pz_abrev: "pz",
                txtNuevoPaquete: "Nuevo Paquete ({pz}pz) ✨",
                escuchando: "Habla ahora... di la cantidad",
                noEntendido: "No pude entender el número",
                microNoSoportado: "Dictado no soportado en este dispositivo"
            },
            fr: {
                titulo: "Inventaire Continu",
                buscarPlaceholder: "Rechercher code ou nom...",
                listaVacia: "La liste est vide.",
                listaVaciaSub: "Scannez ou recherchez un produit pour commencer.",
                btnGuardar: "Tout Enregistrer",
                stockSistema: "STOCK SYSTÈME",
                totalFisico: "TOTAL PHYSIQUE",
                ajuste: "AJUSTEMENT",
                entrada: "ENTRÉE",
                salida: "SORTIE",
                ok: "CORRECT",
                sueltas: "À l'unité (1pc)",
                paquete: "Paquet",
                caja: "Boîte",
                btnNuevoEmpaque: "Ajouter un paquet non enregistré",
                promptPiezas: "Combien de pièces contient ce nouveau paquet/boîte ?",
                codigoNuevo: "Code non enregistré. Ajouté temporairement.",
                desconocido: "Inconnu / Non enregistré",
                pz_abrev: "pc",
                txtNuevoPaquete: "Nouveau Paquet ({pz}pc) ✨",
                escuchando: "Parlez maintenant... dites la quantité",
                noEntendido: "Je n'ai pas compris le nombre",
                microNoSoportado: "Dictée non prise en charge sur cet appareil"
            }
        };

        let currentLang = 'es';

        function toggleLang() {
            currentLang = currentLang === 'es' ? 'fr' : 'es';
            document.getElementById('langFlag').innerText = currentLang === 'es' ? '🇲🇽' : '🇫🇷';
            document.getElementById('langText').innerText = currentLang === 'es' ? 'ES' : 'FR';
            aplicarTextos();
            renderLista(); 
        }

        function aplicarTextos() {
            const t = diccionarios[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(t[key]) el.innerText = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(t[key]) el.placeholder = t[key];
            });
        }

        // ==========================================
        // VARIABLES GLOBALES Y CATÁLOGO
        // ==========================================
        let catalogoEnMemoria = [];
        let listaConteo = []; 
        let html5QrcodeScanner = null;

        async function loadJSONCatalog() {
            try {
                const response = await fetch('catalogo_completo.json');
                if (!response.ok) throw new Error("JSON no encontrado");
                catalogoEnMemoria = await response.json();
                
                const datalist = document.getElementById('opcionesProductos');
                datalist.innerHTML = ''; 
                let countItems = 0;

                catalogoEnMemoria.forEach(p => {
                    if (p.tipo_item === 'PIEZA_BASE' || p.tipo_item === 'KIT_OFICIAL') {
                        const option = document.createElement('option');
                        option.value = p.codigo; 
                        option.textContent = p.descripcion_oficial || p.nombre; 
                        datalist.appendChild(option);
                        countItems++;
                    }
                });
                document.getElementById('catStatus').innerHTML = `<i class="fas fa-check-circle text-emerald-400"></i> ${countItems} items`;
            } catch (error) {
                document.getElementById('catStatus').innerHTML = `<i class="fas fa-exclamation-triangle text-red-400"></i> Error Catálogo`;
                showToast("No se pudo cargar el catálogo", "error");
            }
        }

        function startScanner() {
            const wrapper = document.getElementById('readerWrapper');
            wrapper.classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 250} },
                (decodedText) => {
                    stopScanner();
                    agregarALista(decodedText);
                }, 
                (err) => {}
            ).catch(err => { showToast("Cámara no disponible", "error"); stopScanner(); });
        }

        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('readerWrapper').classList.add('hidden');
                }).catch(e => console.log(e));
            }
        }

        function verificarSeleccion(valor) {
            if(valor.trim() !== '') {
                agregarALista(valor);
            }
        }

        function agregarALista(codigoBuscado) {
            codigoBuscado = String(codigoBuscado).trim();
            if(!codigoBuscado) return;
            const input = document.getElementById('manualCode');
            input.value = ''; input.blur();

            let prodBase = catalogoEnMemoria.find(p => String(p.codigo).toLowerCase() === codigoBuscado.toLowerCase());
            
            if (!prodBase) {
                for (const p of catalogoEnMemoria) {
                    const empaques = p.paquetes || p.empaques || [];
                    if (empaques.some(e => String(e.sku).toLowerCase() === codigoBuscado.toLowerCase() || String(e.codigo_barras).toLowerCase() === codigoBuscado.toLowerCase())) {
                        prodBase = p; break;
                    }
                }
            }

            if (!prodBase) {
                const t = diccionarios[currentLang];
                showToast(t.codigoNuevo, "info");
                prodBase = {
                    codigo: codigoBuscado,
                    nombre: `[❓] ${t.desconocido} (${codigoBuscado})`,
                    descripcion_oficial: "Paquete o Producto no registrado en sistema",
                    stock: 0, 
                    empaques: [] 
                };
            }

            if (listaConteo.find(item => String(item.codigo) === String(prodBase.codigo))) {
                const row = document.getElementById(`row_${prodBase.codigo}`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.classList.add('ring-2', 'ring-blue-500');
                    setTimeout(() => row.classList.remove('ring-2', 'ring-blue-500'), 1500);
                }
                return;
            }

            let variantes = [];
            const empaques = prodBase.paquetes || prodBase.empaques || [];
            
            variantes.push({ id: 'sueltas', sku: null, pz: 1, contadas: 0, isFantasma: false });
            
            empaques.forEach((emp, index) => {
                variantes.push({ 
                    id: `emp_${index}`, 
                    sku: emp.sku || null,
                    pz: parseInt(emp.piezas), 
                    contadas: 0, 
                    isFantasma: false
                });
            });

            variantes.sort((a,b) => b.pz - a.pz);

            listaConteo.unshift({
                codigo: String(prodBase.codigo),
                nombre: prodBase.descripcion_oficial || prodBase.nombre,
                stockSistema: parseFloat(prodBase.stock || 0),
                variantes: variantes,
                totalFisico: 0,
                es_desconocido: prodBase.stock === 0 && prodBase.nombre.includes('[❓]')
            });

            renderLista();
        }

        window.agregarEmpaqueNuevo = (codigoStr) => {
            const prod = listaConteo.find(p => String(p.codigo) === String(codigoStr));
            if(!prod) return;
            
            let pzInput = prompt(diccionarios[currentLang].promptPiezas, "12");
            if(pzInput === null) return;
            pzInput = pzInput.trim();
            if(pzInput === "") return;
            
            const pz = parseInt(pzInput, 10);
            if(isNaN(pz) || pz <= 1) return showToast("Ingresa un número válido mayor a 1", "error");

            prod.variantes.push({
                id: 'fantasma_' + Date.now(),
                sku: null,
                pz: pz,
                contadas: 0,
                isFantasma: true
            });
            
            prod.variantes.sort((a,b) => b.pz - a.pz);
            renderLista();
        };

        window.iniciarDictado = (codigoProd, varId, btnElement) => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const t = diccionarios[currentLang];

            if (!SpeechRecognition) {
                return showToast(t.microNoSoportado, "error");
            }

            const recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'es' ? 'es-MX' : 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = false;

            const icon = btnElement.querySelector('i');
            icon.classList.add('mic-active');
            showToast(t.escuchando, "info");

            recognition.onresult = (event) => {
                icon.classList.remove('mic-active');
                const transcript = event.results[0][0].transcript.toLowerCase().trim();
                const numeroEncontrado = transcript.match(/\d+/);
                
                if (numeroEncontrado) {
                    const num = parseInt(numeroEncontrado[0], 10);
                    manualCant(codigoProd, varId, num);
                    showToast(`+ ${num} piezas guardadas`, "success");
                } else {
                    showToast(t.noEntendido, "error");
                }
            };

            recognition.onerror = (event) => {
                icon.classList.remove('mic-active');
                showToast("Error de micrófono", "error");
            };

            recognition.onend = () => {
                icon.classList.remove('mic-active');
            };

            recognition.start();
        };

        // ==========================================
        // RENDERIZAR INTERFAZ Y CÁLCULOS
        // ==========================================
        function renderLista() {
            const container = document.getElementById('listaInventario');
            const empty = document.getElementById('emptyState');
            const t = diccionarios[currentLang];

            if (listaConteo.length === 0) {
                empty.classList.remove('hidden');
                container.innerHTML = '';
                return;
            }
            
            empty.classList.add('hidden');
            let htmlChunks = [];

            listaConteo.forEach((item) => {
                const diferencia = item.totalFisico - item.stockSistema;
                let badgeHtml = '';
                let borderColor = 'border-slate-700';
                let nombreClass = item.es_desconocido ? 'text-amber-400' : 'text-white';

                // Escapar comillas para inyección HTML segura
                const safeCod = String(item.codigo).replace(/'/g, "\\'").replace(/"/g, '&quot;');

                if (diferencia > 0) {
                    badgeHtml = `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-arrow-up"></i> ${t.entrada} (+${diferencia})</span>`;
                    borderColor = 'border-emerald-500/50';
                } else if (diferencia < 0) {
                    badgeHtml = `<span class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-arrow-down"></i> ${t.salida} (${diferencia})</span>`;
                    borderColor = 'border-red-500/50';
                } else {
                    badgeHtml = `<span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-check"></i> ${t.ok}</span>`;
                }

                let variantesHtml = item.variantes.map((v) => {
                    const safeVarId = String(v.id).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    let label = '';
                    
                    if (v.id === 'sueltas') {
                        label = t.sueltas;
                    } else if (v.isFantasma) {
                        label = t.txtNuevoPaquete.replace('{pz}', v.pz);
                    } else {
                        label = v.sku ? `${v.sku} (${v.pz}${t.pz_abrev})` : `${v.pz >= 500 ? t.caja : t.paquete} (${v.pz}${t.pz_abrev})`;
                    }

                    const textClass = v.isFantasma ? 'text-amber-400' : 'text-slate-400';

                    return `
                    <div class="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
                        <span class="text-xs font-bold ${textClass} flex-1">${label}</span>
                        <div class="flex items-center gap-1.5">
                            <button onclick="iniciarDictado('${safeCod}', '${safeVarId}', this)" class="w-10 h-10 rounded-lg bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition text-lg border border-slate-700"><i class="fas fa-microphone"></i></button>
                            <div class="flex items-center gap-2 bg-slate-900 rounded-xl p-1 border border-slate-700">
                                <button onclick="cambiarCant('${safeCod}', '${safeVarId}', -1)" class="w-10 h-10 rounded-lg bg-slate-800 text-slate-300 active:bg-slate-700 text-lg"><i class="fas fa-minus"></i></button>
                                <input type="number" min="0" value="${v.contadas}" oninput="manualCant('${safeCod}', '${safeVarId}', this.value)" onfocus="this.select()" class="w-12 text-center font-black text-white bg-transparent outline-none text-lg">
                                <button onclick="cambiarCant('${safeCod}', '${safeVarId}', 1)" class="w-10 h-10 rounded-lg bg-blue-600 text-white active:bg-blue-500 text-lg"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                htmlChunks.push(`
                <div id="row_${item.codigo}" class="bg-slate-800 p-4 rounded-3xl border ${borderColor} transition-colors shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1 pr-4">
                            <h3 class="font-black text-lg ${nombreClass} leading-tight">${item.nombre}</h3>
                            <p class="font-mono text-xs text-blue-400 mt-1">${item.codigo}</p>
                        </div>
                        <button onclick="eliminarDeLista('${safeCod}')" class="text-slate-500 hover:text-red-400 p-2"><i class="fas fa-trash"></i></button>
                    </div>

                    <div class="bg-slate-900/50 rounded-2xl p-3 mb-2">
                        ${variantesHtml}
                    </div>
                    
                    <button onclick="agregarEmpaqueNuevo('${safeCod}')" class="w-full text-center text-[10px] text-blue-400 font-bold py-2.5 mb-4 hover:bg-slate-700 rounded-xl border border-dashed border-slate-600 transition-colors uppercase tracking-wider">
                        <i class="fas fa-plus mr-1"></i> <span data-i18n="btnNuevoEmpaque">${t.btnNuevoEmpaque}</span>
                    </button>

                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div class="bg-slate-900 rounded-2xl p-3 border border-slate-700 text-center">
                            <p class="text-[10px] font-bold text-slate-500 tracking-widest uppercase" data-i18n="stockSistema">${t.stockSistema}</p>
                            <p class="text-2xl font-black text-slate-300">${item.stockSistema}</p>
                        </div>
                        <div class="bg-blue-900/30 rounded-2xl p-3 border border-blue-900/50 text-center relative overflow-hidden">
                            <p class="text-[10px] font-bold text-blue-400 tracking-widest uppercase" data-i18n="totalFisico">${t.totalFisico}</p>
                            <p class="text-3xl font-black text-white" id="totFisico_${item.codigo}">${item.totalFisico}</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-center px-2 mt-3" id="ajusteBadge_${item.codigo}">
                        <span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase" data-i18n="ajuste">${t.ajuste}:</span>
                        ${badgeHtml}
                    </div>
                </div>`);
            });
            
            container.innerHTML = htmlChunks.join('');
        }

        window.cambiarCant = (codigoProd, varId, delta) => {
            const prod = listaConteo.find(p => String(p.codigo) === String(codigoProd));
            if(!prod) return;
            const variante = prod.variantes.find(v => String(v.id) === String(varId));
            if(!variante) return;
            variante.contadas += delta;
            if(variante.contadas < 0) variante.contadas = 0;
            recalcularTotalProducto(prod);
        };

        window.manualCant = (codigoProd, varId, val) => {
            const prod = listaConteo.find(p => String(p.codigo) === String(codigoProd));
            if(!prod) return;
            const variante = prod.variantes.find(v => String(v.id) === String(varId));
            if(!variante) return;
            let num = parseInt(val, 10);
            if(isNaN(num) || num < 0) num = 0;
            variante.contadas = num;
            recalcularTotalProducto(prod);
        };

        function recalcularTotalProducto(prod) {
            prod.totalFisico = prod.variantes.reduce((sum, v) => sum + (v.pz * v.contadas), 0);
            
            const txtTotal = document.getElementById(`totFisico_${prod.codigo}`);
            if(txtTotal) txtTotal.innerText = prod.totalFisico;
            
            const t = diccionarios[currentLang];
            const dif = prod.totalFisico - prod.stockSistema;
            const card = document.getElementById(`row_${prod.codigo}`);
            const badgeCont = document.getElementById(`ajusteBadge_${prod.codigo}`);
            
            if(!card || !badgeCont) return;

            if (dif > 0) {
                card.className = "bg-slate-800 p-4 rounded-3xl border border-emerald-500/50 transition-colors shadow-lg";
                badgeCont.innerHTML = `<span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">${t.ajuste}:</span><span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-arrow-up"></i> ${t.entrada} (+${dif})</span>`;
            } else if (dif < 0) {
                card.className = "bg-slate-800 p-4 rounded-3xl border border-red-500/50 transition-colors shadow-lg";
                badgeCont.innerHTML = `<span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">${t.ajuste}:</span><span class="bg-red-500/20 text-red-400 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-arrow-down"></i> ${t.salida} (${dif})</span>`;
            } else {
                card.className = "bg-slate-800 p-4 rounded-3xl border border-slate-700 transition-colors shadow-lg";
                badgeCont.innerHTML = `<span class="text-[10px] font-bold text-slate-500 tracking-widest uppercase">${t.ajuste}:</span><span class="bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] font-black tracking-wider"><i class="fas fa-check"></i> ${t.ok}</span>`;
            }
        }

        window.eliminarDeLista = (codigoStr) => {
            listaConteo = listaConteo.filter(p => String(p.codigo) !== String(codigoStr));
            renderLista();
        };

        window.descargarCSVLocal = () => {
            if(listaConteo.length === 0) return showToast(diccionarios[currentLang].listaVacia, "error");
            
            let csv = "\uFEFFCodigo,Producto,Stock Sistema,Total Fisico,Ajuste,Detalle Empaques\n";
            
            listaConteo.forEach(item => {
                const dif = item.totalFisico - item.stockSistema;
                let desgloseArr = item.variantes.filter(v => v.contadas > 0).map(v => {
                    let nombreCol = v.id === 'sueltas' ? 'Sueltas' : (v.sku ? v.sku : (v.isFantasma ? `NuevoPaquete(${v.pz}pz)` : `Empaque(${v.pz}pz)`));
                    return `${nombreCol}: ${v.contadas}`;
                });
                let desgloseStr = desgloseArr.length > 0 ? desgloseArr.join(" | ") : "Sin conteo";
                let nombreLimpio = item.nombre.replace(/"/g, '""');
                
                csv += `"${item.codigo}","${nombreLimpio}",${item.stockSistema},${item.totalFisico},${dif},"${desgloseStr}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Corte_Inventario_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("Excel descargado", "success");
        };

        async function enviarAuditoriaLote() {
            if(listaConteo.length === 0) return showToast(diccionarios[currentLang].listaVacia, "error");

            const btn = event.currentTarget;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                if (typeof db === 'undefined') throw new Error("Firebase DB no inicializado.");
                const batch = db.batch();
                
                listaConteo.forEach(item => {
                    const docRef = db.collection('auditorias_pendientes').doc(); 
                    const desgloseFormateado = item.variantes.map(v => {
                        let nombreColumna = '';
                        if (v.id === 'sueltas') nombreColumna = 'Piezas Sueltas';
                        else if (v.isFantasma) nombreColumna = `Paquete Nuevo (${v.pz}pz)`;
                        else nombreColumna = v.sku ? `${v.sku} (${v.pz}pz)` : `Empaque (${v.pz}pz)`;

                        return {
                            tipo: v.id === 'sueltas' ? 'sueltas' : (v.isFantasma ? 'nuevo' : 'registrado'),
                            sku: v.sku || 'N/A',
                            piezas_por_empaque: v.pz,
                            cantidad_contada: v.contadas,
                            nombre_columna: nombreColumna 
                        };
                    });

                    batch.set(docRef, {
                        codigo_contpaqi: item.codigo,
                        nombre_producto: item.nombre,
                        esperado: item.stockSistema,
                        conteo_fisico: item.totalFisico,
                        ajuste_calculado: item.totalFisico - item.stockSistema,
                        estado: 'pendiente',
                        fecha: firebase.firestore.FieldValue.serverTimestamp(),
                        usuario: 'Tablet Almacén',
                        desglose: desgloseFormateado
                    });
                });

                await batch.commit();
                showToast("¡Inventario enviado a la nube!");
                listaConteo = [];
                renderLista();
            } catch(error) {
                console.error("Error guardando en Firebase:", error);
                showToast("Error. Usa el botón de CSV.", "error");
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').innerText = msg;
            
            if (type === 'error') {
                icon.className = "fas fa-exclamation-circle text-red-400 text-lg";
            } else if (type === 'info') {
                icon.className = "fas fa-info-circle text-amber-400 text-lg";
            } else {
                icon.className = "fas fa-check-circle text-emerald-400 text-lg";
            }
            
            t.classList.remove('hidden'); t.classList.add('flex');
            setTimeout(() => { t.classList.add('hidden'); t.classList.remove('flex'); }, 4000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            aplicarTextos();
            loadJSONCatalog();
        });
    </script>
</body>
</html>
