<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configurador Maestro - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- LIBRERÍAS PARA QR, CÁMARA Y EXCEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- PWA Manifest & App Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll:hover::-webkit-scrollbar-thumb { background: #94a3b8; }
        
        /* Animaciones Premium */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Estilo de Inputs modernos */
        .input-modern {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-modern:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1) !important;
        }

        /* Checkbox personalizado */
        .cb-modern {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.375rem;
            border-color: #cbd5e1;
            color: #2563eb;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cb-modern:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        /* Efecto Glass */
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
        }

        #reader { border: none !important; border-radius: 1rem; overflow: hidden; }
        #reader video { object-fit: cover; }
        
        .sort-icon { opacity: 0.3; transition: opacity 0.2s; }
        .sort-active { opacity: 1; color: #3b82f6; }
    </style>
</head>
<body class="h-screen flex overflow-hidden relative pb-[70px] md:pb-0">

    <!-- CREDENCIALES FIREBASE CENTRALIZADAS -->
    <script src="assets/js/firebase-config.js"></script>

    <!-- OVERLAY DE LOGIN -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl z-[999] flex flex-col items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md flex flex-col items-center scale-in border border-slate-100 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 opacity-5 rounded-full blur-3xl transform translate-x-10 -translate-y-10"></div>
            
            <div class="w-16 h-16 bg-gradient-to-br from-blue-50 to-indigo-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl mb-5 shadow-sm border border-blue-100 z-10">
                <i class="fas fa-shield-alt"></i>
            </div>
            
            <h2 class="text-2xl font-black text-slate-900 mb-1 z-10 tracking-tight">Acceso Restringido</h2>
            <p class="text-xs text-slate-500 font-bold mb-8 text-center z-10 uppercase tracking-wider">Panel de Control Maestro EEN</p>
            
            <div class="w-full space-y-4 mb-6 z-10">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="loginEmail" class="w-full input-modern pl-11 pr-4 py-3.5 rounded-xl font-bold text-sm text-slate-800" placeholder="usuario@laeconomica.com" autocomplete="email">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="loginPassword" class="w-full input-modern pl-11 pr-4 py-3.5 rounded-xl font-bold text-sm text-slate-800" placeholder="••••••••" autocomplete="current-password" onkeypress="if(event.key === 'Enter') handleLogin()">
                    </div>
                </div>
            </div>
            
            <button onclick="handleLogin()" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-black shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex items-center justify-center gap-2 z-10 text-sm">
                Iniciar Sesión <i class="fas fa-arrow-right"></i>
            </button>
            <p id="loginError" class="text-red-500 text-xs font-bold mt-4 hidden text-center z-10 bg-red-50 py-2 px-4 rounded-lg w-full border border-red-100"></p>
        </div>
    </div>

    <!-- VISOR DE IMÁGENES -->
    <div id="imageLightbox" class="fixed inset-0 bg-slate-900/95 z-[100] hidden flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeImageLightbox()">
        <div class="absolute top-4 right-4 md:top-8 md:right-8 z-10">
            <button class="w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur rounded-full text-white flex items-center justify-center transition" onclick="closeImageLightbox()">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <img id="lightboxImg" src="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- SIDEBAR - EXCLUSIVA PARA PC/TABLET (Dashboard Style) -->
    <aside class="hidden md:flex w-[250px] lg:w-[280px] bg-white border-r border-slate-200 flex-col z-30 shrink-0 shadow-sm relative">
        <div class="h-20 flex items-center px-6 border-b border-slate-100">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center mr-3 shadow-md shadow-blue-500/20">
                <i class="fas fa-layer-group text-white text-[15px]"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-tight text-slate-900 leading-none">Panel EEN</span>
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Gestión Maestra</p>
            </div>
        </div>

        <nav class="flex-1 py-6 flex flex-col overflow-y-auto custom-scroll space-y-1">
            <p class="px-6 text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">Secciones</p>
            
            <button onclick="switchTab('master')" id="dtTab-master" class="w-full flex items-center gap-3 px-6 py-3.5 bg-blue-50/80 text-blue-700 font-bold border-r-4 border-blue-600 transition-colors">
                <i class="fas fa-box w-5 text-center text-lg"></i> <span class="text-sm">Catálogo Maestro</span>
            </button>
            <button onclick="switchTab('scanner')" id="dtTab-scanner" class="w-full flex items-center gap-3 px-6 py-3.5 text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-bold border-r-4 border-transparent transition-colors">
                <i class="fas fa-qrcode w-5 text-center text-lg"></i> <span class="text-sm">Escáner Físico</span>
            </button>
            
            <p class="px-6 text-[10px] font-black text-slate-400 uppercase tracking-wider mt-6 mb-2">Administración</p>
            
            <button onclick="switchTab('import')" id="dtTab-import" class="w-full flex items-center justify-between px-6 py-3.5 text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-bold border-r-4 border-transparent transition-colors relative">
                <div class="flex items-center gap-3"><i class="fas fa-cloud-download-alt w-5 text-center text-lg"></i> <span class="text-sm">Importaciones</span></div>
                <span id="dtImportBadge" class="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full shadow hidden">0</span>
            </button>
            <button onclick="switchTab('cashiers')" id="dtTab-cashiers" class="w-full flex items-center gap-3 px-6 py-3.5 text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-bold border-r-4 border-transparent transition-colors">
                <i class="fas fa-user-tie w-5 text-center text-lg"></i> <span class="text-sm">Accesos POS</span>
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100 bg-slate-50">
            <div class="flex items-center gap-3 p-2 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-500 border border-slate-200 flex items-center justify-center font-bold">
                    <i class="fas fa-user"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p id="userRoleName" class="text-xs font-black text-slate-800 truncate leading-none">Cargando...</p>
                    <p id="userRoleBadge" class="text-[9px] text-blue-500 font-bold uppercase tracking-wider mt-1 border border-blue-100 bg-blue-50 inline-block px-1.5 py-0.5 rounded">PERFIL</p>
                </div>
                <button onclick="handleLogout()" class="w-9 h-9 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 transition flex items-center justify-center" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden bg-slate-50/50">
        
        <!-- HEADER MÓVIL (Solo visible en pantallas pequeñas) -->
        <header class="md:hidden bg-white border-b border-slate-200 px-4 py-4 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200/50">
                    <i class="fas fa-layer-group text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Panel EEN</h1>
                    <p class="text-[11px] text-slate-500 font-semibold uppercase tracking-wider mt-1">Gestión Maestra</p>
                </div>
            </div>
            <button onclick="openEditModal()" class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-plus"></i></button>
        </header>

        <!-- TOP BAR: Buscador Flotante, Filtros y Botones de Acción Global -->
        <div class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 md:px-8 py-3 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0 z-10" id="globalSearchContainer">
            <div class="relative w-full sm:max-w-md">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="globalSearch" oninput="debouncedSearch()" placeholder="Buscar producto, SKU o categoría..." class="w-full pl-11 pr-4 py-2.5 rounded-xl input-modern text-sm font-semibold shadow-sm focus:bg-white bg-slate-50">
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 hide-scroll">
                <!-- Filtros para la vista Master -->
                <select id="filterType" onchange="filterTable()" class="flex-none bg-white px-3 py-2.5 rounded-xl border border-slate-200 font-bold text-xs shadow-sm outline-none text-slate-700 appearance-none cursor-pointer">
                    <option value="ALL">📦 Todos</option>
                    <option value="PIEZA_BASE">Cube Piezas</option>
                    <option value="KIT_FLEXIBLE">Árbol Web</option>
                    <option value="KIT_OFICIAL">Cajas Oficiales</option>
                </select>

                <label class="flex-none flex items-center gap-2 cursor-pointer bg-white px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-xs shadow-sm hover:bg-slate-50 transition select-none" id="filterPendingLabel">
                    <input type="checkbox" id="filterPending" onchange="filterTable()" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                    <span class="text-slate-700">Solo Faltantes</span>
                </label>
                
                <div class="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></div>

                <!-- Acciones Rápidas (Desktop) -->
                <button onclick="exportPendingMasterToExcel()" id="btnExportPending" class="flex-none bg-orange-50 hover:bg-orange-100 border border-orange-200 text-orange-600 px-3 py-2.5 rounded-xl font-bold text-xs shadow-sm flex items-center gap-2 transition" title="Exportar Faltantes Web"><i class="fas fa-file-excel text-sm"></i></button>
                <button id="btn-mass-qr" onclick="openMassActions()" class="hidden md:flex flex-none bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs shadow-sm items-center gap-2 transition"><i class="fas fa-qrcode"></i> QRs</button>
                <button id="btn-new-product" onclick="openEditModal()" class="hidden md:flex bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition shadow-lg shadow-slate-900/20 items-center gap-2"><i class="fas fa-plus"></i> Crear Producto</button>
            </div>
        </div>

        <!-- CONTENEDOR PRINCIPAL SCROLLABLE (Vistas) -->
        <main class="flex-1 overflow-hidden relative w-full">
            
            <!-- VISTA: CATÁLOGO MASTER Y AGRUPADO -->
            <div id="view-master" class="h-full flex flex-col w-full px-4 md:px-8 py-6 max-w-[1400px] mx-auto fade-in">
                
                <!-- BENTO GRID STATS -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-5 shrink-0">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col justify-between relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 opacity-[0.03]"><i class="fas fa-boxes text-8xl"></i></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center mb-4"><i class="fas fa-cube text-lg"></i></div>
                            <p class="text-[11px] text-slate-500 font-bold uppercase tracking-wider mb-1">Total Variantes Web</p>
                            <p class="text-4xl lg:text-5xl font-black text-slate-800 tracking-tight" id="count-total">0</p>
                        </div>
                    </div>
                    
                    <div onclick="document.getElementById('filterPending').click()" class="bg-gradient-to-br from-white to-orange-50/50 hover:to-orange-50 transition cursor-pointer p-6 rounded-3xl shadow-sm border border-orange-100 flex flex-col justify-between relative overflow-hidden group">
                        <div class="absolute -right-4 -bottom-4 opacity-[0.05] text-orange-500 group-hover:scale-110 group-hover:opacity-10 transition-all duration-500"><i class="fas fa-exclamation-triangle text-8xl"></i></div>
                        <div class="relative z-10">
                            <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center mb-4"><i class="fas fa-exclamation text-lg"></i></div>
                            <p class="text-[11px] text-orange-600 font-bold uppercase tracking-wider mb-1">Por Configurar / Heredar</p>
                            <p class="text-4xl lg:text-5xl font-black text-orange-600 tracking-tight" id="count-pending">0</p>
                        </div>
                    </div>

                    <div class="hidden lg:flex bg-slate-900 text-white p-6 rounded-3xl shadow-lg shadow-slate-900/10 flex-col justify-center items-center relative overflow-hidden group cursor-pointer border border-slate-800 hover:border-slate-700 transition-colors" onclick="openEditModal()">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 opacity-20 rounded-full blur-3xl transform translate-x-10 -translate-y-10 group-hover:scale-150 transition-transform duration-700"></div>
                        <div class="relative z-10 text-center">
                            <div class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-white/10 group-hover:bg-white/20 transition-colors"><i class="fas fa-plus"></i></div>
                            <p class="font-bold text-lg tracking-tight">Nuevo Producto</p>
                            <p class="text-[11px] text-slate-400 font-medium mt-1">Dar de alta manualmente</p>
                        </div>
                    </div>
                </div>

                <!-- CONTENEDOR DE TABLAS -->
                <div class="flex-1 bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col relative">
                    <!-- Tabs Internas de la tabla -->
                    <div class="px-4 md:px-6 py-3 border-b border-slate-100 flex justify-betwee
