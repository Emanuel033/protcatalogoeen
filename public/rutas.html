        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }

        .paqueteria-group { border-left: 4px solid #8b5cf6; background: #f5f3ff; }
        
        #toast-container { z-index: 9999; pointer-events: none; }
        .toast-enter { animation: slideInUp 0.3s forwards; }
        .toast-leave { animation: fadeOut 0.3s forwards; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        /* Estilos de Drawer Lateral */
        #detalle-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

    <script>
        document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let map, marcadores = {}, capaRuta = null; // Cambiado para dibujar líneas manualmente
        let miniMap = null, miniMarker = null; 
        
        let rutasActivasDB = {}; 
        let rutasRecientesDB = {}; 
        let viajesAgrupados = [], filtroActual = 'todos', viajeSeleccionado = null; 
        let flotaDB = [], choferesDB = [], clientesDB = []; 
        let modalActionFn = null;
        let viajeEnEdicion = null;

        const coordPlantaEEN = L.latLng(25.689804, -100.312066); 

        window.showToast = (msg, type='success') => {
            const t = document.createElement('div');
            t.className = `toast-enter text-white px-5 py-3 rounded-xl shadow-2xl ${type === 'error' ? 'bg-red-600' : (type==='info' ? 'bg-blue-600' : 'bg-slate-800')} text-xs font-bold text-center border border-white/10 pointer-events-auto`;
            t.innerHTML = msg; document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.classList.replace('toast-enter', 'toast-leave'); setTimeout(() => t.remove(), 300); }, 4000);
        };

        const icons = {
            bodega: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white"><i class="fas fa-building text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            paqueteria: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white"><i class="fas fa-boxes text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            entregado: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white"><i class="fas fa-check text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            fallido: L.divIcon({ className: 'custom-icon cursor-move', html: `<div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white animate-pulse"><i class="fas fa-exclamation text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] })
        };

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([25.689804, -100.312066], 13);
            L.control.zoom({ position: 'topleft' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            L.marker([25.689804, -100.312066], { icon: L.divIcon({ className: 'custom-icon', html: `<div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white z-50"><i class="fas fa-store text-lg"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] }) }).addTo(map).bindPopup("<b>Matriz EEN</b>");
        }

        function compilarDatosRutas() {
            const arrayUnico = []; const controlMap = {};
            const juntar = (dict) => {
                Object.values(dict).forEach(r => { if(!controlMap[r.id]) { controlMap[r.id] = true; arrayUnico.push(r); } });
            };
            juntar(rutasActivasDB); juntar(rutasRecientesDB);
            agruparYConsolidar(arrayUnico);
        }

        function agruparYConsolidar(pedidosRaw) {
            viajesAgrupados = []; const paqueteriasMap = {};
            pedidosRaw.forEach(p => {
                const estadoLimpio = String(p.estado || 'pendiente').toLowerCase().trim();
                let coordsLimpia = p.coordenadas;
                if (!coordsLimpia || typeof coordsLimpia.lat === 'undefined' || isNaN(coordsLimpia.lat)) {
                    coordsLimpia = { lat: 25.6866, lng: -100.3161 }; 
                }

                if (p.tipo_destino === 'paqueteria') {
                    const key = `${p.nombre_paqueteria}_${estadoLimpio}`;
                    if (!paqueteriasMap[key]) {
                        paqueteriasMap[key] = { 
                            es_grupo: true, id: `GRP-${p.id}`, cliente_nombre: `Consolidado: ${p.nombre_paqueteria}`, 
                            tipo_destino: 'paqueteria', direccion: p.direccion, coordenadas: coordsLimpia, 
                            estado: estadoLimpio, vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, 
                            motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, 
                            foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [] 
                        };
                    }
                    if (p.urgente) paqueteriasMap[key].urgente = true;
                    if (p.foto_evidencia) paqueteriasMap[key].foto_evidencia = p.foto_evidencia;
                    paqueteriasMap[key].orden_ruta = Math.min(paqueteriasMap[key].orden_ruta, p.orden_ruta || 9999999999999);
                    paqueteriasMap[key].pedidos_incluidos.push(p);
                } else { 
                    viajesAgrupados.push({ 
                        es_grupo: false, id: p.id, cliente_nombre: p.cliente_nombre, tipo_destino: 'bodega_cliente', 
                        direccion: p.direccion, coordenadas: coordsLimpia, estado: estadoLimpio, 
                        vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, 
                        motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, 
                        foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [p] 
                    }); 
                }
            });
            Object.values(paqueteriasMap).forEach(g => viajesAgrupados.push(g));
            viajesAgrupados.sort((a,b) => { const ord = { 'fallido': 1, 'pendiente': 2, 'camino': 3, 'entregado': 4 }; return (ord[a.estado] || 5) - (ord[b.estado] || 5); });
            
            renderizarLista(); actualizarMapa();
            
            if (viajeSeleccionado) {
                const actualizado = viajesAgrupados.find(v => v.id === viajeSeleccionado.id);
                if (actualizado) { viajeSeleccionado = actualizado; seleccionarViaje(viajeSeleccionado.id, true); } 
                else { cerrarDetalle(); }
            }
        }

        window.setFilter = (filtro) => {
            filtroActual = filtro;
            document.querySelectorAll('.filter-btn').forEach(b => b.className = "filter-btn shrink-0 px-4 py-1.5 rounded-lg text-xs font-bold bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors");
            document.getElementById(`filter-${filtro}`).className = `filter-btn shrink-0 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-inner ${filtro==='fallido'?'bg-red-600 text-white':'bg-blue-600 text-white'}`;
            renderizarLista(); actualizarMapa(); cerrarDetalle();
        }

        function renderizarLista() {
            const container = document.getElementById('lista-pedidos'); container.innerHTML = '';
            
            const termino = document.getElementById('buscar-ruta-input')?.value.toLowerCase() || '';
            const filtrados = (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual))
                .filter(v => v.cliente_nombre.toLowerCase().includes(termino) || v.id.toLowerCase().includes(termino) || (v.direccion && v.direccion.toLowerCase().includes(termino)));
            
            filtrados.sort((a, b) => {
                if(a.estado === b.estado) return (a.orden_ruta || 99999999999) - (b.orden_ruta || 99999999999);
                return 0;
            });

            if(filtrados.length === 0) {
                if(termino) return container.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold"><i class="fas fa-search text-4xl mb-3 text-slate-300"></i><br>No hay resultados para "${termino}".</div>`;
                return container.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold"><i class="fas fa-check-circle text-4xl mb-3 text-slate-300"></i><br>Bandeja limpia.</div>`; 
            }

            let htmlAcumulado = '';
            filtrados.forEach(v => {
                const isActive = viajeSeleccionado && v.id === viajeSeleccionado.id ? 'active' : '';
                let stClass, stText, icClass;
                if(v.estado === 'fallido') { stClass = 'status-fallido'; stText = 'Problema'; icClass = 'fa-exclamation-triangle'; }
                else if(v.estado === 'pendiente') { stClass = 'status-pendiente'; stText = 'Por Asignar'; icClass = 'fa-clock'; }
                else if(v.estado === 'camino') { stClass = 'status-camino'; stText = 'En Ruta'; icClass = 'fa-truck-fast'; }
                else { stClass = 'status-entregado'; stText = 'Entregado'; icClass = 'fa-check-double'; }

                let bHtml = '';
                if (v.estado === 'fallido') bHtml = `<div class="mt-2 pt-2 border-t border-red-100 text-[10px] font-bold text-red-600 truncate"><i class="fas fa-info-circle"></i> ${v.motivo_falla || 'Problema reportado'}</div>`;
                else if (v.vehiculo_asignado && v.estado !== 'pendiente') bHtml = `<div class="mt-2 pt-2 border-t border-slate-100 flex gap-2 text-[9px] font-bold text-slate-500"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded"><i class="fas fa-truck text-blue-400"></i> ${flotaDB.find(f => f.id === v.vehiculo_asignado)?.nombre || 'Vehículo'}</span></div>`;

                const badgeUrgente = v.urgente ? `<span class="bg-red-500 text-white px-1.5 py-0.5 rounded text-[8px] font-black uppercase ml-2 border border-red-600 shadow-sm"><i class="fas fa-siren-on"></i> Urgente</span>` : '';
                const badgeFoto = v.foto_evidencia ? `<span class="text-slate-400 ml-1" title="Contiene foto"><i class="fas fa-camera"></i></span>` : '';

                htmlAcumulado += `<div onclick="seleccionarViaje('${v.id}')" class="pedido-card ${isActive} ${v.es_grupo?'paqueteria-group':'bg-white'} ${v.urgente?'border-l-4 border-l-red-500':''} p-4 rounded-xl shadow-sm border border-slate-200 cursor-pointer"><div class="flex justify-between items-start mb-2"><span class="text-[9px] font-black uppercase px-2 py-0.5 rounded ${stClass} flex items-center gap-1"><i class="fas ${icClass}"></i> ${stText}</span>${badgeFoto}</div><h4 class="font-black text-slate-800 text-sm truncate mb-1">${v.cliente_nombre}${badgeUrgente}</h4><p class="text-[10px] text-slate-500 truncate mb-1"><i class="fas fa-map-marker-alt text-red-400 w-4"></i> ${v.direccion}</p>${bHtml}</div>`;
            });
            container.innerHTML = htmlAcumulado;
        }

        async function actualizarCoordenadas(id, lat, lng) {
            const v = viajesAgrupados.find(x => x.id === id); if(!v) return;
            try {
                const batch = db.batch();
                v.pedidos_incluidos.forEach(p => batch.update(db.collection('rutas_logistica').doc(p.id), { coordenadas: { lat, lng } }));
                await batch.commit(); showToast("📍 Ubicación ajustada exitosamente.");
            } catch (e) { showToast("Error al guardar", "error"); }
        }

        function actualizarMapa() {
            Object.values(marcadores).forEach(m => map.removeLayer(m));
            if(capaRuta) { map.removeLayer(capaRuta); capaRuta = null; }
            marcadores = {}; const bounds = [[25.689804, -100.312066]]; 

            (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual)).forEach(v => {
                if(!v.coordenadas) return;
                let ico = icons.bodega; if(v.estado === 'entregado') ico = icons.entregado; else if(v.estado === 'fallido') ico = icons.fallido; else if(v.tipo_destino === 'paqueteria') ico = icons.paqueteria;
                const isDrag = (v.estado === 'pendiente' || v.estado === 'fallido');
                
                const mk = L.marker([v.coordenadas.lat, v.coordenadas.lng], { icon: ico, draggable: isDrag }).addTo(map);
                mk.on('click', () => seleccionarViaje(v.id));
                if(isDrag) {
                    mk.on('dragend', (e) => {
                        if(confirm("¿Guardar esta nueva ubicación exacta para entregas?")) {
                            actualizarCoordenadas(v.id, e.target.getLatLng().lat, e.target.getLatLng().lng);
                        } else {
                            mk.setLatLng([v.coordenadas.lat, v.coordenadas.lng]);
                        }
                    });
                }
                marcadores[v.id] = mk; bounds.push([v.coordenadas.lat, v.coordenadas.lng]);
            });
            if(bounds.length > 0 && !viajeSeleccionado) map.fitBounds(bounds, { padding: [50, 50] });
        }

        // =========================================================================================
        // MOTOR DE DIBUJADO DE TARJETA ESTABLE: Reemplaza variables ocultas por código inyectado
        // =========================================================================================
        window.seleccionarViaje = (id, skipAnimation = false) => {
            viajeSeleccionado = viajesAgrupados.find(x => x.id === id); if(!viajeSeleccionado) return;
            renderizarLista(); 

            // 1. Llenar los campos fijos de la cabecera
            const badge = document.getElementById('det-status'); 
            document.getElementById('det-folio').innerText = viajeSeleccionado.id; 
            document.getElementById('det-cliente').innerHTML = `${viajeSeleccionado.cliente_nombre} ` + (viajeSeleccionado.urgente ? `<span class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px] font-black uppercase align-middle ml-1"><i class="fas fa-siren-on"></i> Urgente</span>` : ``); 
            document.getElementById('det-tipo-destino').innerText = viajeSeleccionado.tipo_destino === 'paqueteria' ? "🚚 Paquetería" : "🏭 Entrega a Bodega";

            const estadoActual = viajeSeleccionado.estado;
            if(estadoActual === 'pendiente') { badge.className = 'text-[10px] font-black uppercase px-2 py-1 rounded status-pendiente'; badge.innerText = 'Por Asignar'; }
            else if(estadoActual === 'camino') { badge.className = 'text-[10px] font-black uppercase px-2 py-1 rounded status-camino'; badge.innerText = 'En Ruta'; }
            else if(estadoActual === 'fallido') { badge.className = 'text-[10px] font-black uppercase px-2 py-1 rounded status-fallido'; badge.innerText = 'Problema'; }
            else { badge.className = 'text-[10px] font-black uppercase px-2 py-1 rounded status-entregado'; badge.innerText = 'Entregado'; }

            // 2. Construir el HTML dinámico para el interior de la tarjeta
            let htmlDinamico = '';

            // 2.1 Módulo de Fallos / Evidencia
            if(estadoActual === 'fallido') {
                htmlDinamico += `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-xl shadow-sm mb-5">
                        <p class="text-[10px] font-bold text-red-500 uppercase mb-2"><i class="fas fa-exclamation-triangle"></i> Motivo de Falla reportado</p>
                        <p class="text-sm font-bold text-red-900 mb-3">${viajeSeleccionado.motivo_falla || 'Sin detalle adicional'}</p>
                        ${viajeSeleccionado.foto_evidencia ? `<img src="${viajeSeleccionado.foto_evidencia}" class="w-full h-32 object-cover rounded-md shadow-sm border border-red-200">` : ''}
                        <button onclick="abrirModalConfirmacion('reactivar')" class="mt-4 w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-bold shadow-sm transition"><i class="fas fa-redo"></i> Reasignar a Pendientes</button>
                    </div>`;
            } else if (estadoActual === 'entregado' && viajeSeleccionado.foto_evidencia) {
                htmlDinamico += `
                    <div class="bg-slate-800 p-4 rounded-xl shadow-sm mb-5">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-3"><i class="fas fa-camera"></i> Evidencia del Chofer</p>
                        <img src="${viajeSeleccionado.foto_evidencia}" class="w-full h-32 object-cover rounded-md shadow-sm border border-slate-600">
                    </div>`;
            }

            // 2.2 Tarjeta de Ubicación y Facturas (Fija en todos los estados)
            const listFacturas = viajeSeleccionado.pedidos_incluidos.map(p => `<li class="text-[11px] font-bold text-slate-700 py-1.5 border-b border-slate-100 last:border-0"><i class="fas fa-file-invoice text-blue-500 mr-2"></i> ${p.id}</li>`).join('');
            htmlDinamico += `
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative">
                    <button onclick="copiarDireccion()" class="absolute top-2 right-2 text-slate-400 hover:text-blue-500 bg-slate-100 p-1.5 rounded text-[10px]"><i class="fas fa-copy"></i></button>
                    <div class="flex items-start gap-3 mb-4">
                        <i class="fas fa-map-marker-alt text-red-500 mt-0.5 text-lg"></i>
                        <div class="pr-6">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Dirección de Entrega</p>
                            <p class="text-sm text-slate-700 font-medium leading-snug mt-0.5">${viajeSeleccionado.direccion}</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Artículos / Facturas:</p>
                        <ul>${listFacturas}</ul>
                    </div>
                </div>`;

            // 2.3 Circuito y Rutas en el Mapa (Polilínea manual = Estable)
            const cDest = L.latLng(viajeSeleccionado.coordenadas.lat, viajeSeleccionado.coordenadas.lng);
            if(capaRuta) map.removeLayer(capaRuta);
            let wps = [];
            let htmlSecuenciaItems = '';
            
            if (estadoActual === 'camino' || estadoActual === 'entregado') {
                const viajesMismoCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === viajeSeleccionado.vehiculo_asignado && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
                viajesMismoCamion.sort((a,b) => (a.orden_ruta || 9999999999999) - (b.orden_ruta || 9999999999999));

                wps = [coordPlantaEEN];
                htmlSecuenciaItems += `<li class="flex items-center gap-2 pb-2"><div class="w-6 h-6 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px] shadow ml-8"><i class="fas fa-store"></i></div> <span class="text-xs"><b class="text-indigo-900">EEN</b> (Carga Base)</span></li>`;
                
                viajesMismoCamion.forEach((v, idx) => {
                    wps.push(L.latLng(v.coordenadas.lat, v.coordenadas.lng));
                    const btnUp = idx > 0 ? `<button onclick="moverParada('${v.vehiculo_asignado}', ${idx}, -1); event.stopPropagation();" class="text-slate-400 hover:text-blue-500 bg-white border border-slate-200 rounded p-1 mb-0.5 shadow-sm"><i class="fas fa-chevron-up text-[9px]"></i></button>` : `<div class="w-6 h-6"></div>`;
                    const btnDown = idx < viajesMismoCamion.length - 1 ? `<button onclick="moverParada('${v.vehiculo_asignado}', ${idx}, 1); event.stopPropagation();" class="text-slate-400 hover:text-blue-500 bg-white border border-slate-200 rounded p-1 shadow-sm"><i class="fas fa-chevron-down text-[9px]"></i></button>` : `<div class="w-6 h-6"></div>`;
                    const bgColor = v.urgente ? 'bg-red-600' : 'bg-blue-600';
                    const textColor = v.urgente ? 'text-red-700' : 'text-slate-800';
                    const urgBadge = v.urgente ? `<span class="bg-red-500 text-white px-1 py-0.5 rounded text-[7px] font-black uppercase ml-1">Urgente</span>` : '';
                    
                    htmlSecuenciaItems += `
                        <li class="flex items-center gap-2 py-2 group border-b border-indigo-100/50 last:border-0 relative">
                            <div class="flex flex-col opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity absolute left-0 z-10">${btnUp}${btnDown}</div>
                            <div class="w-6 h-6 ${bgColor} text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow border-2 border-white ml-8 shrink-0">${idx + 1}</div>
                            <span class="truncate text-xs flex-1"><b class="${textColor}">${v.cliente_nombre}</b>${urgBadge}</span>
                        </li>`;
                });
                wps.push(coordPlantaEEN);
                htmlSecuenciaItems += `<li class="flex items-center gap-2 pt-2 mt-1 border-t border-indigo-200"><div class="w-6 h-6 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px] shadow ml-8"><i class="fas fa-flag-checkered"></i></div> <span class="text-xs"><b class="text-indigo-900">EEN</b> (Retorno)</span></li>`;
            } else {
                wps = [coordPlantaEEN, cDest];
                htmlSecuenciaItems = `
                    <li class="flex items-center gap-2 pb-2"><div class="w-6 h-6 bg-slate-900 text-white rounded-full flex items-center justify-center text-[10px] shadow ml-8"><i class="fas fa-store"></i></div> <span class="text-xs"><b class="text-indigo-900">EEN</b> (Salida)</span></li>
                    <li class="flex items-center gap-2 py-2"><div class="w-6 h-6 bg-blue-600 text-white rounded-full flex items-center justify-center text-[10px] shadow border-2 border-white ml-8"><i class="fas fa-map-marker-alt"></i></div> <span class="truncate text-xs text-slate-800 font-bold">${viajeSeleccionado.cliente_nombre}</span></li>`;
            }

            // Trazar Ruta Manualmente (Libre de errores de servidores externos)
            capaRuta = L.polyline(wps, { color: '#3b82f6', weight: 4, opacity: 0.8, dashArray: '5, 10' }).addTo(map);
            if(!skipAnimation) map.fitBounds(capaRuta.getBounds(), { padding: [50, 50] });

            // Calcular Kilometraje Matemático Fijo
            let distTotalMetros = 0;
            for(let i=0; i<wps.length-1; i++) { distTotalMetros += wps[i].distanceTo(wps[i+1]); }
            const kmUrbanos = ((distTotalMetros / 1000) * 1.35).toFixed(1); // Añade 35% por trazado de calles
            const minsEstimados = Math.round((kmUrbanos / 30) * 60) + (wps.length > 2 ? (wps.length - 2) * 15 : 15); // 30km/h + paradas

            htmlDinamico += `
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-center mb-3 border-b border-indigo-100/50 pb-2">
                        <p class="text-[10px] font-bold text-indigo-800 uppercase tracking-wider"><i class="fas fa-route mr-1"></i> Secuencia Estimada</p>
                        ${(estadoActual === 'camino' || estadoActual === 'entregado') ? `<button onclick="optimizarRuta('${viajeSeleccionado.vehiculo_asignado}')" class="text-[9px] bg-indigo-600 text-white px-2 py-1 rounded font-bold shadow-sm hover:bg-indigo-700 transition"><i class="fas fa-magic"></i> Optimizar</button>` : ''}
                    </div>
                    <ul class="text-xs text-indigo-900 font-medium space-y-1 mb-4">${htmlSecuenciaItems}</ul>
                    
                    <div class="bg-white p-2.5 rounded-lg border border-indigo-100 flex justify-between items-center shadow-sm">
                        <div class="text-center flex-1 border-r border-indigo-50">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Distancia</p>
                            <p class="text-sm font-black text-indigo-700 mt-0.5">${kmUrbanos} km</p>
                        </div>
                        <div class="text-center flex-1">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Tiempo Est.</p>
                            <p class="text-sm font-black text-emerald-600 mt-0.5">${minsEstimados > 60 ? `${Math.floor(minsEstimados/60)}h ${minsEstimados%60}m` : `${minsEstimados} min`}</p>
                        </div>
                    </div>
                </div>`;

            // 2.4 Panel de Asignación (SOLO SI ES PENDIENTE)
            if(estadoActual === 'pendiente') {
                const htmlVehiculos = flotaDB.map(v => `<button onclick="seleccionarVehiculoDinamico('${v.id}')" id="btn-veh-${v.id}" class="btn-vehiculo-dinamico p-3 border-2 border-slate-200 rounded-xl text-xs font-bold bg-white transition w-full text-left truncate shadow-sm text-slate-600"><i class="fas fa-truck text-slate-400 mr-2"></i> ${v.nombre}</button>`).join('');
                const htmlChoferes = `<option value="">-- Seleccionar Operador --</option>` + choferesDB.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
                
                htmlDinamico += `
                    <div class="bg-blue-50/50 border border-blue-200 rounded-xl p-4 shadow-sm">
                        <h4 class="text-[11px] font-black text-blue-800 uppercase tracking-wider border-b border-blue-100 pb-2 mb-4"><i class="fas fa-clipboard-check mr-1"></i> Asignación de Unidad</h4>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Vehículo <span class="text-red-500">*</span></label>
                        <div class="grid grid-cols-2 gap-2 mb-4">${htmlVehiculos}</div>
                        
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Operador <span class="text-red-500">*</span></label>
                        <select id="selector-chofer-dinamico" class="w-full border-2 border-slate-200 bg-white p-3 rounded-xl focus:ring-0 focus:border-blue-500 outline-none text-sm font-bold text-slate-700 mb-5">${htmlChoferes}</select>
                        
                        <button onclick="iniciarRutaDinamica()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-sm font-black transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2 uppercase"><i class="fas fa-play-circle text-lg"></i> Iniciar Ruta</button>
                    </div>`;
            }

            // 3. Inyectar todo y mostrar el cajón de manera garantizada
            document.getElementById('drawer-dynamic-content').innerHTML = htmlDinamico;
            const drawer = document.getElementById('detalle-drawer');
            drawer.classList.remove('translate-x-full');

        window.optimizarRuta = async (vehiculoId) => {
            const viajesCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === vehiculoId && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
            if(viajesCamion.length < 2) return showToast("No hay suficientes paradas para optimizar", "warning");

            showToast("Optimizando ruta inteligentemente...", "info");

            let urgentes = viajesCamion.filter(x => x.urgente);
            let normales = viajesCamion.filter(x => !x.urgente);
            
            let currentPt = coordPlantaEEN;
            let ordered = [];
            
            const calcularVecinoMasCercano = (listaNoVisitada) => {
                while(listaNoVisitada.length > 0) {
                    let nearestIdx = 0; let minDist = Infinity;
                    for(let i=0; i<listaNoVisitada.length; i++) {
                        let pt = L.latLng(listaNoVisitada[i].coordenadas.lat, listaNoVisitada[i].coordenadas.lng);
                        let dist = currentPt.distanceTo(pt);
                        if(dist < minDist) { minDist = dist; nearestIdx = i; }
                    }
                    currentPt = L.latLng(listaNoVisitada[nearestIdx].coordenadas.lat, listaNoVisitada[nearestIdx].coordenadas.lng);
                    ordered.push(listaNoVisitada[nearestIdx]);
                    listaNoVisitada.splice(nearestIdx, 1);
                }
            };

            calcularVecinoMasCercano(urgentes);
            calcularVecinoMasCercano(normales);

            const batch = db.batch();
            ordered.forEach((v, idx) => {
                const nuevoOrden = (idx + 1) * 10;
                v.pedidos_incluidos.forEach(p => {
                    batch.update(db.collection('rutas_logistica').doc(p.id), { orden_ruta: nuevoOrden });
                });
            });

            try {
                await batch.commit();
                showToast("¡Ruta perfecta generada!");
            } catch(e) { showToast("Error al optimizar", "error"); }
        };

        window.moverParada = async (vehiculoId, index, direccion) => {
            const viajesCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === vehiculoId && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
            viajesCamion.sort((a,b) => (a.orden_ruta || 9999999999999) - (b.orden_ruta || 9999999999999));

            const targetIdx = index + direccion;
            if(targetIdx < 0 || targetIdx >= viajesCamion.length) return;

            viajesCamion.forEach((v, i) => v.orden_ruta_temp = (i + 1) * 10);
            const temp = viajesCamion[index].orden_ruta_temp;
            viajesCamion[index].orden_ruta_temp = viajesCamion[targetIdx].orden_ruta_temp;
            viajesCamion[targetIdx].orden_ruta_temp = temp;

            showToast("Actualizando ruta...", "info");
            const batch = db.batch();
            viajesCamion.forEach(v => {
                v.pedidos_incluidos.forEach(p => { batch.update(db.collection('rutas_logistica').doc(p.id), { orden_ruta: v.orden_ruta_temp }); });
            });
            try { await batch.commit(); } catch(e) { showToast("Error al reordenar", "error"); }
        };

        function cargarDatosMaestros() {
            db.collection('clientes_logistica').onSnapshot(snap => {
                clientesDB = []; const dl = document.getElementById('clientes-list'); if(dl) dl.innerHTML = '';
                snap.forEach(doc => { const data = { codigo: doc.id, ...doc.data() }; clientesDB.push(data); if(dl) dl.innerHTML += `<option value="${data.codigo}">${data.nombre}</option>`; });
            });
            db.collection('flota').onSnapshot(snap => { 
                flotaDB = []; snap.forEach(doc => flotaDB.push({ id: doc.id, ...doc.data() })); 
                renderizarFlotaUI();
            });
            db.collection('choferes').onSnapshot(snap => { 
                choferesDB = []; snap.forEach(doc => choferesDB.push({ id: doc.id, ...doc.data() })); 
                renderizarChoferesUI();
            });

            db.collection('rutas_logistica').where('estado', 'in', ['pendiente', 'camino', 'fallido']).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasActivasDB[ch.doc.id];
                    else rutasActivasDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });

            db.collection('rutas_logistica').orderBy('fecha_actualizacion', 'desc').limit(100).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasRecientesDB[ch.doc.id];
                    else rutasRecientesDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });
        }
        
        window.onload = () => { initMap(); cargarDatosMaestros(); };
    </script>
</body>
