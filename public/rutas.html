<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística y Rutas - EEN Premium</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- NUEVO: Librería para exportar Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e2e8f0; overflow: hidden; }
        
        /* Scrollbar Premium e Invisible */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        #map { z-index: 0; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Tooltips de los pines en el mapa */
        .map-tooltip { 
            background: rgba(15, 23, 42, 0.95); border: none; border-radius: 8px; 
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            padding: 6px 12px; font-family: 'Plus Jakarta Sans', sans-serif;
            backdrop-filter: blur(4px);
        }
        .map-tooltip::before { border-top-color: rgba(15, 23, 42, 0.95); }
        .leaflet-tooltip-top:before { border-top-color: rgba(15, 23, 42, 0.95) !important; }

        .pedido-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .pedido-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .pedido-card.active { border-color: #3b82f6; background-color: #eff6ff; }
        
        .status-badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 4px; }
        .status-pendiente { background-color: #fef3c7; color: #d97706; }
        .status-camino { background-color: #dbeafe; color: #2563eb; }
        .status-entregado { background-color: #d1fae5; color: #059669; }
        .status-fallido { background-color: #fee2e2; color: #dc2626; } 

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-10px)} 100% {opacity: 1; transform: translateY(0)} }
        
        .panel-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
        
        /* Checkboxes tipo Pill (Documentación) */
        .doc-checkbox input:checked + div { background-color: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .doc-checkbox-ciego input:checked + div { background-color: #1e293b; color: white; border-color: #0f172a; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            projectId: "productoseen",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- EL MAPA DE FONDO AL 100% -->
    <div id="map"></div>

    <!-- BOTÓN FLOTANTE PARA MOSTRAR SIDEBAR -->
    <button id="btn-open-sidebar" onclick="toggleSidebar()" class="fixed top-4 left-4 z-[25] bg-white w-12 h-12 rounded-full shadow-[0_5px_15px_rgba(0,0,0,0.2)] text-slate-700 hover:text-blue-600 flex items-center justify-center transition-all hidden border border-slate-100 group">
        <i class="fas fa-bars text-lg group-hover:scale-110 transition-transform"></i>
    </button>

    <!-- PANEL FLOTANTE IZQUIERDO (Buscador y Lista de Pedidos) -->
    <aside id="main-sidebar" class="panel-transition fixed bottom-0 lg:top-4 lg:bottom-4 left-0 lg:left-4 w-full lg:w-[380px] h-[45vh] lg:h-[calc(100vh-2rem)] glass-panel lg:rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] z-20 flex flex-col overflow-hidden rounded-t-3xl border border-white/60">
        <div class="w-full flex justify-center pt-2 pb-1 lg:hidden bg-transparent cursor-pointer" onclick="toggleSidebar()">
            <div class="w-10 h-1.5 bg-slate-300 rounded-full"></div>
        </div>
        <div class="p-4 shrink-0 flex flex-col gap-3 relative border-b border-slate-100">
            <button onclick="toggleSidebar()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200 transition hidden lg:flex" title="Ocultar Panel"><i class="fas fa-chevron-left"></i></button>
            <div class="flex justify-between items-center pr-10 lg:pr-10">
                <div>
                    <h1 class="text-lg font-black tracking-tight text-slate-800 flex items-center gap-2"><i class="fas fa-truck-fast text-blue-600"></i> Logística EEN</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-0.5" id="fecha-hoy">Cargando...</p>
                </div>
            </div>
            <div class="flex gap-2 items-center">
                <div class="relative shadow-sm rounded-xl flex-1">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="buscar-ruta-input" oninput="renderizarLista()" placeholder="Buscar cliente, folio..." class="w-full bg-slate-50 border border-slate-200 pl-9 pr-3 py-2.5 rounded-xl text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-700 placeholder-slate-400">
                </div>
                
                <!-- BOTÓN NUEVO REASIGNAR -->
                <button onclick="reasignarPedido()" class="bg-red-600 text-white border border-red-700 w-10 h-10 shrink-0 rounded-xl text-sm transition shadow-md flex items-center justify-center" title="Reasignar Pedido"><i class="fas fa-exchange-alt"></i></button>
                
                <!-- BOTÓN CONFIG / CATÁLOGOS -->
                <button onclick="abrirConfiguracion()" class="bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 w-10 h-10 shrink-0 rounded-xl text-sm transition shadow-sm flex items-center justify-center" title="Configuración / Catálogos"><i class="fas fa-cog"></i></button>
                <!-- BOTÓN BITÁCORA -->
                <button onclick="abrirBitacora()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 w-10 h-10 shrink-0 rounded-xl text-sm transition shadow-sm flex items-center justify-center" title="Bitácora / Historial"><i class="fas fa-book"></i></button>
                <!-- BOTÓN NUEVO -->
                <button onclick="abrirFormulario()" class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 shrink-0 rounded-xl text-sm transition shadow-md shadow-blue-500/30 flex items-center justify-center active:scale-95" title="Nuevo Pedido"><i class="fas fa-plus"></i></button>
            </div>
        </div>
        <div class="flex gap-2 overflow-x-auto hide-scroll px-4 py-3 shrink-0 bg-white/50 border-b border-slate-100">
            <button onclick="setFilter('todos')" id="filter-todos" class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold bg-slate-800 text-white shadow-sm transition-all">Todos</button>
            <button onclick="setFilter('pendiente')" id="filter-pendiente" class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all">Por Asignar</button>
            <button onclick="setFilter('camino')" id="filter-camino" class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all">En Ruta</button>
            <button onclick="setFilter('entregado')" id="filter-entregado" class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100 hover:bg-emerald-100 transition-all"><i class="fas fa-check-double"></i> Entregados</button>
            <button onclick="setFilter('fallido')" id="filter-fallido" class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-[10px] font-bold bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition-all"><i class="fas fa-exclamation-triangle"></i> Fallas</button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2 bg-slate-50/80 pb-32" id="lista-pedidos">
            <div class="text-center py-10"><i class="fas fa-circle-notch fa-spin text-3xl text-blue-500 mb-3"></i><p class="text-slate-500 text-xs font-bold">Sincronizando...</p></div>
        </div>
    </aside>

    <!-- PANEL FLOTANTE DERECHO (Detalle del Pedido) -->
    <div id="detalle-drawer" class="panel-transition fixed bottom-0 lg:top-4 lg:bottom-4 right-0 lg:right-4 w-full lg:w-[380px] h-[55vh] lg:h-[calc(100vh-2rem)] glass-panel lg:rounded-3xl rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] lg:shadow-[0_10px_40px_rgba(0,0,0,0.15)] z-[30] flex flex-col overflow-hidden transform translate-y-full lg:translate-y-0 lg:translate-x-[120%] border border-white/60">
        <div class="w-full flex justify-center pt-2 pb-1 lg:hidden bg-slate-900 cursor-pointer" onclick="cerrarDetalle()">
            <div class="w-10 h-1.5 bg-white/30 rounded-full"></div>
        </div>
        <div class="bg-slate-900 p-4 shrink-0 relative shadow-md">
            <button onclick="cerrarDetalle()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition bg-white/10 w-7 h-7 rounded-full items-center justify-center hidden lg:flex"><i class="fas fa-times text-xs"></i></button>
            <div class="flex justify-between items-start mb-1 pr-8">
                <div class="flex gap-1.5 items-center">
                    <span id="det-folio" class="text-[9px] font-mono font-bold text-blue-200 bg-blue-500/20 px-1.5 py-0.5 rounded border border-blue-500/30" title="Folio Pedido">PED</span>
                    <span id="det-factura" class="text-[9px] font-mono font-bold text-emerald-200 bg-emerald-500/20 px-1.5 py-0.5 rounded border border-emerald-500/30 hidden" title="Folio Factura">FAC</span>
                    <button onclick="abrirEdicion()" class="text-amber-400 hover:text-amber-300 bg-amber-400/10 px-1.5 py-0.5 rounded text-[9px] font-bold transition flex items-center gap-1 ml-1"><i class="fas fa-edit"></i> Editar</button>
                    <button onclick="abrirModalConfirmacion('eliminar')" class="text-red-400 hover:text-red-300 bg-red-400/10 px-1.5 py-0.5 rounded text-[9px] font-bold transition"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
            <h3 id="det-cliente" class="text-lg font-black text-white leading-tight mt-1 truncate">Cliente</h3>
            <div class="flex justify-between items-center mt-1.5">
                <p class="text-[10px] text-slate-400 font-medium truncate pr-2 flex items-center gap-1" id="det-tipo-destino"><i class="fas fa-map-marker-alt"></i> DESTINO</p>
                <span id="det-status" class="status-badge shrink-0">ESTADO</span>
            </div>
        </div>
        <div id="drawer-dynamic-content" class="p-3 overflow-y-auto custom-scroll flex-1 space-y-3 bg-slate-50/50 pb-32"></div>
    </div>


    <!-- ========================================================= -->
    <!-- MODAL FORMULARIO AVANZADO (PROCESO REAL LOGÍSTICA)        -->
    <!-- ========================================================= -->
    <div id="modal-formulario" class="fixed inset-0 bg-slate-900/80 z-[100] hidden items-center justify-center p-2 sm:p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-slate-50 rounded-3xl w-full max-w-5xl shadow-2xl overflow-hidden transform scale-95 transition-transform flex flex-col max-h-[98vh] sm:max-h-[90vh]" id="modal-formulario-content">
            
            <div class="bg-slate-900 p-4 sm:p-5 text-white flex justify-between items-center shrink-0 shadow-md z-20">
                <h3 class="text-base sm:text-lg font-black" id="form-titulo"><i class="fas fa-box-open text-blue-400 mr-2"></i> Orden de Entrega</h3>
                <button onclick="cerrarFormulario()" class="text-slate-400 hover:text-white transition w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-4 sm:p-6 overflow-y-auto custom-scroll flex-1">
                <input type="hidden" id="form-id">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8">
                    
                    <!-- COLUMNA 1: DATOS ADMINISTRATIVOS Y DOCUMENTACIÓN -->
                    <div class="space-y-4">
                        <!-- Bloque 1: Folios -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3"><i class="fas fa-hashtag mr-1"></i> Identificadores</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Folio de Pedido</label>
                                    <input type="text" id="form-folio-pedido" class="w-full border border-slate-300 rounded-xl p-2.5 focus:border-blue-500 outline-none text-sm font-bold text-slate-800 bg-slate-50" placeholder="Ej. PED-1025">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Folio de Factura</label>
                                    <input type="text" id="form-folio-factura" class="w-full border border-slate-300 rounded-xl p-2.5 focus:border-emerald-500 outline-none text-sm font-bold text-emerald-800 bg-emerald-50" placeholder="Ej. FAC-A992">
                                </div>
                            </div>
                        </div>

                        <!-- Bloque 2: Cliente -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 relative">
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3"><i class="fas fa-user-tag mr-1"></i> Información del Cliente</h4>
                            
                            <!-- Search overlay -->
                            <div id="client-search-results" class="absolute z-30 top-20 left-4 right-4 bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto custom-scroll hidden"></div>

                            <div class="grid grid-cols-3 gap-3 mb-3">
                                <div class="col-span-1">
                                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Cód. SAP</label>
                                    <input type="text" id="form-cliente-codigo" oninput="searchClient(this.value, 'codigo')" onblur="checkExactClientCode()" autocomplete="off" class="w-full border border-slate-300 rounded-xl p-2.5 focus:border-blue-500 outline-none text-sm font-mono font-bold text-slate-800 bg-slate-50" placeholder="C001">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Razón Social / Nombre</label>
                                    <input type="text" id="form-cliente-nombre" oninput="searchClient(this.value, 'nombre')" autocomplete="off" class="w-full border border-slate-300 rounded-xl p-2.5 focus:border-blue-500 outline-none text-sm font-bold text-slate-800 bg-slate-50" placeholder="Escribe para buscar...">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-600 mb-1">Teléfono Contacto Cliente</label>
                                <div class="relative">
                                    <i class="fas fa-phone absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                                    <input type="tel" id="form-telefono" class="w-full border border-slate-300 rounded-xl pl-8 p-2.5 focus:border-blue-500 outline-none text-sm font-semibold text-slate-800 bg-slate-50" placeholder="Ej. 81 1234 5678">
                                </div>
                            </div>
                        </div>

                        <!-- Bloque 3: Requisitos Físicos de Entrega -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-3"><i class="fas fa-file-contract mr-1"></i> Documentación a Entregar</h4>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                <label class="doc-checkbox cursor-pointer">
                                    <input type="checkbox" id="doc-factura" class="hidden" checked>
                                    <div class="border border-slate-200 bg-slate-50 text-slate-600 rounded-xl p-2 text-center text-[10px] font-bold transition-all flex items-center justify-center gap-1"><i class="fas fa-file-invoice"></i> Factura</div>
                                </label>
                                <label class="doc-checkbox cursor-pointer">
                                    <input type="checkbox" id="doc-certificados" class="hidden">
                                    <div class="border border-slate-200 bg-slate-50 text-slate-600 rounded-xl p-2 text-center text-[10px] font-bold transition-all flex items-center justify-center gap-1"><i class="fas fa-certificate"></i> Certificados</div>
                                </label>
                                <label class="doc-checkbox cursor-pointer">
                                    <input type="checkbox" id="doc-oc" class="hidden">
                                    <div class="border border-slate-200 bg-slate-50 text-slate-600 rounded-xl p-2 text-center text-[10px] font-bold transition-all flex items-center justify-center gap-1"><i class="fas fa-file-signature"></i> O. Compra</div>
                                </label>
                                <label class="doc-checkbox-ciego cursor-pointer sm:col-span-3">
                                    <input type="checkbox" id="doc-ciego" class="hidden">
                                    <div class="border border-slate-200 bg-slate-50 text-slate-600 rounded-xl p-2 text-center text-[10px] font-bold transition-all flex items-center justify-center gap-1"><i class="fas fa-user-secret"></i> Envío Ciego (Sin Logos)</div>
                                </label>
                            </div>
                            <!-- NUEVO: SUBIDA DE QR DE ACCESO (OPCIONAL) -->
                            <div class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2"><i class="fas fa-qrcode mr-1"></i> Imagen QR de Acceso (Opcional)</label>
                                <input type="file" id="form-qr-file" accept="image/*" class="w-full text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer">
                                <input type="hidden" id="form-qr-base64">
                                <div id="form-qr-preview-container" class="mt-2 hidden flex items-center gap-2">
                                    <span class="text-[9px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-200"><i class="fas fa-check-circle"></i> QR ya guardado. Sube otro para reemplazar.</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- COLUMNA 2: LOGÍSTICA DE ENVÍO Y MAPA (EL CORE DE DIRECCIONES) -->
                    <div class="space-y-4 flex flex-col h-full">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 shrink-0">
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-wider"><i class="fas fa-route mr-1"></i> Destino Físico</h4>
                                <label class="flex items-center gap-1.5 cursor-pointer bg-red-50 px-2 py-1 rounded-lg border border-red-100 hover:bg-red-100 transition">
                                    <input type="checkbox" id="form-urgente" class="w-3.5 h-3.5 text-red-500 rounded border-red-300">
                                    <span class="text-[10px] font-black text-red-600 uppercase">Urgente</span>
                                </label>
                            </div>

                            <div class="mb-3">
                                <label class="block text-[10px] font-bold text-slate-600 mb-1">Método de Envío</label>
                                <select id="form-tipo" onchange="adjustFormByShippingType()" class="w-full border border-slate-300 rounded-xl p-2.5 focus:border-blue-500 outline-none text-sm font-bold text-slate-800 bg-slate-50 cursor-pointer">
                                    <option value="bodega_cliente">Reparto Local (Directo a Cliente)</option>
                                    <option value="fletera_domicilio">Fletera Foránea (A Domicilio)</option>
                                    <option value="fletera_ocurre">Fletera Foránea (Ocurre)</option>
                                </select>
                            </div>

                            <!-- SELECTOR INTELIGENTE DE BODEGAS O FLETERAS -->
                            <div class="mb-3 bg-blue-50/50 p-3 rounded-xl border border-blue-100">
                                <label id="label-selector-destino" class="block text-[10px] font-black text-blue-800 mb-1 uppercase tracking-wider">Bodegas del Cliente</label>
                                <select id="form-destino-selector" onchange="usarDestinoGuardado()" class="w-full border border-blue-200 rounded-xl p-2 focus:border-blue-500 outline-none text-xs font-bold text-blue-900 bg-white cursor-pointer shadow-sm">
                                    <!-- Se llena por JS -->
                                </select>
                            </div>

                            <!-- CAMPOS DE DETALLE DEL DESTINO -->
                            <div class="grid grid-cols-2 gap-3 mb-3">
                                <div class="col-span-2">
                                    <label class="block text-[10px] font-bold text-slate-600 mb-1">Alias / Nombre del Destino</label>
                                    <input type="text" id="form-destino-alias" class="w-full border border-slate-300 rounded-xl p-2 focus:border-blue-500 outline-none text-xs font-bold text-slate-800 bg-slate-50" placeholder="Ej. Sucursal Matriz, Castores MTY...">
                                </div>
                                <div class="col-span-2 relative">
                                    <div class="flex justify-between items-end mb-1">
                                        <label class="block text-[10px] font-bold text-slate-600">Dirección Física Exacta</label>
                                        <button type="button" onclick="buscarDireccionMapa()" class="text-[9px] bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-2 py-0.5 rounded transition-colors flex items-center gap-1 font-bold shadow-sm">
                                            <i class="fas fa-search-location"></i> Ubicar Pin
                                        </button>
                                    </div>
                                    <textarea id="form-direccion" rows="2" class="w-full border border-slate-300 rounded-xl p-2 focus:border-blue-500 outline-none text-xs font-semibold text-slate-800 bg-slate-50 resize-none" placeholder="Calle, Número, Colonia..."></textarea>
                                </div>
                                <div>

    <!-- MODALES NUEVOS AÑADIDOS AL FINAL DEL BODY, JUSTO ANTES DE LOS SCRIPTS -->
    
    <script>
// Function to reasign failed pedidos
function reasignarPedido() {
    // Firestore collection reference
    const rutasLogisticaRef = db.collection('rutas_logistica');
    
    // Logic to get the 'fallido' orders and reassign them
    rutasLogisticaRef.where('status', '==', 'fallido').get().then((querySnapshot) => {
        querySnapshot.forEach((doc) => {
            // Update the order status back to 'pendiente'
            rutasLogisticaRef.doc(doc.id).update({status: 'pendiente'});
        });
    });
}
    </script>
