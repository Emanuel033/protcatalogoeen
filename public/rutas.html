        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e2e8f0; overflow: hidden; }
        
        /* Scrollbar Premium e Invisible */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        #map { z-index: 0; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Tooltips de los pines en el mapa */
        .map-tooltip { 
            background: rgba(15, 23, 42, 0.95); border: none; border-radius: 8px; 
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            padding: 6px 12px; font-family: 'Plus Jakarta Sans', sans-serif;
            backdrop-filter: blur(4px);
        }
        .map-tooltip::before { border-top-color: rgba(15, 23, 42, 0.95); }
        .leaflet-tooltip-top:before { border-top-color: rgba(15, 23, 42, 0.95) !important; }

        .pedido-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .pedido-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .pedido-card.active { border-color: #3b82f6; background-color: #eff6ff; }
        
        .status-badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 4px; }

        .status-camino { background-color: #dbeafe; color: #2563eb; }
        .status-entregado { background-color: #d1fae5; color: #059669; }
        .status-fallido { background-color: #fee2e2; color: #dc2626; } 

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-10px)} 100% {opacity: 1; transform: translateY(0)} }
        
        .panel-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
        
        /* Checkboxes tipo Pill (Documentación) */

    <script>
// Reassignment functions and an updated renderizarLista that shows a 'Reasignar' button for 'fallido' pedidos

async function reasignarPedidosFallidos() {
  if (!confirm('¿Reasignar TODOS los pedidos marcados como Fallas a Por Asignar?')) return;
  const rutasRef = db.collection('rutas_logistica');
  try {
    const snap = await rutasRef.where('estado', '==', 'fallido').get();
    if (snap.empty) { alert('No hay pedidos fallidos para reasignar.'); return; }
    const batch = db.batch();
    snap.forEach(doc => {
      const dref = rutasRef.doc(doc.id);
      batch.update(dref, {
        estado: 'pendiente',
        vehiculo_asignado: null,
        chofer_asignado: null,
        motivo_falla: null,
        foto_evidencia: null,
        foto_evidencia_material: null,
        fecha_salida: null,
        fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    await batch.commit();
    alert('Pedidos reasignados correctamente.');
    if (typeof cargarRutasDesdeBD === 'function') await cargarRutasDesdeBD();
    if (typeof compilarDatosRutas === 'function') compilarDatosRutas();
  } catch (err) {
    console.error(err);
    alert('Error al reasignar pedidos. Revisa la consola.');
  }
}

// Backwards-compatible name used by the header button
function reasignarPedido() { return reasignarPedidosFallidos(); }

// Reassign a single pedido by id
async function ejecutarReasignacionPedido(id) {
  if (!confirm('¿Reasignar este pedido a Por Asignar?')) return;
  const ref = db.collection('rutas_logistica').doc(id);
  try {
    await ref.update({
      estado: 'pendiente',
      vehiculo_asignado: null,
      chofer_asignado: null,
      motivo_falla: null,
      foto_evidencia: null,
      foto_evidencia_material: null,
      fecha_salida: null,
      fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('Pedido reasignado correctamente.');
    if (typeof cargarRutasDesdeBD === 'function') await cargarRutasDesdeBD();
    if (typeof compilarDatosRutas === 'function') compilarDatosRutas();
  } catch (err) {
    console.error(err);
    alert('No se pudo reasignar el pedido. Revisa la consola.');
  }
}

// Override renderizarLista to include a Reasignar button for 'fallido' pedidos
function renderizarLista() {
    const container = document.getElementById('lista-pedidos'); container.innerHTML = '';
    const termino = document.getElementById('buscar-ruta-input')?.value.toLowerCase() || '';
    const filtrados = (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual))
        .filter(v => v.cliente_nombre.toLowerCase().includes(termino) || v.id.toLowerCase().includes(termino) || (v.folio_pedido && v.folio_pedido.toLowerCase().includes(termino)) || (v.folio_factura && v.folio_factura.toLowerCase().includes(termino)) || (v.cliente_codigo && v.cliente_codigo.toLowerCase().includes(termino)));

    filtrados.sort((a, b) => { if(a.estado === b.estado) return (a.orden_ruta || 99999999999) - (b.orden_ruta || 99999999999); return 0; });

    if(filtrados.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-400 font-bold flex flex-col items-center"><i class="fas ${termino ? 'fa-search' : 'fa-check-circle text-emerald-400'} text-3xl mb-2"></i><span class="text-xs">${termino ? 'Sin resultados.' : 'Bandeja limpia.'}</span></div>`; 
        return;
    }

    let htmlAcumulado = '';
    filtrados.forEach(v => {
        const isActive = viajeSeleccionado && v.id === viajeSeleccionado.id ? 'active' : 'bg-white';
        let stClass, stText, icClass;
        if(v.estado === 'fallido') { stClass = 'status-fallido'; stText = 'Problema'; icClass = 'fa-exclamation-triangle'; }
        else if(v.estado === 'pendiente') { stClass = 'status-pendiente'; stText = 'Por Asignar'; icClass = 'fa-clock'; }
        else if(v.estado === 'camino') { stClass = 'status-camino'; stText = 'En Ruta'; icClass = 'fa-truck-fast'; }
        else { stClass = 'status-entregado'; stText = 'Entregado'; icClass = 'fa-check-double'; }

        let bHtml = '';
        if (v.estado === 'fallido') bHtml = `<div class="mt-2 pt-2 border-t border-red-100 text-[9px] font-bold text-red-600 truncate bg-red-50 px-2 py-1 rounded-md"><i class="fas fa-info-circle"></i> ${v.motivo_falla || 'Problema reportado'}</div>`;
        else if (v.vehiculo_asignado && v.estado !== 'pendiente') {
            const choferNombre = choferesDB.find(c => c.id === v.chofer_asignado)?.nombre || 'Chofer';
            bHtml = `<div class="mt-2 pt-1.5 border-t border-slate-100 flex justify-between items-center text-[8px] font-bold text-slate-500"><span class="bg-slate-100 px-1.5 py-0.5 rounded"><i class="fas fa-truck text-slate-400"></i> ${flotaDB.find(f => f.id === v.vehiculo_asignado)?.nombre || 'Vehículo'}</span> <span class="text-blue-600"><i class="fas fa-user-circle"></i> ${choferNombre}</span></div>`;
        }

        const badgeUrgente = v.urgente ? `<span class="bg-gradient-to-r from-red-500 to-red-600 text-white px-1.5 py-0.5 rounded text-[7px] font-black uppercase ml-1 shadow-sm"><i class="fas fa-fire-alt"></i> Urg.</span>` : '';
        const muestraFolio = v.folio_pedido || v.folio_factura || 'S/F';
        const isFletera = v.tipo_envio && v.tipo_envio.includes('fletera');
        const badgeFletera = isFletera ? `<i class="fas fa-truck-loading text-purple-400 mr-1" title="Fletera"></i>` : '';
        let aliasMostrar = v.destino_alias ? `(${v.destino_alias}) ` : '';

        const reasignBtn = v.estado === 'fallido' ? `<button onclick="event.stopPropagation(); ejecutarReasignacionPedido('${v.id}')" class="absolute top-3 right-3 bg-amber-500 hover:bg-amber-400 text-white px-2 py-1 rounded text-[10px] font-bold">Reasignar</button>` : '';

        htmlAcumulado += `<div onclick="seleccionarViaje('${v.id}')" class="pedido-card ${isActive} rounded-2xl p-3 cursor-pointer relative overflow-hidden">${reasignBtn}<div class="flex justify-between items-start mb-1.5"><span class="status-badge ${stClass} text-[8px] px-2 py-0.5"><i class="fas ${icClass}"></i> ${stText}</span><div class="flex flex-col items-end"><span class="text-[8px] font-mono font-bold text-slate-400">${muestraFolio}</span>${v.cliente_codigo ? `<span class="text-[7px] font-mono font-bold text-slate-300">Cód: ${v.cliente_codigo}</span>` : ''}</div></div><h4 class="font-black text-slate-800 text-xs truncate mb-0.5">${badgeFletera}${v.cliente_nombre}${badgeUrgente}</h4><p class="text-[9px] text-slate-500 truncate mb-1 font-medium"><i class="fas fa-map-marker-alt text-red-400 w-3"></i> <b>${aliasMostrar}</b>${v.direccion}</p>${bHtml}</div>`;
    });
    container.innerHTML = htmlAcumulado;
}    
    </script>
