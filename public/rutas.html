    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e2e8f0; overflow: hidden; }
        
        /* Scrollbar Premium e Invisible */
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        #map { z-index: 0; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Tooltips de los pines en el mapa */
        .map-tooltip { 
            background: rgba(15, 23, 42, 0.9); border: none; border-radius: 8px; 
            color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            padding: 4px 10px; font-family: 'Plus Jakarta Sans', sans-serif;
            backdrop-filter: blur(4px);
        }
        .map-tooltip::before { border-top-color: rgba(15, 23, 42, 0.9); }
        .leaflet-tooltip-top:before { border-top-color: rgba(15, 23, 42, 0.9) !important; }

        .pedido-card { transition: all 0.2s ease; border: 2px solid transparent; }
        .pedido-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .pedido-card.active { border-color: #3b82f6; background-color: #eff6ff; }
        
        .status-badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 4px; }
        .status-pendiente { background-color: #fef3c7; color: #d97706; }
        .status-camino { background-color: #dbeafe; color: #2563eb; }
        .status-entregado { background-color: #d1fae5; color: #059669; }
        .status-fallido { background-color: #fee2e2; color: #dc2626; } 

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: sweep .3s ease-in-out; }
        @keyframes sweep { 0% {opacity: 0; transform: translateY(-10px)} 100% {opacity: 1; transform: translateY(0)} }
        
        .panel-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>

    <script>
        document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });

        let map, marcadores = {}, capaRuta = null; 
        let rutasActivasDB = {}; let rutasRecientesDB = {}; 
        let viajesAgrupados = [], filtroActual = 'todos', viajeSeleccionado = null; 
        let flotaDB = [], choferesDB = []; 
        let vehiculoSeleccionadoTemp = null;
        
        let isSidebarOpen = true; // Control del panel izquierdo

        const coordPlantaEEN = L.latLng(25.689804, -100.312066); 

        // ==========================================
        // SISTEMA DE PANELES COLLAPSABLES
        // ==========================================
        window.toggleSidebar = () => {
            isSidebarOpen = !isSidebarOpen;
            const sidebar = document.getElementById('main-sidebar');
            const btnOpen = document.getElementById('btn-open-sidebar');
            
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-[110%]', 'translate-y-full');
                btnOpen.classList.add('hidden');
            } else {
                if (window.innerWidth >= 1024) sidebar.classList.add('-translate-x-[110%]');
                else sidebar.classList.add('translate-y-full');
                btnOpen.classList.remove('hidden');
            }
            setTimeout(() => { if(map) map.invalidateSize(); }, 400); // Recalcular mapa tras animación
        };

        window.showToast = (msg, type='success') => {
            const t = document.createElement('div');
            t.className = `toast-enter text-white px-5 py-3 rounded-2xl shadow-2xl ${type === 'error' ? 'bg-red-600' : (type==='info' ? 'bg-indigo-600' : 'bg-slate-800')} text-xs font-bold text-center flex items-center gap-2 justify-center border border-white/10`;
            t.innerHTML = `${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-check-circle text-emerald-400"></i>'} ${msg}`; 
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
        };

        const icons = {
            bodega: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white transform transition hover:scale-110"><i class="fas fa-building text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            paqueteria: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white transform transition hover:scale-110"><i class="fas fa-boxes text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            entregado: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white"><i class="fas fa-check-double text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] }),
            fallido: L.divIcon({ className: 'custom-icon', html: `<div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white animate-bounce"><i class="fas fa-exclamation-triangle text-sm"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 32] })
        };

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([25.689804, -100.312066], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            const markerPlanta = L.marker([25.689804, -100.312066], { icon: L.divIcon({ className: 'custom-icon', html: `<div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white shadow-xl border-2 border-white z-50"><i class="fas fa-industry text-lg"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] }) }).addTo(map);
            markerPlanta.bindTooltip(`<div class="font-bold text-xs">Planta EEN</div>`, { permanent: false, direction: 'top', className: 'map-tooltip', offset: [0, -15] });
        }

        // ==========================================
        // CÁMARA INTELIGENTE (ZOOM AL PIN ESPECÍFICO)
        // ==========================================
        function enfocarPin(cDest, arrayPuntosRuta = null) {
            // Calcula dinámicamente los "márgenes invisibles" dependiendo de qué paneles estén abiertos
            let pLeft = 20, pRight = 20, pTop = 20, pBottom = 20;
            if (window.innerWidth >= 1024) {
                if(isSidebarOpen) pLeft = 380;
                if(viajeSeleccionado) pRight = 380;
            } else {
                if(viajeSeleccionado) pBottom = window.innerHeight * 0.55 + 20; // Cajón detalle abierto
                else if(isSidebarOpen) pBottom = window.innerHeight * 0.45 + 20; // Cajón lista abierto
            }

            if (arrayPuntosRuta && arrayPuntosRuta.length > 2) {
                // Si es un camión con varias rutas, centra la línea completa respetando los paneles
                map.fitBounds(L.latLngBounds(arrayPuntosRuta), { paddingTopLeft: [pLeft, pTop], paddingBottomRight: [pRight, pBottom] });
            } else {
                // MAGIA: Centra específicamente el pin seleccionado respetando los paneles (Estilo Google Maps)
                map.fitBounds(L.latLngBounds([cDest, cDest]), { maxZoom: 15, paddingTopLeft: [pLeft, pTop], paddingBottomRight: [pRight, pBottom] });
            }
        }

        // ==========================================
        // MOTOR DE RUTAS VÍA API OSRM
        // ==========================================
        async function trazarRutaCalles(waypointsArray, skipBoundsAnimation) {
            if(capaRuta) map.removeLayer(capaRuta);
            
            const coordsStr = waypointsArray.map(wp => `${wp.lng},${wp.lat}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if(data.code !== 'Ok') throw new Error("No se pudo rutear");

                const route = data.routes[0];
                const coordsArr = route.geometry.coordinates.map(c => [c[1], c[0]]);

                capaRuta = L.polyline(coordsArr, { color: '#3b82f6', weight: 5, opacity: 0.8 }).addTo(map);
                
                // Si la función nos pidió omitir el reajuste del mapa (porque ya hicimos el zoom manual), no hacemos nada
                if(!skipBoundsAnimation) enfocarPin(waypointsArray[waypointsArray.length-1], waypointsArray);

                const distKm = (route.distance / 1000).toFixed(1);
                const timeMins = Math.round(route.duration / 60);

                const elDist = document.getElementById('calc-dist'); const elTime = document.getElementById('calc-time');
                if(elDist) elDist.innerText = `${distKm} km`;
                if(elTime) elTime.innerText = timeMins > 60 ? `${Math.floor(timeMins/60)}h ${timeMins%60}m` : `${timeMins} min`;

            } catch(e) {
                // Fallback: Línea recta
                capaRuta = L.polyline(waypointsArray, { color: '#94a3b8', weight: 4, opacity: 0.7, dashArray: '10, 10' }).addTo(map);
                if(!skipBoundsAnimation) enfocarPin(waypointsArray[waypointsArray.length-1], waypointsArray);
            }
        }

        // ==========================================
        // PROCESAMIENTO DE DATOS
        // ==========================================
        function compilarDatosRutas() {
            const arrayUnico = []; const controlMap = {};
            const juntar = (dict) => { Object.values(dict).forEach(r => { if(!controlMap[r.id]) { controlMap[r.id] = true; arrayUnico.push(r); } }); };
            juntar(rutasActivasDB); juntar(rutasRecientesDB);
            agruparYConsolidar(arrayUnico);
        }

        function agruparYConsolidar(pedidosRaw) {
            viajesAgrupados = []; const paqueteriasMap = {};
            pedidosRaw.forEach(p => {
                const estadoLimpio = String(p.estado || 'pendiente').toLowerCase().trim();
                let coordsLimpia = p.coordenadas;
                if (!coordsLimpia || typeof coordsLimpia.lat === 'undefined' || isNaN(coordsLimpia.lat)) { coordsLimpia = { lat: 25.6866, lng: -100.3161 }; }

                if (p.tipo_destino === 'paqueteria') {
                    const key = `${p.nombre_paqueteria}_${estadoLimpio}`;
                    if (!paqueteriasMap[key]) {
                        paqueteriasMap[key] = { 
                            es_grupo: true, id: `GRP-${p.id}`, cliente_nombre: `Consolidado: ${p.nombre_paqueteria}`, 
                            tipo_destino: 'paqueteria', direccion: p.direccion, coordenadas: coordsLimpia, 
                            estado: estadoLimpio, vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, 
                            motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, 
                            foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [] 
                        };
                    }
                    if (p.urgente) paqueteriasMap[key].urgente = true;
                    if (p.foto_evidencia) paqueteriasMap[key].foto_evidencia = p.foto_evidencia;
                    paqueteriasMap[key].orden_ruta = Math.min(paqueteriasMap[key].orden_ruta, p.orden_ruta || 9999999999999);
                    paqueteriasMap[key].pedidos_incluidos.push(p);
                } else { 
                    viajesAgrupados.push({ es_grupo: false, id: p.id, cliente_nombre: p.cliente_nombre, tipo_destino: 'bodega_cliente', direccion: p.direccion, coordenadas: coordsLimpia, estado: estadoLimpio, vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [p] }); 
                }
            });
            Object.values(paqueteriasMap).forEach(g => viajesAgrupados.push(g));
            viajesAgrupados.sort((a,b) => { const ord = { 'fallido': 1, 'pendiente': 2, 'camino': 3, 'entregado': 4 }; return (ord[a.estado] || 5) - (ord[b.estado] || 5); });
            
            renderizarLista(); actualizarMapa();
            
            if (viajeSeleccionado) {
                const actualizado = viajesAgrupados.find(v => v.id === viajeSeleccionado.id);
                if (actualizado) { viajeSeleccionado = actualizado; seleccionarViaje(viajeSeleccionado.id, true); } else { cerrarDetalle(); }
            }
        }

        window.setFilter = (filtro) => {
            filtroActual = filtro;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-slate-800', 'text-white');
                if(!b.classList.contains('bg-red-50')) b.classList.add('bg-white', 'text-slate-600');
            });
            const btn = document.getElementById(`filter-${filtro}`);
            if(filtro !== 'fallido') {
                btn.classList.remove('bg-white', 'text-slate-600');
                btn.classList.add('bg-slate-800', 'text-white');
            }
            renderizarLista(); actualizarMapa(); cerrarDetalle();
        }

        function renderizarLista() {
            const container = document.getElementById('lista-pedidos'); container.innerHTML = '';
            const termino = document.getElementById('buscar-ruta-input')?.value.toLowerCase() || '';
            const filtrados = (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual))
                .filter(v => v.cliente_nombre.toLowerCase().includes(termino) || v.id.toLowerCase().includes(termino) || (v.direccion && v.direccion.toLowerCase().includes(termino)));
            
            filtrados.sort((a, b) => { if(a.estado === b.estado) return (a.orden_ruta || 99999999999) - (b.orden_ruta || 99999999999); return 0; });

            if(filtrados.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 font-bold flex flex-col items-center"><i class="fas ${termino ? 'fa-search' : 'fa-check-circle text-emerald-400'} text-3xl mb-2"></i><span class="text-xs">${termino ? 'Sin resultados.' : 'Bandeja limpia.'}</span></div>`; 
                return;
            }

            let htmlAcumulado = '';
            filtrados.forEach(v => {
                const isActive = viajeSeleccionado && v.id === viajeSeleccionado.id ? 'active' : 'bg-white';
                let stClass, stText, icClass;
                if(v.estado === 'fallido') { stClass = 'status-fallido'; stText = 'Problema'; icClass = 'fa-exclamation-triangle'; }
                else if(v.estado === 'pendiente') { stClass = 'status-pendiente'; stText = 'Por Asignar'; icClass = 'fa-clock'; }
                else if(v.estado === 'camino') { stClass = 'status-camino'; stText = 'En Ruta'; icClass = 'fa-truck-fast'; }
                else { stClass = 'status-entregado'; stText = 'Entregado'; icClass = 'fa-check-double'; }

                let bHtml = '';
                if (v.estado === 'fallido') bHtml = `<div class="mt-2 pt-2 border-t border-red-100 text-[9px] font-bold text-red-600 truncate bg-red-50 px-2 py-1 rounded-md"><i class="fas fa-info-circle"></i> ${v.motivo_falla || 'Problema reportado'}</div>`;
                else if (v.vehiculo_asignado && v.estado !== 'pendiente') {
                    const choferNombre = choferesDB.find(c => c.id === v.chofer_asignado)?.nombre || 'Chofer';
                    bHtml = `<div class="mt-2 pt-1.5 border-t border-slate-100 flex justify-between items-center text-[8px] font-bold text-slate-500"><span class="bg-slate-100 px-1.5 py-0.5 rounded"><i class="fas fa-truck text-slate-400"></i> ${flotaDB.find(f => f.id === v.vehiculo_asignado)?.nombre || 'Vehículo'}</span> <span class="text-blue-600"><i class="fas fa-user-circle"></i> ${choferNombre}</span></div>`;
                }

                const badgeUrgente = v.urgente ? `<span class="bg-gradient-to-r from-red-500 to-red-600 text-white px-1.5 py-0.5 rounded text-[7px] font-black uppercase ml-1 shadow-sm"><i class="fas fa-fire-alt"></i> Urg.</span>` : '';
                
                htmlAcumulado += `<div onclick="seleccionarViaje('${v.id}')" class="pedido-card ${isActive} rounded-2xl p-3 cursor-pointer relative overflow-hidden"><div class="flex justify-between items-start mb-1.5"><span class="status-badge ${stClass} text-[8px] px-2 py-0.5"><i class="fas ${icClass}"></i> ${stText}</span></div><h4 class="font-black text-slate-800 text-xs truncate mb-0.5">${v.cliente_nombre}${badgeUrgente}</h4><p class="text-[9px] text-slate-500 truncate mb-1 font-medium"><i class="fas fa-map-marker-alt text-red-400 w-3"></i> ${v.direccion}</p>${bHtml}</div>`;
            });
            container.innerHTML = htmlAcumulado;
        }

        function actualizarMapa() {
            Object.values(marcadores).forEach(m => map.removeLayer(m));
            if(capaRuta) { map.removeLayer(capaRuta); capaRuta = null; }
            marcadores = {}; const bounds = [[25.689804, -100.312066]]; 

            (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual)).forEach(v => {
                if(!v.coordenadas) return;
                let ico = icons.bodega; if(v.estado === 'entregado') ico = icons.entregado; else if(v.estado === 'fallido') ico = icons.fallido; else if(v.tipo_destino === 'paqueteria') ico = icons.paqueteria;
                
                const mk = L.marker([v.coordenadas.lat, v.coordenadas.lng], { icon: ico, draggable: false }).addTo(map);
                
                // TOOLTIP MEJORADO Y ETÍQUETA DE PINES (Se muestra al hacer hover / tocar)
                mk.bindTooltip(`<div class="font-bold text-xs truncate max-w-[150px]">${v.cliente_nombre}</div>`, { permanent: false, direction: 'top', className: 'map-tooltip', offset: [0, -15] });
                
                mk.on('click', () => seleccionarViaje(v.id));
                marcadores[v.id] = mk; bounds.push([v.coordenadas.lat, v.coordenadas.lng]);
            });
            
            if(bounds.length > 0 && !viajeSeleccionado) {
                enfocarPin(null, bounds); // Ajuste global inicial
            }
        }

        // ==========================================
        // LÓGICA DE DETALLE Y PANELES COLAPSABLES
        // ==========================================
        window.seleccionarViaje = (id, skipAnimation = false) => {
            viajeSeleccionado = viajesAgrupados.find(x => x.id === id); if(!viajeSeleccionado) return;
            
            // Comportamiento Google Maps: Si estás en celular, esconde la lista para ver el detalle en pantalla completa
            if(window.innerWidth < 1024 && isSidebarOpen) {
                toggleSidebar();
            }
            
            renderizarLista(); 

            // Actualizar Cabeceras
            const elBadge = document.getElementById('det-status'); 
            document.getElementById('det-folio').innerText = viajeSeleccionado.id; 
            document.getElementById('det-cliente').innerHTML = `${viajeSeleccionado.cliente_nombre} ` + (viajeSeleccionado.urgente ? `<span class="bg-red-500 text-white px-1.5 py-0.5 rounded text-[8px] font-black uppercase align-middle ml-1"><i class="fas fa-fire-alt"></i> Urgente</span>` : ``); 
            document.getElementById('det-tipo-destino').innerHTML = viajeSeleccionado.tipo_destino === 'paqueteria' ? "<i class='fas fa-truck-loading text-purple-500'></i> Envío por Paquetería" : "<i class='fas fa-building text-blue-500'></i> Entrega a Bodega Local";

            const estadoActual = viajeSeleccionado.estado;
            if(estadoActual === 'pendiente') { elBadge.className = 'status-badge status-pendiente'; elBadge.innerHTML = '<i class="fas fa-clock"></i> Por Asignar'; }
            else if(estadoActual === 'camino') { elBadge.className = 'status-badge status-camino'; elBadge.innerHTML = '<i class="fas fa-truck-fast"></i> En Ruta'; }
            else if(estadoActual === 'fallido') { elBadge.className = 'status-badge status-fallido'; elBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Problema'; }
            else { elBadge.className = 'status-badge status-entregado'; elBadge.innerHTML = '<i class="fas fa-check-double"></i> Entregado'; }

            let htmlDinamico = '';

            // SECCIÓN COLAPSABLE: Ubicación y Facturas
            const listFacturas = viajeSeleccionado.pedidos_incluidos.map(p => `<li class="text-[10px] font-bold text-slate-600 py-1 border-b border-slate-200 last:border-0"><i class="fas fa-file-invoice text-blue-500 w-3"></i> ${p.id}</li>`).join('');
            htmlDinamico += `
                <details class="bg-white border border-slate-200 rounded-xl shadow-sm group" open>
                    <summary class="font-black text-[11px] text-slate-800 p-3 cursor-pointer flex justify-between items-center select-none">
                        <span class="flex items-center gap-1.5"><i class="fas fa-map text-blue-500"></i> Destino y Entregas</span>
                        <i class="fas fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="px-3 pb-3 pt-0">
                        <div class="bg-slate-50 p-2 rounded-lg mb-2 flex items-start gap-1.5 relative border border-slate-100">
                            <i class="fas fa-map-marker-alt text-red-500 mt-0.5 text-[10px]"></i>
                            <p class="text-[10px] text-slate-700 font-bold leading-snug flex-1 pr-5">${viajeSeleccionado.direccion}</p>
                            <button onclick="copiarDireccion()" class="absolute top-1.5 right-1.5 text-slate-400 hover:text-blue-600"><i class="fas fa-copy text-xs"></i></button>
                        </div>
                        <ul class="pl-1">${listFacturas}</ul>
                    </div>
                </details>`;

            // PREPARAR PUNTOS Y SECUENCIA
            const cDest = L.latLng(viajeSeleccionado.coordenadas.lat, viajeSeleccionado.coordenadas.lng);
            let wps = [];
            let htmlSecuenciaItems = '';
            
            if (estadoActual === 'camino' || estadoActual === 'entregado') {
                const viajesMismoCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === viajeSeleccionado.vehiculo_asignado && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
                viajesMismoCamion.sort((a,b) => (a.orden_ruta || 9999999999999) - (b.orden_ruta || 9999999999999));

                wps = [coordPlantaEEN];
                htmlSecuenciaItems += `<li class="flex items-center gap-2 pb-2"><div class="w-5 h-5 bg-slate-900 text-white rounded-full flex items-center justify-center text-[8px] shadow-sm z-10"><i class="fas fa-industry"></i></div> <span class="text-[10px] font-bold text-slate-800">Planta EEN</span></li>`;
                
                viajesMismoCamion.forEach((v, idx) => {
                    wps.push(L.latLng(v.coordenadas.lat, v.coordenadas.lng));
                    
                    const btnUp = idx > 0 ? `<button onclick="moverParada('${v.vehiculo_asignado}', ${idx}, -1); event.stopPropagation();" class="w-5 h-5 bg-white border border-slate-200 rounded text-slate-400 hover:text-blue-600 flex items-center justify-center"><i class="fas fa-chevron-up text-[8px]"></i></button>` : '';
                    const btnDown = idx < viajesMismoCamion.length - 1 ? `<button onclick="moverParada('${v.vehiculo_asignado}', ${idx}, 1); event.stopPropagation();" class="w-5 h-5 bg-white border border-slate-200 rounded text-slate-400 hover:text-blue-600 flex items-center justify-center"><i class="fas fa-chevron-down text-[8px]"></i></button>` : '';

                    const bgColor = v.urgente ? 'bg-red-500' : 'bg-blue-600';
                    const textColor = v.urgente ? 'text-red-600' : 'text-slate-800';
                    const urgBadge = v.urgente ? `<span class="text-[7px] font-black uppercase ml-1 text-red-500">Urg.</span>` : '';
                    
                    htmlSecuenciaItems += `
                        <li class="flex items-center gap-1.5 py-1.5 relative border-l-2 border-slate-200 ml-2.5 pl-3 before:absolute before:w-1.5 before:h-1.5 before:bg-slate-200 before:rounded-full before:-left-[4px] before:top-1/2 before:-translate-y-1/2">
                            <div class="w-4 h-4 ${bgColor} text-white rounded-full flex items-center justify-center text-[8px] font-bold shadow-sm shrink-0">${idx + 1}</div>
                            <span class="truncate text-[10px] flex-1 font-bold ${textColor}">${v.cliente_nombre}${urgBadge}</span>
                            <div class="flex flex-col gap-[1px]">${btnUp}${btnDown}</div>
                        </li>`;
                });
                wps.push(coordPlantaEEN);
                htmlSecuenciaItems += `<li class="flex items-center gap-2 pt-2"><div class="w-5 h-5 bg-emerald-500 text-white rounded-full flex items-center justify-center text-[8px] shadow-sm z-10"><i class="fas fa-flag-checkered"></i></div> <span class="text-[10px] font-bold text-slate-800">Retorno Base</span></li>`;
            } else {
                wps = [coordPlantaEEN, cDest];
                htmlSecuenciaItems = `
                    <li class="flex items-center gap-2 pb-2 relative border-l-2 border-dashed border-slate-300 ml-2.5 pl-3">
                        <div class="absolute -left-[11px] top-0 w-5 h-5 bg-slate-900 text-white rounded-full flex items-center justify-center text-[8px] shadow-sm"><i class="fas fa-industry"></i></div> 
                        <span class="text-[10px] font-bold text-slate-800">Planta EEN</span>
                    </li>
                    <li class="flex items-center gap-2 relative ml-2.5 pl-3">
                        <div class="absolute -left-[11px] top-0 w-5 h-5 bg-blue-600 text-white rounded-full flex items-center justify-center text-[8px] shadow-sm"><i class="fas fa-map-marker-alt"></i></div> 
                        <span class="truncate text-[10px] font-black text-blue-900">${viajeSeleccionado.cliente_nombre}</span>
                    </li>`;
            }

            // ENFOCAR AL PIN EXACTO (CÁMARA INTELIGENTE)
            enfocarPin(cDest, (estadoActual === 'camino' || estadoActual === 'entregado') ? wps : null);
            
            // DIBUJAR LA LÍNEA (skipBoundsAnimation = true para que OSRM no sobrescriba nuestro zoom inteligente)
            trazarRutaCalles(wps, true);

            const btnOptimizarHTML = (estadoActual === 'camino' || estadoActual === 'entregado') 
                ? `<button onclick="optimizarRuta('${viajeSeleccionado.vehiculo_asignado}')" class="text-[9px] bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold hover:bg-indigo-200 transition"><i class="fas fa-magic"></i> Optimizar</button>` : '';

            // SECCIÓN COLAPSABLE: Ruta y Tiempos
            htmlDinamico += `
                <details class="bg-indigo-50 border border-indigo-100 rounded-xl shadow-sm group" ${estadoActual!=='pendiente' ? 'open' : ''}>
                    <summary class="font-black text-[11px] text-indigo-900 p-3 cursor-pointer flex justify-between items-center select-none">
                        <span class="flex items-center gap-1.5"><i class="fas fa-route text-indigo-500"></i> Trayecto</span>
                        <div class="flex items-center gap-2">${btnOptimizarHTML} <i class="fas fa-chevron-down text-indigo-300 group-open:rotate-180 transition-transform"></i></div>
                    </summary>
                    <div class="px-3 pb-3 pt-0">
                        <ul class="mb-3 relative">${htmlSecuenciaItems}</ul>
                        <div class="bg-white p-1.5 rounded-lg border border-indigo-100 flex justify-between items-center">
                            <div class="text-center flex-1 border-r border-indigo-50">
                                <p class="text-[8px] font-bold text-slate-400 uppercase">Distancia</p>
                                <p class="text-xs font-black text-indigo-700" id="calc-dist"><i class="fas fa-spinner fa-spin"></i></p>
                            </div>
                            <div class="text-center flex-1">
                                <p class="text-[8px] font-bold text-slate-400 uppercase">Tiempo</p>
                                <p class="text-xs font-black text-emerald-600" id="calc-time"><i class="fas fa-spinner fa-spin"></i></p>
                            </div>
                        </div>
                    </div>
                </details>`;

            // SECCIÓN COLAPSABLE: Evidencias / Fallos
            if(estadoActual === 'fallido' || (estadoActual === 'entregado' && viajeSeleccionado.foto_evidencia)) {
                htmlDinamico += `
                <details class="${estadoActual==='fallido'?'bg-red-50 border-red-200':'bg-emerald-50 border-emerald-200'} border rounded-xl shadow-sm group" open>
                    <summary class="font-black text-[11px] ${estadoActual==='fallido'?'text-red-900':'text-emerald-900'} p-3 cursor-pointer flex justify-between items-center select-none">
                        <span class="flex items-center gap-1.5"><i class="fas fa-camera"></i> Evidencia y Reportes</span>
                        <i class="fas fa-chevron-down opacity-50 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="px-3 pb-3 pt-0">
                        ${estadoActual === 'fallido' ? `<p class="text-[10px] font-bold text-red-800 bg-white p-2 rounded border border-red-100 mb-2">${viajeSeleccionado.motivo_falla || 'Sin detalle'}</p>` : ''}
                        ${viajeSeleccionado.foto_evidencia ? `<img src="${viajeSeleccionado.foto_evidencia}" class="w-full h-24 object-cover rounded shadow-sm border ${estadoActual==='fallido'?'border-red-200':'border-emerald-200'} mb-2">` : ''}
                        ${estadoActual === 'fallido' ? `<button onclick="abrirModalConfirmacion('reactivar')" class="w-full bg-amber-500 text-white py-1.5 rounded font-bold text-[10px] shadow-sm flex items-center justify-center gap-1"><i class="fas fa-redo"></i> Reasignar a Pendientes</button>` : ''}
                    </div>
                </details>`;
            }

            // SECCIÓN COLAPSABLE: Asignar Chofer
            if(estadoActual === 'pendiente') {
                const htmlVehiculos = flotaDB.map(v => `<button onclick="seleccionarVehiculoDinamico('${v.id}')" id="btn-veh-${v.id}" class="btn-vehiculo-dinamico p-1.5 border border-slate-200 rounded-lg text-[9px] font-bold bg-white transition-all text-left truncate text-slate-600 flex flex-col items-center gap-0.5"><div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-400"><i class="fas fa-truck text-[10px]"></i></div><span class="w-full text-center truncate">${v.nombre}</span></button>`).join('');
                const htmlChoferes = `<option value="">-- Operador --</option>` + choferesDB.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
                
                htmlDinamico += `
                <div class="bg-blue-600 rounded-xl p-3 shadow-md text-white mt-2">
                    <h4 class="text-[10px] font-black uppercase tracking-wider mb-2"><i class="fas fa-clipboard-check"></i> Asignar Operador</h4>
                    <div class="grid grid-cols-3 gap-1.5 mb-2">${htmlVehiculos || '<p class="text-[9px] text-blue-200 col-span-3">Sin vehículos</p>'}</div>
                    <select id="selector-chofer-dinamico" class="w-full border-none bg-white/10 text-white placeholder-white p-2 rounded-lg outline-none text-[11px] font-bold mb-3 cursor-pointer appearance-none">
                        ${htmlChoferes}
                    </select>
                    <button onclick="iniciarRutaDinamica()" class="w-full bg-white text-blue-600 py-2 rounded-lg text-[11px] font-black transition-transform active:scale-95 shadow-sm flex items-center justify-center gap-1.5"><i class="fas fa-play"></i> Iniciar Ruta</button>
                </div>`;
            }

            document.getElementById('drawer-dynamic-content').innerHTML = htmlDinamico;
            
            // Mostrar los paneles (Desktop y Mobile)
            document.getElementById('detalle-drawer').classList.remove('translate-x-[120%]', 'lg:translate-x-[120%]', 'translate-y-full', 'lg:translate-y-0');
            
            window.vehiculoSeleccionadoTemp = null; 
        }

        window.cerrarDetalle = () => { 
            viajeSeleccionado = null; 
            renderizarLista(); 
            if(capaRuta) { map.removeLayer(capaRuta); capaRuta = null; } 
            
            // Ocultar drawer de detalle
            const drawer = document.getElementById('detalle-drawer');
            if(window.innerWidth >= 1024) drawer.classList.add('translate-x-[120%]', 'lg:translate-x-[120%]');
            else drawer.classList.add('translate-y-full');

            // Si estábamos en móvil y habíamos escondido el sidebar, lo mostramos de nuevo
            if(window.innerWidth < 1024 && !isSidebarOpen) {
                toggleSidebar();
            }

            actualizarMapa(); // Reajusta la vista a todo el mapa
        }

        // ==========================================
        // FUNCIONES CRUD COMPLETAS (CREAR, EDITAR, BORRAR)
        // ==========================================
        
        window.abrirFormulario = () => {
            document.getElementById('form-titulo').innerHTML = '<i class="fas fa-plus-circle text-blue-400"></i> Nuevo Pedido';
            document.getElementById('form-id').value = '';
            document.getElementById('form-cliente').value = '';
            document.getElementById('form-direccion').value = '';
            document.getElementById('form-lat').value = '25.689804'; // Default MTY
            document.getElementById('form-lng').value = '-100.312066'; // Default MTY
            document.getElementById('form-tipo').value = 'bodega_cliente';
            document.getElementById('form-urgente').checked = false;
            
            const modal = document.getElementById('modal-formulario');
            const content = document.getElementById('modal-formulario-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.abrirEdicion = () => {
            if(!viajeSeleccionado) return;
            document.getElementById('form-titulo').innerHTML = '<i class="fas fa-edit text-amber-400"></i> Editar Pedido';
            document.getElementById('form-id').value = viajeSeleccionado.id;
            
            if(viajeSeleccionado.es_grupo) {
                showToast("Los consolidados de paquetería se editan en el módulo de ventas", "error");
                return;
            }

            document.getElementById('form-cliente').value = viajeSeleccionado.cliente_nombre || '';
            document.getElementById('form-direccion').value = viajeSeleccionado.direccion || '';
            document.getElementById('form-lat').value = viajeSeleccionado.coordenadas?.lat || '';
            document.getElementById('form-lng').value = viajeSeleccionado.coordenadas?.lng || '';
            document.getElementById('form-tipo').value = viajeSeleccionado.tipo_destino || 'bodega_cliente';
            document.getElementById('form-urgente').checked = viajeSeleccionado.urgente || false;

            const modal = document.getElementById('modal-formulario');
            const content = document.getElementById('modal-formulario-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.cerrarFormulario = () => {
            const modal = document.getElementById('modal-formulario'); const content = document.getElementById('modal-formulario-content');
            content.classList.add('scale-95'); modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        window.guardarPedido = async () => {
            const id = document.getElementById('form-id').value;
            const cliente = document.getElementById('form-cliente').value.trim();
            const direccion = document.getElementById('form-direccion').value.trim();
            const lat = parseFloat(document.getElementById('form-lat').value);
            const lng = parseFloat(document.getElementById('form-lng').value);
            const tipo = document.getElementById('form-tipo').value;
            const urgente = document.getElementById('form-urgente').checked;
            const btn = document.getElementById('btn-guardar-form');

            if(!cliente || !direccion || isNaN(lat) || isNaN(lng)) {
                return showToast("Completa todos los campos correctamente", "error");
            }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const data = {
                cliente_nombre: cliente,
                direccion: direccion,
                coordenadas: { lat: lat, lng: lng },
                tipo_destino: tipo,
                urgente: urgente,
                fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if(id) {
                    await db.collection('rutas_logistica').doc(id).update(data);
                    showToast("Pedido actualizado");
                    if(viajeSeleccionado && viajeSeleccionado.id === id) {
                        viajeSeleccionado = { ...viajeSeleccionado, ...data };
                        seleccionarViaje(id, true);
                    }
                } else {
                    data.estado = 'pendiente';
                    data.fecha_creacion = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('rutas_logistica').add(data);
                    showToast("Nuevo pedido creado");
                }
                cerrarFormulario();
            } catch(e) { showToast("Error al guardar", "error"); }
            finally { btn.disabled = false; btn.innerHTML = 'Guardar'; }
        };

        window.abrirModalConfirmacion = (accion) => {
            if(!viajeSeleccionado) return;
            const modal = document.getElementById('modal-confirm');
            const content = document.getElementById('modal-confirm-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.cerrarModalConfirmacion = () => {
            const modal = document.getElementById('modal-confirm'); const content = document.getElementById('modal-confirm-content');
            content.classList.add('scale-95'); modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        window.eliminarPedidoDefinitivo = async () => {
            if(!viajeSeleccionado) return;
            try {
                if(viajeSeleccionado.es_grupo) {
                    const batch = db.batch();
                    viajeSeleccionado.pedidos_incluidos.forEach(p => { batch.delete(db.collection('rutas_logistica').doc(p.id)); });
                    await batch.commit();
                } else { await db.collection('rutas_logistica').doc(viajeSeleccionado.id).delete(); }
                showToast("Eliminado correctamente"); cerrarModalConfirmacion(); cerrarDetalle();
            } catch(e) { showToast("Error al eliminar", "error"); }
        };

        // ==========================================
        // OTRAS FUNCIONES (Reacomodo, Asignar)
        // ==========================================
        window.optimizarRuta = async (vehiculoId) => {
            const viajesCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === vehiculoId && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
            if(viajesCamion.length < 2) return showToast("No hay suficientes paradas para optimizar", "error");
            showToast("Optimizando ruta inteligentemente...", "info");

            let urgentes = viajesCamion.filter(x => x.urgente); let normales = viajesCamion.filter(x => !x.urgente);
            let currentPt = coordPlantaEEN; let ordered = [];
            
            const calcularVecinoMasCercano = (listaNoVisitada) => {
                while(listaNoVisitada.length > 0) {
                    let nearestIdx = 0; let minDist = Infinity;
                    for(let i=0; i<listaNoVisitada.length; i++) {
                        let pt = L.latLng(listaNoVisitada[i].coordenadas.lat, listaNoVisitada[i].coordenadas.lng);
                        let dist = currentPt.distanceTo(pt);
                        if(dist < minDist) { minDist = dist; nearestIdx = i; }
                    }
                    currentPt = L.latLng(listaNoVisitada[nearestIdx].coordenadas.lat, listaNoVisitada[nearestIdx].coordenadas.lng);
                    ordered.push(listaNoVisitada[nearestIdx]); listaNoVisitada.splice(nearestIdx, 1);
                }
            };

            calcularVecinoMasCercano(urgentes); calcularVecinoMasCercano(normales);
            const batch = db.batch();
            ordered.forEach((v, idx) => {
                const nuevoOrden = (idx + 1) * 10;
                v.pedidos_incluidos.forEach(p => { batch.update(db.collection('rutas_logistica').doc(p.id), { orden_ruta: nuevoOrden }); });
            });

            try { await batch.commit(); showToast("¡Ruta perfecta generada!"); } catch(e) { showToast("Error al optimizar", "error"); }
        };

        window.moverParada = async (vehiculoId, index, direccion) => {
            const viajesCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === vehiculoId && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
            viajesCamion.sort((a,b) => (a.orden_ruta || 9999999999999) - (b.orden_ruta || 9999999999999));
            const targetIdx = index + direccion; if(targetIdx < 0 || targetIdx >= viajesCamion.length) return;

            viajesCamion.forEach((v, i) => v.orden_ruta_temp = (i + 1) * 10);
            const temp = viajesCamion[index].orden_ruta_temp;
            viajesCamion[index].orden_ruta_temp = viajesCamion[targetIdx].orden_ruta_temp;
            viajesCamion[targetIdx].orden_ruta_temp = temp;

            showToast("Actualizando ruta...", "info");
            const batch = db.batch();
            viajesCamion.forEach(v => {
                v.pedidos_incluidos.forEach(p => { batch.update(db.collection('rutas_logistica').doc(p.id), { orden_ruta: v.orden_ruta_temp }); });
            });
            try { await batch.commit(); } catch(e) { showToast("Error al reordenar", "error"); }
        };

        window.seleccionarVehiculoDinamico = (id) => {
            window.vehiculoSeleccionadoTemp = id;
            document.querySelectorAll('.btn-vehiculo-dinamico').forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                b.classList.add('border-slate-200');
                b.querySelector('div').classList.remove('bg-blue-500', 'text-white');
            });
            const btn = document.getElementById('btn-veh-' + id);
            btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
            btn.querySelector('div').classList.add('bg-blue-500', 'text-white');
        };

        window.iniciarRutaDinamica = () => {
            const v = window.vehiculoSeleccionadoTemp;
            const c = document.getElementById('selector-chofer-dinamico').value;
            if(!v) return showToast("Falta seleccionar el vehículo", "error");
            if(!c) return showToast("Falta seleccionar el operador", "error");
            
            showToast("Asignando ruta al chofer...", "info");
            ejecutarAccionBatch('camino', v, c);
        };

        async function ejecutarAccionBatch(accion, vehiculo = null, chofer = null) {
            if(!viajeSeleccionado) return;
            try {
                const batch = db.batch();
                viajeSeleccionado.pedidos_incluidos.forEach(ped => {
                    let data = { estado: accion, fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp() };
                    if(accion === 'pendiente') { data.vehiculo_asignado = null; data.chofer_asignado = null; data.motivo_falla = null; data.foto_evidencia = null; }
                    else if(accion === 'camino') { data.vehiculo_asignado = vehiculo; data.chofer_asignado = chofer; }
                    batch.update(db.collection('rutas_logistica').doc(ped.id), data);
                });
                await batch.commit(); showToast("Acción guardada exitosamente"); cerrarDetalle();
            } catch(e) { showToast("Error al guardar en base de datos", "error"); }
        }

        window.copiarDireccion = () => { if(viajeSeleccionado) { navigator.clipboard.writeText(viajeSeleccionado.direccion).then(() => showToast("Dirección copiada")).catch(() => document.execCommand('copy')); } };

        function cargarDatosMaestros() {
            db.collection('flota').onSnapshot(snap => { flotaDB = []; snap.forEach(doc => flotaDB.push({ id: doc.id, ...doc.data() })); });
            db.collection('choferes').onSnapshot(snap => { choferesDB = []; snap.forEach(doc => choferesDB.push({ id: doc.id, ...doc.data() })); });

            db.collection('rutas_logistica').where('estado', 'in', ['pendiente', 'camino', 'fallido']).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasActivasDB[ch.doc.id];
                    else rutasActivasDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });

            db.collection('rutas_logistica').orderBy('fecha_actualizacion', 'desc').limit(100).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasRecientesDB[ch.doc.id];
                    else rutasRecientesDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });
        }
        
        window.onload = () => { initMap(); cargarDatosMaestros(); };
    </script>
</body>
