<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística y Rutas - EEN Premium</title>

    <!-- Leaflet (SIN Routing Machine para evitar que rompa la interfaz) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        #map { z-index: 10; }
        
        .pedido-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border-left: 4px solid transparent; }
        .pedido-card:hover { transform: translateX(4px) translateY(-2px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08); }
        .pedido-card.active { border-left-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1); }
        
        .status-badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 4px; }
        .status-pendiente { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .status-camino { background-color: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe; }
        .status-entregado { background-color: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
        .status-fallido { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; animation: pulse-border 2s infinite; } 

        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(220, 38, 38, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); } }
        
        #detalle-drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .btn-vehiculo-dinamico.selected { border-color: #3b82f6; background-color: #eff6ff; color: #1d4ed8; box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.15); transform: translateY(-1px); }
    </style>
</head>

                    <h1 class="text-lg font-black tracking-tight leading-none">Logística EEN</h1>

            </div>

        <div class="px-4 pt-4 pb-2 bg-slate-50 shrink-0">

            <button onclick="setFilter('pendiente')" id="filter-pendiente" class="filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-all">Por Asignar</button>

            <div class="w-full flex justify-center pt-3 pb-1 lg:hidden bg-slate-900" onclick="cerrarDetalle()">
                <div class="w-12 h-1.5 bg-white/30 rounded-full"></div>
            </div>
            <div class="bg-slate-900 p-5 lg:p-6 shrink-0 relative">
                <button onclick="cerrarDetalle()" class="absolute top-5 right-5 text-slate-400 hover:text-white transition bg-white/10 w-8 h-8 rounded-full flex items-center justify-center hidden lg:flex"><i class="fas fa-times"></i></button>
                <div class="flex justify-between items-start mb-3 pr-10">
                    <div class="flex gap-2 items-center">
                        <span id="det-folio" class="text-xs font-mono font-bold text-blue-200 bg-blue-500/20 px-2.5 py-1 rounded-md border border-blue-500/30">FOLIO</span>
                        <button onclick="abrirEdicion()" class="text-amber-400 hover:text-amber-300 bg-amber-400/10 px-2.5 py-1 rounded-md text-[10px] font-bold transition flex items-center gap-1 border border-amber-400/20"><i class="fas fa-edit"></i> Editar</button>
                        <button onclick="abrirModalConfirmacion('eliminar')" class="text-red-400 hover:text-red-300 bg-red-400/10 px-2.5 py-1 rounded-md text-[10px] font-bold transition flex items-center gap-1 border border-red-400/20"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <span id="det-status" class="status-badge">ESTADO</span>

                <h3 id="det-cliente" class="text-xl lg:text-2xl font-black text-white leading-tight mt-2 flex flex-wrap items-center gap-2">Cliente</h3>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 w-[90%] md:w-max z-[9999]"></div>

    <script>
        document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let map, marcadores = {}, capaRuta = null; // Usaremos capaRuta para dibujar polilineas seguras
        
        let rutasActivasDB = {}; let rutasRecientesDB = {}; 
        let viajesAgrupados = [], filtroActual = 'todos', viajeSeleccionado = null; 
        let flotaDB = [], choferesDB = [], clientesDB = []; 
        let vehiculoSeleccionadoTemp = null;

        const coordPlantaEEN = L.latLng(25.689804, -100.312066); 

        window.showToast = (msg, type='success') => {
            const t = document.createElement('div');
            t.className = `toast-enter text-white px-6 py-3.5 rounded-2xl shadow-2xl ${type === 'error' ? 'bg-red-600' : (type==='info' ? 'bg-blue-600' : 'bg-slate-800')} text-sm font-bold text-center border border-white/10 pointer-events-auto flex items-center gap-2 justify-center`;
            t.innerHTML = `${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-check-circle text-emerald-400"></i>'} ${msg}`; 
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.classList.replace('toast-enter', 'toast-leave'); setTimeout(() => t.remove(), 300); }, 4000);
        };

        const icons = {
            bodega: L.divIcon({ className: 'custom-icon', html: `<div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl border-2 border-white transform transition hover:scale-110"><i class="fas fa-building text-base"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] }),
            paqueteria: L.divIcon({ className: 'custom-icon', html: `<div class="w-10 h-10 bg-purple-600 rounded-full flex items-center justify-center text-white shadow-xl border-2 border-white transform transition hover:scale-110"><i class="fas fa-boxes text-base"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] }),
            entregado: L.divIcon({ className: 'custom-icon', html: `<div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-xl border-2 border-white"><i class="fas fa-check-double text-base"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] }),
            fallido: L.divIcon({ className: 'custom-icon cursor-move', html: `<div class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center text-white shadow-xl border-2 border-white animate-bounce"><i class="fas fa-exclamation-triangle text-base"></i></div>`, iconSize: [40, 40], iconAnchor: [20, 40] })
        };

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([25.689804, -100.312066], 13);
            L.control.zoom({ position: 'topleft' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            L.marker([25.689804, -100.312066], { icon: L.divIcon({ className: 'custom-icon', html: `<div class="w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center text-white shadow-2xl border-4 border-white z-50"><i class="fas fa-industry text-xl"></i></div>`, iconSize: [48, 48], iconAnchor: [24, 48] }) }).addTo(map).bindPopup("<b class='font-bold text-sm'>Matriz EEN</b>");
        }

        // =========================================================================
        // MOTOR DE RUTAS DIRECTO VÍA API OSRM (Sustituye a Leaflet Routing Machine)
        // =========================================================================
        async function trazarRutaCalles(waypointsArray, skipAnimation) {
            if(capaRuta) map.removeLayer(capaRuta);
            
            // Si solo hay 1 punto extra (ida y vuelta a matriz)
            const coordsStr = waypointsArray.map(wp => `${wp.lng},${wp.lat}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.code !== 'Ok') throw new Error("No se pudo rutear");

                const route = data.routes[0];
                const coordsArr = route.geometry.coordinates.map(c => [c[1], c[0]]); // Leaflet usa [Lat, Lng]

                // Dibujamos la polilínea sobre las calles (sin basura en la interfaz)
                capaRuta = L.polyline(coordsArr, { color: '#3b82f6', weight: 6, opacity: 0.8 }).addTo(map);
                
                if(!skipAnimation) map.fitBounds(capaRuta.getBounds(), { padding: [50, 50] });

                const distKm = (route.distance / 1000).toFixed(1);
                const timeMins = Math.round(route.duration / 60);

                const elDist = document.getElementById('calc-dist');
                const elTime = document.getElementById('calc-time');
                if(elDist) elDist.innerText = `${distKm} km`;
                if(elTime) elTime.innerText = timeMins > 60 ? `${Math.floor(timeMins/60)}h ${timeMins%60}m` : `${timeMins} min`;

            } catch(e) {
                console.warn("Fallo en API de ruteo. Dibujando línea recta como rescate.", e);
                capaRuta = L.polyline(waypointsArray, { color: '#94a3b8', weight: 4, opacity: 0.7, dashArray: '10, 10' }).addTo(map);
                if(!skipAnimation) map.fitBounds(capaRuta.getBounds(), { padding: [50, 50] });
                
                // Calculo matemático de emergencia
                let distMetros = 0;
                for(let i=0; i<waypointsArray.length-1; i++) distMetros += waypointsArray[i].distanceTo(waypointsArray[i+1]);
                const kmUrbanos = ((distMetros / 1000) * 1.35).toFixed(1);
                const minsEstimados = Math.round((kmUrbanos / 30) * 60) + (waypointsArray.length * 10);
                
                const elDist = document.getElementById('calc-dist');
                const elTime = document.getElementById('calc-time');
                if(elDist) elDist.innerText = `~${kmUrbanos} km`;
                if(elTime) elTime.innerText = `~${minsEstimados} min`;
            }
        }

        function compilarDatosRutas() {
            const arrayUnico = []; const controlMap = {};
            const juntar = (dict) => { Object.values(dict).forEach(r => { if(!controlMap[r.id]) { controlMap[r.id] = true; arrayUnico.push(r); } }); };
            juntar(rutasActivasDB); juntar(rutasRecientesDB);
            agruparYConsolidar(arrayUnico);
        }

        function agruparYConsolidar(pedidosRaw) {
            viajesAgrupados = []; const paqueteriasMap = {};
            pedidosRaw.forEach(p => {
                const estadoLimpio = String(p.estado || 'pendiente').toLowerCase().trim();
                let coordsLimpia = p.coordenadas;
                if (!coordsLimpia || typeof coordsLimpia.lat === 'undefined' || isNaN(coordsLimpia.lat)) { coordsLimpia = { lat: 25.6866, lng: -100.3161 }; }

                if (p.tipo_destino === 'paqueteria') {
                    const key = `${p.nombre_paqueteria}_${estadoLimpio}`;
                    if (!paqueteriasMap[key]) {
                        paqueteriasMap[key] = { 
                            es_grupo: true, id: `GRP-${p.id}`, cliente_nombre: `Consolidado: ${p.nombre_paqueteria}`, 
                            tipo_destino: 'paqueteria', direccion: p.direccion, coordenadas: coordsLimpia, 
                            estado: estadoLimpio, vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, 
                            motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, 
                            foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [] 
                        };
                    }
                    if (p.urgente) paqueteriasMap[key].urgente = true;
                    if (p.foto_evidencia) paqueteriasMap[key].foto_evidencia = p.foto_evidencia;
                    paqueteriasMap[key].orden_ruta = Math.min(paqueteriasMap[key].orden_ruta, p.orden_ruta || 9999999999999);
                    paqueteriasMap[key].pedidos_incluidos.push(p);
                } else { 
                    viajesAgrupados.push({ es_grupo: false, id: p.id, cliente_nombre: p.cliente_nombre, tipo_destino: 'bodega_cliente', direccion: p.direccion, coordenadas: coordsLimpia, estado: estadoLimpio, vehiculo_asignado: p.vehiculo_asignado, chofer_asignado: p.chofer_asignado, motivo_falla: p.motivo_falla, urgente: p.urgente || false, orden_ruta: p.orden_ruta || 9999999999999, foto_evidencia: p.foto_evidencia || null, pedidos_incluidos: [p] }); 
                }
            });
            Object.values(paqueteriasMap).forEach(g => viajesAgrupados.push(g));
            viajesAgrupados.sort((a,b) => { const ord = { 'fallido': 1, 'pendiente': 2, 'camino': 3, 'entregado': 4 }; return (ord[a.estado] || 5) - (ord[b.estado] || 5); });
            
            renderizarLista(); actualizarMapa();
            
            if (viajeSeleccionado) {
                const actualizado = viajesAgrupados.find(v => v.id === viajeSeleccionado.id);
                if (actualizado) { viajeSeleccionado = actualizado; seleccionarViaje(viajeSeleccionado.id, true); } else { cerrarDetalle(); }
            }
        }

        window.setFilter = (filtro) => {
            filtroActual = filtro;
            document.querySelectorAll('.filter-btn').forEach(b => b.className = "filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-all");
            document.getElementById(`filter-${filtro}`).className = `filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md ${filtro==='fallido'?'bg-red-600 text-white shadow-red-500/20':'bg-blue-600 text-white shadow-blue-500/20'}`;
            renderizarLista(); actualizarMapa(); cerrarDetalle();
        }

        function renderizarLista() {
            const container = document.getElementById('lista-pedidos'); container.innerHTML = '';
            const termino = document.getElementById('buscar-ruta-input')?.value.toLowerCase() || '';
            const filtrados = (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual))
                .filter(v => v.cliente_nombre.toLowerCase().includes(termino) || v.id.toLowerCase().includes(termino) || (v.direccion && v.direccion.toLowerCase().includes(termino)));
            
            filtrados.sort((a, b) => { if(a.estado === b.estado) return (a.orden_ruta || 99999999999) - (b.orden_ruta || 99999999999); return 0; });

            if(filtrados.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold flex flex-col items-center"><i class="fas ${termino ? 'fa-search' : 'fa-check-circle text-emerald-400'} text-4xl mb-3"></i><span>${termino ? 'Sin resultados.' : 'Bandeja limpia.'}</span></div>`; 
                return;
            }

            let htmlAcumulado = '';
            filtrados.forEach(v => {
                const isActive = viajeSeleccionado && v.id === viajeSeleccionado.id ? 'active' : '';
                let stClass, stText, icClass;
                if(v.estado === 'fallido') { stClass = 'status-fallido'; stText = 'Problema'; icClass = 'fa-exclamation-triangle'; }
                else if(v.estado === 'pendiente') { stClass = 'status-pendiente'; stText = 'Por Asignar'; icClass = 'fa-clock'; }
                else if(v.estado === 'camino') { stClass = 'status-camino'; stText = 'En Ruta'; icClass = 'fa-truck-fast'; }
                else { stClass = 'status-entregado'; stText = 'Entregado'; icClass = 'fa-check-double'; }

                let bHtml = '';
                if (v.estado === 'fallido') bHtml = `<div class="mt-2.5 pt-2.5 border-t border-red-100 text-[10px] font-bold text-red-600 truncate bg-red-50 px-2 py-1 rounded-md"><i class="fas fa-info-circle"></i> ${v.motivo_falla || 'Problema reportado'}</div>`;
                else if (v.vehiculo_asignado && v.estado !== 'pendiente') {
                    const choferNombre = choferesDB.find(c => c.id === v.chofer_asignado)?.nombre || 'Chofer';
                    bHtml = `<div class="mt-2.5 pt-2 border-t border-slate-100 flex justify-between items-center text-[9px] font-bold text-slate-500"><span class="bg-slate-100 px-2 py-1 rounded-md"><i class="fas fa-truck text-slate-400"></i> ${flotaDB.find(f => f.id === v.vehiculo_asignado)?.nombre || 'Vehículo'}</span> <span class="text-blue-600"><i class="fas fa-user-circle"></i> ${choferNombre}</span></div>`;
                }

                const badgeUrgente = v.urgente ? `<span class="bg-gradient-to-r from-red-500 to-red-600 text-white px-1.5 py-0.5 rounded text-[8px] font-black uppercase ml-2 shadow-sm shadow-red-500/30"><i class="fas fa-fire-alt"></i> Urgente</span>` : '';
                const badgeFoto = v.foto_evidencia ? `<span class="text-slate-400 ml-1" title="Contiene foto"><i class="fas fa-camera"></i></span>` : '';

                htmlAcumulado += `<div onclick="seleccionarViaje('${v.id}')" class="pedido-card ${isActive} ${v.es_grupo?'paqueteria-group':'bg-white'} ${v.urgente?'border-l-4 border-l-red-500':''} p-4 rounded-2xl shadow-sm border border-slate-200 cursor-pointer"><div class="flex justify-between items-start mb-2"><span class="status-badge ${stClass}"><i class="fas ${icClass}"></i> ${stText}</span>${badgeFoto}</div><h4 class="font-black text-slate-800 text-sm truncate mb-1">${v.cliente_nombre}${badgeUrgente}</h4><p class="text-[10px] text-slate-500 truncate mb-1 font-medium"><i class="fas fa-map-marker-alt text-red-400 w-4"></i> ${v.direccion}</p>${bHtml}</div>`;
            });
            container.innerHTML = htmlAcumulado;
        }

        function actualizarMapa() {
            Object.values(marcadores).forEach(m => map.removeLayer(m));
            if(capaRuta) { map.removeLayer(capaRuta); capaRuta = null; }
            marcadores = {}; const bounds = [[25.689804, -100.312066]]; 

            (filtroActual === 'todos' ? viajesAgrupados : viajesAgrupados.filter(p => p.estado === filtroActual)).forEach(v => {
                if(!v.coordenadas) return;
                let ico = icons.bodega; if(v.estado === 'entregado') ico = icons.entregado; else if(v.estado === 'fallido') ico = icons.fallido; else if(v.tipo_destino === 'paqueteria') ico = icons.paqueteria;
                
                const mk = L.marker([v.coordenadas.lat, v.coordenadas.lng], { icon: ico, draggable: false }).addTo(map);
                mk.on('click', () => seleccionarViaje(v.id));
                marcadores[v.id] = mk; bounds.push([v.coordenadas.lat, v.coordenadas.lng]);
            });
            if(bounds.length > 0 && !viajeSeleccionado) map.fitBounds(bounds, { padding: [50, 50] });
        }

        window.seleccionarViaje = (id, skipAnimation = false) => {
            viajeSeleccionado = viajesAgrupados.find(x => x.id === id); if(!viajeSeleccionado) return;
            renderizarLista(); 

            const badge = document.getElementById('det-status'); 
            document.getElementById('det-folio').innerText = viajeSeleccionado.id; 
            document.getElementById('det-cliente').innerHTML = `${viajeSeleccionado.cliente_nombre} ` + (viajeSeleccionado.urgente ? `<span class="bg-red-500 text-white px-2 py-0.5 rounded-md text-[10px] font-black uppercase align-middle ml-2 shadow-sm"><i class="fas fa-fire-alt"></i> Urgente</span>` : ``); 
            document.getElementById('det-tipo-destino').innerHTML = viajeSeleccionado.tipo_destino === 'paqueteria' ? "<i class='fas fa-truck-loading text-purple-500'></i> Envío por Paquetería" : "<i class='fas fa-building text-blue-500'></i> Entrega a Bodega Local";

            const estadoActual = viajeSeleccionado.estado;
            if(estadoActual === 'pendiente') { badge.className = 'status-badge status-pendiente'; badge.innerHTML = '<i class="fas fa-clock"></i> Por Asignar'; }
            else if(estadoActual === 'camino') { badge.className = 'status-badge status-camino'; badge.innerHTML = '<i class="fas fa-truck-fast"></i> En Ruta'; }
            else if(estadoActual === 'fallido') { badge.className = 'status-badge status-fallido'; badge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Problema'; }
            else { badge.className = 'status-badge status-entregado'; badge.innerHTML = '<i class="fas fa-check-double"></i> Entregado'; }

            let htmlDinamico = '';

            if(estadoActual === 'fallido') {
                htmlDinamico += `
                    <div class="bg-red-50 border border-red-200 p-5 rounded-2xl shadow-sm">
                        <p class="text-[11px] font-black text-red-600 uppercase mb-2 flex items-center gap-1.5"><i class="fas fa-exclamation-circle text-lg"></i> Motivo de la Falla</p>
                        <p class="text-sm font-bold text-red-900 mb-4 bg-white p-3 rounded-xl border border-red-100">${viajeSeleccionado.motivo_falla || 'Sin detalle adicional'}</p>
                        ${viajeSeleccionado.foto_evidencia ? `<img src="${viajeSeleccionado.foto_evidencia}" class="w-full h-40 object-cover rounded-xl shadow-sm border border-red-200 mb-4">` : ''}
                        <button onclick="abrirModalConfirmacion('reactivar')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white py-3.5 rounded-xl font-black shadow-lg shadow-amber-500/30 transition flex items-center justify-center gap-2"><i class="fas fa-redo"></i> Reasignar a Pendientes</button>
                    </div>`;
            } else if (estadoActual === 'entregado' && viajeSeleccionado.foto_evidencia) {
                htmlDinamico += `
                    <div class="bg-slate-900 p-5 rounded-2xl shadow-lg relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-20 h-20 bg-emerald-500/20 rounded-bl-full blur-xl"></div>
                        <p class="text-[10px] font-bold text-emerald-400 uppercase mb-3 flex items-center gap-2"><i class="fas fa-camera text-lg"></i> Evidencia de Entrega</p>
                        <img src="${viajeSeleccionado.foto_evidencia}" class="w-full h-48 object-cover rounded-xl shadow-md border border-slate-700 relative z-10">
                    </div>`;
            }

            const listFacturas = viajeSeleccionado.pedidos_incluidos.map(p => `<li class="text-xs font-bold text-slate-700 py-2 border-b border-slate-100 last:border-0 flex items-center gap-2"><i class="fas fa-file-invoice text-blue-500"></i> ${p.id}</li>`).join('');
            htmlDinamico += `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm relative group">
                    <button onclick="copiarDireccion()" class="absolute top-3 right-3 text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 p-2 rounded-lg text-xs transition border border-transparent hover:border-blue-200"><i class="fas fa-copy"></i></button>
                    <div class="flex items-start gap-3 mb-5">
                        <div class="mt-1 w-8 h-8 rounded-full bg-red-100 text-red-500 flex items-center justify-center shrink-0"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="pr-8">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Dirección Exacta</p>
                            <p class="text-sm text-slate-800 font-bold leading-snug">${viajeSeleccionado.direccion}</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Documentos a Entregar:</p>
                        <ul>${listFacturas}</ul>
                    </div>
                </div>`;

            // PREPARAR PUNTOS Y SECUENCIA
            const cDest = L.latLng(viajeSeleccionado.coordenadas.lat, viajeSeleccionado.coordenadas.lng);
            let wps = [];
            let htmlSecuenciaItems = '';
            
            if (estadoActual === 'camino' || estadoActual === 'entregado') {
                const viajesMismoCamion = viajesAgrupados.filter(v => v.vehiculo_asignado === viajeSeleccionado.vehiculo_asignado && (v.estado === 'camino' || v.estado === 'entregado') && v.coordenadas);
                viajesMismoCamion.sort((a,b) => (a.orden_ruta || 9999999999999) - (b.orden_ruta || 9999999999999));

                wps = [coordPlantaEEN];
                htmlSecuenciaItems += `<li class="flex items-center gap-3 pb-3"><div class="w-8 h-8 bg-slate-900 text-white rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white ml-2 z-10"><i class="fas fa-industry"></i></div> <span class="text-sm font-bold text-slate-800">Planta EEN <span class="text-[10px] font-normal text-slate-500 ml-1">(Salida)</span></span></li>`;
                
                viajesMismoCamion.forEach((v, idx) => {
                    wps.push(L.latLng(v.coordenadas.lat, v.coordenadas.lng));
                    const bgColor = v.urgente ? 'bg-red-500' : 'bg-blue-600';
                    const textColor = v.urgente ? 'text-red-600' : 'text-slate-800';
                    const urgBadge = v.urgente ? `<span class="bg-red-100 text-red-600 px-1.5 py-0.5 rounded-md text-[8px] font-black uppercase ml-2 border border-red-200">Urgente</span>` : '';
                    
                    htmlSecuenciaItems += `
                        <li class="flex items-center gap-3 py-3 relative border-l-2 border-slate-200 ml-6 pl-4 before:absolute before:w-3 before:h-3 before:bg-slate-200 before:rounded-full before:-left-[7px] before:top-1/2 before:-translate-y-1/2">
                            <div class="w-6 h-6 ${bgColor} text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow-sm shrink-0">${idx + 1}</div>
                            <span class="truncate text-sm flex-1 font-bold ${textColor}">${v.cliente_nombre}${urgBadge}</span>
                        </li>`;
                });
                wps.push(coordPlantaEEN);
                htmlSecuenciaItems += `<li class="flex items-center gap-3 pt-3 mt-1"><div class="w-8 h-8 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white ml-2 z-10"><i class="fas fa-flag-checkered"></i></div> <span class="text-sm font-bold text-slate-800">Retorno a Base</span></li>`;
            } else {
                wps = [coordPlantaEEN, cDest];
                htmlSecuenciaItems = `
                    <li class="flex items-center gap-3 pb-4 relative border-l-2 border-dashed border-slate-300 ml-6 pl-5">
                        <div class="absolute -left-[17px] top-0 w-8 h-8 bg-slate-900 text-white rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white"><i class="fas fa-industry"></i></div> 
                        <span class="text-sm font-bold text-slate-800">Planta EEN</span>
                    </li>
                    <li class="flex items-center gap-3 relative ml-6 pl-5">
                        <div class="absolute -left-[17px] top-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white"><i class="fas fa-map-marker-alt"></i></div> 
                        <span class="truncate text-sm font-black text-blue-900">${viajeSeleccionado.cliente_nombre}</span>
                    </li>`;
            }

            // LLAMAMOS AL NUEVO SISTEMA DE DIBUJADO LIMPIO
            trazarRutaCalles(wps, skipAnimation);

            htmlDinamico += `
                <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-5 shadow-sm">
                    <div class="flex justify-between items-center mb-4 border-b border-indigo-100/80 pb-3">
                        <p class="text-[11px] font-black text-indigo-800 uppercase tracking-wider flex items-center gap-2"><i class="fas fa-route text-indigo-500 text-lg"></i> Secuencia de Ruta</p>
                    </div>
                    <ul class="mb-5 relative">${htmlSecuenciaItems}</ul>
                    
                    <div class="bg-white p-3 rounded-xl border border-indigo-100 flex justify-between items-center shadow-sm">
                        <div class="text-center flex-1 border-r border-indigo-50">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Distancia Aprox</p>
                            <p class="text-base font-black text-indigo-700 mt-0.5" id="calc-dist"><i class="fas fa-spinner fa-spin text-xs"></i></p>
                        </div>
                        <div class="text-center flex-1">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Tiempo Aprox</p>
                            <p class="text-base font-black text-emerald-600 mt-0.5" id="calc-time"><i class="fas fa-spinner fa-spin text-xs"></i></p>
                        </div>
                    </div>
                </div>`;

            if(estadoActual === 'pendiente') {
                const htmlVehiculos = flotaDB.map(v => `<button onclick="seleccionarVehiculoDinamico('${v.id}')" id="btn-veh-${v.id}" class="btn-vehiculo-dinamico p-3 border-2 border-slate-200 rounded-xl text-xs font-bold bg-white transition-all w-full text-left truncate text-slate-600 hover:border-blue-300 flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center shrink-0"><i class="fas fa-truck"></i></div> <span class="truncate">${v.nombre}</span></button>`).join('');
                const htmlChoferes = `<option value="">-- Seleccionar Operador --</option>` + choferesDB.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
                
                htmlDinamico += `
                    <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-5 shadow-sm relative overflow-hidden mt-6">
                        <div class="absolute -right-4 -top-4 text-blue-200/50 text-6xl"><i class="fas fa-clipboard-check"></i></div>
                        <h4 class="text-xs font-black text-blue-900 uppercase tracking-wider mb-5 relative z-10">Asignar Unidad y Operador</h4>
                        
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">1. Selecciona Vehículo</label>
                        <div class="grid grid-cols-2 gap-3 mb-5 relative z-10">${htmlVehiculos || '<p class="text-xs text-red-500">No hay vehículos registrados</p>'}</div>
                        
                        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">2. Asigna Chofer</label>
                        <select id="selector-chofer-dinamico" class="w-full border-2 border-slate-200 bg-white p-3.5 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none text-sm font-bold text-slate-700 mb-6 relative z-10 cursor-pointer transition-all shadow-sm">${htmlChoferes || '<option value="">No hay choferes</option>'}</select>
                        
                        <button onclick="iniciarRutaDinamica()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-sm font-black transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 uppercase active:scale-95 relative z-10"><i class="fas fa-play"></i> Confirmar e Iniciar Ruta</button>
                    </div>`;
            }

            document.getElementById('drawer-dynamic-content').innerHTML = htmlDinamico;
            const drawer = document.getElementById('detalle-drawer');
            if(window.innerWidth < 1024) { drawer.classList.remove('translate-y-full'); } else { drawer.classList.remove('translate-x-full'); }
            window.vehiculoSeleccionadoTemp = null; 
        }

        window.cerrarDetalle = () => { 
            viajeSeleccionado = null; 
            renderizarLista(); 
            if(capaRuta) { map.removeLayer(capaRuta); capaRuta = null; } 
            const drawer = document.getElementById('detalle-drawer'); 
            drawer.classList.add('translate-y-full', 'lg:translate-y-0', 'lg:translate-x-full'); 
        }

        window.copiarDireccion = () => { if(viajeSeleccionado) { navigator.clipboard.writeText(viajeSeleccionado.direccion).then(() => showToast("Dirección copiada")).catch(() => document.execCommand('copy')); } };

        window.seleccionarVehiculoDinamico = (id) => {
            window.vehiculoSeleccionadoTemp = id;
            document.querySelectorAll('.btn-vehiculo-dinamico').forEach(b => b.classList.remove('selected'));
            document.getElementById('btn-veh-' + id).classList.add('selected');
        };

        window.iniciarRutaDinamica = () => {
            const v = window.vehiculoSeleccionadoTemp;
            const c = document.getElementById('selector-chofer-dinamico').value;
            if(!v) return showToast("Falta seleccionar el vehículo", "error");
            if(!c) return showToast("Falta seleccionar el operador", "error");
            
            showToast("Asignando ruta al chofer...", "info");
            ejecutarAccionBatch('camino', v, c);
        };

        async function ejecutarAccionBatch(accion, vehiculo = null, chofer = null) {
            if(!viajeSeleccionado) return;
            try {
                const batch = db.batch();
                viajeSeleccionado.pedidos_incluidos.forEach(ped => {
                    const ref = db.collection('rutas_logistica').doc(ped.id);
                    if(accion === 'borrar') batch.delete(ref);
                    else {
                        let data = { estado: accion, fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp() };
                        if(accion === 'pendiente') { data.vehiculo_asignado = null; data.chofer_asignado = null; data.motivo_falla = null; data.foto_evidencia = null; }
                        else if(accion === 'camino') { data.vehiculo_asignado = vehiculo; data.chofer_asignado = chofer; }
                        batch.update(ref, data);
                    }
                });
                await batch.commit(); showToast("Acción guardada exitosamente"); cerrarDetalle();
            } catch(e) { showToast("Error al guardar en base de datos", "error"); }
        }

        function cargarDatosMaestros() {
            db.collection('flota').onSnapshot(snap => { flotaDB = []; snap.forEach(doc => flotaDB.push({ id: doc.id, ...doc.data() })); });
            db.collection('choferes').onSnapshot(snap => { choferesDB = []; snap.forEach(doc => choferesDB.push({ id: doc.id, ...doc.data() })); });

            db.collection('rutas_logistica').where('estado', 'in', ['pendiente', 'camino', 'fallido']).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasActivasDB[ch.doc.id];
                    else rutasActivasDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });

            db.collection('rutas_logistica').orderBy('fecha_actualizacion', 'desc').limit(100).onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    if(ch.type === 'removed') delete rutasRecientesDB[ch.doc.id];
                    else rutasRecientesDB[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
                });
                compilarDatosRutas();
            });
        }
        
        window.onload = () => { initMap(); cargarDatosMaestros(); };
    </script>
</body>
</html>
