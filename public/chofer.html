<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Chofer - EEN</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- ELIMINAMOS EL STORAGE PORQUE GUARDAREMOS DIRECTO EN BASE DE DATOS -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ocultar barra de scroll en móviles */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            projectId: "productoseen",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- PANTALLA DE LOGIN -->
    <div id="view-login" class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900 relative overflow-hidden z-50">
        <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 left-0 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl"></div>
        
        <div class="w-full max-w-sm bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 shadow-2xl relative z-10 fade-in">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center text-4xl text-white mx-auto mb-6 shadow-lg shadow-blue-500/50">
                <i class="fas fa-truck-moving"></i>
            </div>
            <h1 class="text-2xl font-black text-white text-center mb-2">Portal Operadores</h1>
            <p class="text-blue-200 text-center text-sm font-medium mb-8">Selecciona tu nombre para ver tu ruta</p>
            
            <select id="select-chofer" class="w-full bg-white/90 border-0 p-4 rounded-xl text-slate-800 font-bold outline-none focus:ring-4 focus:ring-blue-500/50 transition mb-6 cursor-pointer">
                <option value="">Cargando operadores...</option>
            </select>
            
            <button onclick="iniciarTurno()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-black py-4 rounded-xl shadow-lg transition active:scale-95 text-lg">
                Ingresar <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL (DASHBOARD) -->
    <div id="view-dashboard" class="flex-1 flex flex-col hidden bg-slate-50 relative z-40">
        <!-- HEADER -->
        <header class="bg-slate-900 pt-12 pb-6 px-6 rounded-b-[2.5rem] shadow-xl shrink-0 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <p class="text-blue-300 text-[10px] font-black uppercase tracking-widest mb-1">Operador Activo</p>
                    <h2 class="text-2xl font-black text-white" id="nombre-chofer-display">Cargando...</h2>
                </div>
                <button onclick="cerrarSesion()" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-sm transition">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- LISTA DE RUTAS -->
        <div class="flex-1 overflow-y-auto p-5 -mt-4 relative z-20 pb-20">
            <div class="flex justify-between items-end mb-4 px-2">
                <h3 class="font-black text-slate-800 text-lg">Mi Ruta de Hoy</h3>
                <span class="text-xs font-bold text-blue-600 bg-blue-100 px-2.5 py-1 rounded-md" id="contador-rutas">0 paradas</span>
            </div>

            <div id="lista-rutas" class="space-y-4">
                <div class="text-center py-12 text-slate-400">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p class="font-bold">Buscando entregas...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ACCIÓN (ENTREGAR / FALLA) -->
    <div id="modal-accion" class="fixed inset-0 bg-slate-900/90 z-[100] hidden flex-col justify-end backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white w-full rounded-t-3xl p-6 transform transition-transform translate-y-full" id="modal-accion-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-slate-800" id="modal-titulo">Acción</h3>
                <button onclick="cerrarModal()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-times"></i></button>
            </div>
            
            <input type="hidden" id="modal-viaje-id">
            <input type="hidden" id="modal-tipo-accion">

            <!-- FOTO INPUT CON COMPRESIÓN -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2"><i class="fas fa-camera"></i> Tomar Foto de Evidencia <span class="text-red-500">*</span></label>
                <input type="file" id="input-foto" accept="image/*" capture="environment" class="hidden" onchange="previewFoto(event)">
                <div id="foto-preview-container" onclick="document.getElementById('input-foto').click()" class="w-full h-40 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center text-slate-400 cursor-pointer overflow-hidden relative">
                    <i class="fas fa-cloud-upload-alt text-3xl mb-2"></i>
                    <span class="text-sm font-bold">Toca para abrir cámara</span>
                    <img id="foto-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                </div>
                <p class="text-[9px] font-bold text-emerald-500 text-center mt-2 bg-emerald-50 py-1 rounded-md border border-emerald-100"><i class="fas fa-bolt"></i> Sistema de Guardado Rápido Activado</p>
            </div>

            <!-- MOTIVO FALLA (Solo para fallas) -->
            <div id="div-motivo" class="mb-6 hidden">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Motivo del problema <span class="text-red-500">*</span></label>
                <textarea id="input-motivo" rows="2" class="w-full border-2 border-slate-200 rounded-xl p-3 focus:border-red-500 outline-none text-sm font-semibold" placeholder="Ej. Domicilio cerrado, no tienen dinero..."></textarea>
            </div>

            <button id="btn-guardar-accion" onclick="procesarAccion()" class="w-full bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition text-lg flex justify-center items-center gap-2">
                Confirmar
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 w-[90%] z-[9999]"></div>

    <script>
        let miId = localStorage.getItem('een_chofer_id');
        let miNombre = localStorage.getItem('een_chofer_nombre');
        let misViajes = [];
        let fotoDataUrl = null;

        window.showToast = (msg, type='success') => {
            const t = document.createElement('div');
            t.className = `toast-enter text-white px-5 py-3 rounded-xl shadow-2xl ${type === 'error' ? 'bg-red-600' : 'bg-slate-800'} text-xs font-bold text-center border border-white/10`;
            t.innerHTML = msg; document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.remove(); }, 3000);
        };

        function cargarChoferes() {
            db.collection('choferes').onSnapshot(snap => {
                const select = document.getElementById('select-chofer');
                select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
                snap.forEach(doc => { select.innerHTML += `<option value="${doc.id}">${doc.data().nombre}</option>`; });
            });
        }

        function verificarSesion() {
            if (miId) {
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-dashboard').classList.remove('hidden');
                document.getElementById('nombre-chofer-display').innerText = miNombre;
                escucharMisRutas();
            } else {
                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-login').classList.remove('hidden');
                cargarChoferes();
            }
        }

        window.iniciarTurno = () => {
            const sel = document.getElementById('select-chofer');
            if(!sel.value) return showToast("Selecciona tu nombre", "error");
            miId = sel.value; miNombre = sel.options[sel.selectedIndex].text;
            localStorage.setItem('een_chofer_id', miId); localStorage.setItem('een_chofer_nombre', miNombre);
            verificarSesion();
        };

        window.cerrarSesion = () => {
            localStorage.removeItem('een_chofer_id'); localStorage.removeItem('een_chofer_nombre');
            miId = null; miNombre = null; verificarSesion();
        };

        function escucharMisRutas() {
            db.collection('rutas_logistica').where('chofer_asignado', '==', miId).where('estado', '==', 'camino')
              .onSnapshot(snap => {
                  misViajes = []; snap.forEach(doc => { misViajes.push({ id: doc.id, ...doc.data() }); });
                  misViajes.sort((a,b) => (a.orden_ruta || 99999) - (b.orden_ruta || 99999));
                  renderizarRutas();
              });
        }

        function renderizarRutas() {
            const cont = document.getElementById('lista-rutas');
            document.getElementById('contador-rutas').innerText = `${misViajes.length} entregas pendientes`;
            
            if(misViajes.length === 0) {
                cont.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm text-center border border-slate-100 mt-10">
                        <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4"><i class="fas fa-check"></i></div>
                        <h4 class="font-black text-slate-800 text-lg">¡Ruta Completada!</h4>
                        <p class="text-slate-500 text-sm font-medium mt-1">No tienes más entregas pendientes.</p>
                    </div>`;
                return;
            }

            cont.innerHTML = misViajes.map((v, index) => {
                let linkNavegar = v.link_maps || '';
                if(!linkNavegar && v.coordenadas && v.coordenadas.lat) {
                    linkNavegar = `https://www.google.com/maps/search/?api=1&query=${v.coordenadas.lat},${v.coordenadas.lng}`;
                }

                return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 relative overflow-hidden fade-in" style="animation-delay: ${index * 0.1}s">
                    ${v.urgente ? '<div class="absolute top-0 right-0 bg-red-500 text-white text-[9px] font-black px-3 py-1 rounded-bl-xl"><i class="fas fa-fire-alt"></i> URGENTE</div>' : ''}
                    <div class="flex items-center gap-3 mb-3 pr-16">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-black shrink-0">${index + 1}</div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">${v.id}</p>
                            <h4 class="font-black text-slate-800 leading-tight">${v.cliente_nombre}</h4>
                        </div>
                    </div>
                    
                    <div class="bg-slate-50 p-3 rounded-xl mb-4 border border-slate-100">
                        <p class="text-xs text-slate-600 font-semibold leading-relaxed mb-2"><i class="fas fa-map-marker-alt text-red-400 w-4"></i> ${v.direccion}</p>
                        
                        <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-200/60">
                            <div class="text-[10px] text-slate-600 font-bold flex items-center gap-1.5"><i class="fas fa-clock text-blue-400"></i> ${v.horario || 'Sin horario esp.'}</div>
                            ${v.telefono ? `<a href="tel:${v.telefono}" class="text-[10px] text-blue-600 font-bold flex items-center justify-end gap-1.5"><i class="fas fa-phone-alt"></i> Llamar</a>` : '<span class="text-[10px] text-slate-400 text-right font-medium">Sin teléfono</span>'}
                        </div>
                        
                        ${linkNavegar ? `<a href="${linkNavegar}" target="_blank" class="mt-3 block w-full bg-blue-100 hover:bg-blue-200 text-blue-700 text-center py-2.5 rounded-lg text-xs font-black transition-colors"><i class="fas fa-location-arrow mr-1"></i> Iniciar Navegación GPS</a>` : ''}
                        
                        ${v.excepcion ? `<p class="text-xs text-amber-600 font-bold mt-3 bg-amber-50 p-2 rounded-lg border border-amber-100"><i class="fas fa-exclamation-triangle"></i> Aviso: ${v.excepcion}</p>` : ''}
                    </div>

                    <div class="flex gap-2">
                        <button onclick="abrirModal('${v.id}', 'entregado')" class="flex-[2] bg-emerald-500 hover:bg-emerald-600 text-white py-3.5 rounded-xl font-black text-sm transition shadow-md shadow-emerald-500/20"><i class="fas fa-camera"></i> Entregado</button>
                        <button onclick="abrirModal('${v.id}', 'fallido')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 py-3.5 rounded-xl font-black text-sm transition border border-red-200"><i class="fas fa-times"></i> Falla</button>
                    </div>
                </div>
            `}).join('');
        }

        window.abrirModal = (viajeId, tipo) => {
            const modal = document.getElementById('modal-accion');
            const content = document.getElementById('modal-accion-content');
            
            document.getElementById('modal-viaje-id').value = viajeId;
            document.getElementById('modal-tipo-accion').value = tipo;
            fotoDataUrl = null;
            document.getElementById('foto-preview').classList.add('hidden');
            document.getElementById('input-foto').value = '';
            document.getElementById('input-motivo').value = '';

            const btnGuardar = document.getElementById('btn-guardar-accion');
            if(tipo === 'entregado') {
                document.getElementById('modal-titulo').innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Reportar Entrega';
                document.getElementById('div-motivo').classList.add('hidden');
                btnGuardar.className = "w-full bg-emerald-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition text-lg flex justify-center items-center gap-2";
                btnGuardar.innerHTML = "Confirmar Entrega";
            } else {
                document.getElementById('modal-titulo').innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> Reportar Problema';
                document.getElementById('div-motivo').classList.remove('hidden');
                btnGuardar.className = "w-full bg-red-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition text-lg flex justify-center items-center gap-2";
                btnGuardar.innerHTML = "Guardar Reporte";
            }

            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('translate-y-full'); }, 10);
        };

        window.cerrarModal = () => {
            const modal = document.getElementById('modal-accion'); const content = document.getElementById('modal-accion-content');
            content.classList.add('translate-y-full'); modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        };

        // ==============================================================
        // SISTEMA DE COMPRESIÓN DE IMÁGENES EN EL NAVEGADOR
        // ==============================================================
        window.previewFoto = (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // Reducimos a un máximo de 800px para que pese casi nada en Base64
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Calidad al 60% en formato JPEG para guardado directo en Firestore
                    fotoDataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    const preview = document.getElementById('foto-preview');
                    preview.src = fotoDataUrl;
                    preview.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.procesarAccion = async () => {
            const id = document.getElementById('modal-viaje-id').value;
            const tipo = document.getElementById('modal-tipo-accion').value;
            const motivo = document.getElementById('input-motivo').value.trim();
            const btn = document.getElementById('btn-guardar-accion');

            if(!fotoDataUrl) return showToast("La foto de evidencia es obligatoria", "error");
            if(tipo === 'fallido' && !motivo) return showToast("Escribe el motivo del problema", "error");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            try {
                // YA NO USAMOS STORAGE! Guardamos la foto (DataURL) directamente en la base de datos de Firestore
                const updateData = {
                    estado: tipo,
                    foto_evidencia: fotoDataUrl, // <-- Guardado directo
                    fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (tipo === 'fallido') updateData.motivo_falla = motivo;

                const viaje = misViajes.find(v => v.id === id);
                if (viaje && viaje.es_grupo) {
                    const batch = db.batch();
                    viaje.pedidos_incluidos.forEach(p => { batch.update(db.collection('rutas_logistica').doc(p.id), updateData); });
                    await batch.commit();
                } else {
                    await db.collection('rutas_logistica').doc(id).update(updateData);
                }

                showToast("¡Registrado con éxito!");
                cerrarModal();
            } catch(e) {
                console.error(e); showToast("Error de conexión al guardar", "error");
            } finally { btn.disabled = false; }
        };

        window.onload = verificarSesion;
    </script>
</body>
</html>
