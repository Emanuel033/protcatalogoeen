<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <title>Logística EEN - Operador</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; overscroll-behavior-y: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .card-entrega { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-entrega:active { transform: scale(0.98); }
        
        .foto-preview { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23cbd5e1"><path d="M12 4L12 20M4 12L20 12" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round"/></svg>'); background-size: 30px; background-repeat: no-repeat; background-position: center; }
        .foto-preview.has-image { background-image: none; }
        
        /* Animación para urgente */
        @keyframes pulse-red { 0%, 100% { background-color: #ef4444; } 50% { background-color: #dc2626; } }
        .badge-urgente { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="flex flex-col h-screen w-full overflow-hidden text-slate-800">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            projectId: "productoseen",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- HEADER MÓVIL (FIJO) -->
    <header class="bg-slate-900 text-white pt-safe border-b border-slate-800 shrink-0 z-20 shadow-md">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-inner font-black text-xl">
                    <i class="fas fa-truck"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg leading-tight">Ruta EEN</h1>
                    <p id="txt-operador" class="text-[10px] text-blue-300 font-bold uppercase tracking-wider">Sin identificar</p>
                </div>
            </div>
            <button onclick="cerrarSesion()" class="w-10 h-10 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
        
        <!-- TABS MÓVILES -->
        <div class="flex px-2 pb-2 gap-2">
            <button onclick="setTab('camino')" id="tab-camino" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-sm transition">
                <i class="fas fa-box-open mr-1"></i> Por Entregar (<span id="count-camino">0</span>)
            </button>
            <button onclick="setTab('entregado')" id="tab-entregado" class="flex-1 bg-slate-800 text-slate-400 py-2.5 rounded-xl font-bold text-xs transition">
                <i class="fas fa-check-double mr-1"></i> Completados (<span id="count-entregado">0</span>)
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL (LISTA DE ENTREGAS) -->
    <main class="flex-1 overflow-y-auto px-4 py-4 hide-scroll bg-slate-100" id="contenedor-viajes">
        <div class="text-center py-20 text-slate-400"><i class="fas fa-spinner fa-spin text-3xl mb-2"></i><br>Cargando ruta...</div>
    </main>

    <!-- ========================================== -->
    <!-- MODAL DE LOGIN (SELECCIONAR CHOFER)        -->
    <!-- ========================================== -->
    <div id="modal-login" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col p-6 transition-opacity opacity-0 hidden">
        <div class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
            <div class="w-24 h-24 bg-blue-600 text-white rounded-3xl flex items-center justify-center text-5xl mb-8 mx-auto shadow-2xl shadow-blue-600/30 transform rotate-3">
                <i class="fas fa-steering-wheel"></i>
            </div>
            <h2 class="text-3xl font-black text-white text-center mb-2">Mi Ruta</h2>
            <p class="text-slate-400 text-center text-sm font-medium mb-8">Selecciona tu perfil para cargar tus entregas.</p>
            
            <div class="bg-slate-800 rounded-3xl p-5 shadow-xl border border-slate-700">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Operador / Chofer</label>
                <select id="select-chofer" class="w-full bg-slate-900 border border-slate-700 text-white text-lg font-bold p-4 rounded-xl outline-none focus:border-blue-500 mb-6 appearance-none text-center">
                    <option value="">Cargando...</option>
                </select>
                
                <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all active:scale-95 text-lg flex items-center justify-center gap-2">
                    Iniciar Ruta <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE ENTREGA EXITOSA (DOBLE FOTO)      -->
    <!-- ========================================== -->
    <div id="modal-entrega" class="fixed inset-0 bg-slate-900/95 z-[50] hidden flex-col items-center justify-end p-2 sm:p-4 backdrop-blur-md transition-opacity opacity-0">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[90vh]" id="modal-entrega-content">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-emerald-50 rounded-t-3xl sm:rounded-t-3xl shrink-0">
                <h3 class="font-black text-emerald-800 flex items-center gap-2"><i class="fas fa-check-circle text-emerald-500"></i> Completar Entrega</h3>
                <button onclick="cerrarModalEntrega()" class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-4 overflow-y-auto hide-scroll flex-1">
                <p class="text-sm font-bold text-slate-600 mb-4 text-center">Para cerrar este pedido es obligatorio adjuntar evidencia fotográfica.</p>
                
                <div class="space-y-4">
                    <!-- FOTO 1: DOCUMENTO -->
                    <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-3 text-center relative overflow-hidden group">
                        <label class="block text-[11px] font-black text-blue-800 uppercase tracking-wider mb-2"><i class="fas fa-file-signature text-blue-500 mr-1"></i> 1. Documento Firmado / Guía</label>
                        <input type="file" accept="image/*" capture="environment" id="cam-doc" class="hidden" onchange="previewImg(this, 'preview-doc')">
                        <div id="preview-doc" onclick="document.getElementById('cam-doc').click()" class="foto-preview w-full h-32 bg-slate-100 rounded-xl border border-slate-200 cursor-pointer bg-cover bg-center flex flex-col justify-end p-2">
                            <span class="bg-slate-900/70 text-white text-[10px] font-bold py-1 px-2 rounded backdrop-blur-sm self-center group-hover:bg-blue-600 transition"><i class="fas fa-camera mr-1"></i> Tomar Foto</span>
                        </div>
                    </div>

                    <!-- FOTO 2: MATERIAL -->
                    <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-3 text-center relative overflow-hidden group">
                        <label class="block text-[11px] font-black text-amber-800 uppercase tracking-wider mb-2"><i class="fas fa-boxes text-amber-500 mr-1"></i> 2. Material Físico Entregado</label>
                        <input type="file" accept="image/*" capture="environment" id="cam-mat" class="hidden" onchange="previewImg(this, 'preview-mat')">
                        <div id="preview-mat" onclick="document.getElementById('cam-mat').click()" class="foto-preview w-full h-32 bg-slate-100 rounded-xl border border-slate-200 cursor-pointer bg-cover bg-center flex flex-col justify-end p-2">
                            <span class="bg-slate-900/70 text-white text-[10px] font-bold py-1 px-2 rounded backdrop-blur-sm self-center group-hover:bg-amber-600 transition"><i class="fas fa-camera mr-1"></i> Tomar Foto</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-4 bg-white border-t border-slate-100 shrink-0 pb-safe">
                <button id="btn-confirmar-entrega" onclick="procesarEntrega()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg shadow-emerald-500/30 text-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-cloud-upload-alt"></i> Subir y Finalizar
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE PROBLEMA / FALLA                  -->
    <!-- ========================================== -->
    <div id="modal-falla" class="fixed inset-0 bg-slate-900/95 z-[50] hidden flex-col items-center justify-end p-2 sm:p-4 backdrop-blur-md transition-opacity opacity-0">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col max-h-[90vh]" id="modal-falla-content">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-red-50 rounded-t-3xl sm:rounded-t-3xl shrink-0">
                <h3 class="font-black text-red-800 flex items-center gap-2"><i class="fas fa-exclamation-triangle text-red-500"></i> Reportar Problema</h3>
                <button onclick="cerrarModalFalla()" class="w-8 h-8 bg-red-100 text-red-600 rounded-full flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-4 overflow-y-auto hide-scroll flex-1">
                <label class="block text-xs font-bold text-slate-600 mb-2">¿Qué sucedió? Describe el problema detalladamente.</label>
                <textarea id="falla-motivo" rows="3" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-medium text-sm text-slate-800 outline-none focus:border-red-500 mb-4" placeholder="Ej. El cliente no está, la dirección no existe, nadie salió..."></textarea>
                
                <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl p-3 text-center relative overflow-hidden group">
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-wider mb-2"><i class="fas fa-camera text-slate-400 mr-1"></i> Evidencia (Opcional pero recomendada)</label>
                    <input type="file" accept="image/*" capture="environment" id="cam-falla" class="hidden" onchange="previewImg(this, 'preview-falla')">
                    <div id="preview-falla" onclick="document.getElementById('cam-falla').click()" class="foto-preview w-full h-32 bg-slate-100 rounded-xl border border-slate-200 cursor-pointer bg-cover bg-center flex flex-col justify-end p-2">
                        <span class="bg-slate-900/70 text-white text-[10px] font-bold py-1 px-2 rounded backdrop-blur-sm self-center group-hover:bg-red-600 transition"><i class="fas fa-camera mr-1"></i> Tomar Foto del Lugar</span>
                    </div>
                </div>
            </div>
            
            <div class="p-4 bg-white border-t border-slate-100 shrink-0 pb-safe">
                <button id="btn-confirmar-falla" onclick="procesarFalla()" class="w-full bg-red-500 hover:bg-red-600 text-white font-black py-4 rounded-xl shadow-lg shadow-red-500/30 text-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> Enviar Reporte
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 w-[90%] md:w-max z-[9999]"></div>

    <!-- CANVAS OCULTO PARA COMPRESIÓN -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <script>
        let myId = localStorage.getItem('een_chofer_id') || null;
        let misViajes = [];
        let tabActual = 'camino';
        let idViajeActivo = null;

        // ==========================================
        // UTILIDADES Y UI
        // ==========================================
        window.showToast = (msg, type='success') => {
            const t = document.createElement('div');
            t.className = `toast-enter text-white px-5 py-3 rounded-2xl shadow-2xl ${type === 'error' ? 'bg-red-600' : 'bg-slate-800'} text-xs font-bold text-center flex items-center gap-2 justify-center border border-white/10`;
            t.innerHTML = `${type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-check-circle text-emerald-400"></i>'} ${msg}`; 
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
        };

        // Compresión de imagen robusta a Base64
        async function compressImage(fileElementId) {
            return new Promise((resolve) => {
                const fileInput = document.getElementById(fileElementId);
                if (!fileInput.files || fileInput.files.length === 0) return resolve(null);
                
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.getElementById('compressCanvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Max Width 800px para que pese súper poco
                        const MAX_WIDTH = 800;
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); // Calidad 60% (Súper ligero)
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.previewImg = (input, previewId) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(previewId);
                    preview.style.backgroundImage = `url(${e.target.result})`;
                    preview.classList.add('has-image');
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        function resetPreview(inputId, previewId) {
            document.getElementById(inputId).value = '';
            const preview = document.getElementById(previewId);
            preview.style.backgroundImage = '';
            preview.classList.remove('has-image');
        }

        // ==========================================
        // LOGIN Y SESIÓN
        // ==========================================
        function initApp() {
            db.collection('choferes').onSnapshot(snap => {
                const select = document.getElementById('select-chofer');
                select.innerHTML = '<option value="">-- Soy... --</option>';
                snap.forEach(doc => { select.innerHTML += `<option value="${doc.id}">${doc.data().nombre}</option>`; });
                
                if (!myId) {
                    const modal = document.getElementById('modal-login');
                    modal.classList.remove('hidden'); setTimeout(() => modal.classList.remove('opacity-0'), 10);
                } else {
                    cargarDatosChofer();
                    escucharRutas();
                }
            });
        }

        window.iniciarSesion = () => {
            const select = document.getElementById('select-chofer');
            if(!select.value) return showToast("Selecciona tu nombre", "error");
            myId = select.value;
            localStorage.setItem('een_chofer_id', myId);
            const modal = document.getElementById('modal-login');
            modal.classList.add('opacity-0'); setTimeout(() => modal.classList.add('hidden'), 300);
            cargarDatosChofer();
            escucharRutas();
        };

        window.cerrarSesion = () => {
            myId = null; localStorage.removeItem('een_chofer_id'); location.reload();
        };

        async function cargarDatosChofer() {
            try {
                const doc = await db.collection('choferes').doc(myId).get();
                if(doc.exists) document.getElementById('txt-operador').innerText = doc.data().nombre;
            } catch(e) {}
        }

        // ==========================================
        // CARGA Y RENDERIZADO DE RUTAS
        // ==========================================
        function escucharRutas() {
            const todayStart = new Date(); todayStart.setHours(0,0,0,0);
            
            // Escuchar TODO lo asignado a este chofer (En camino, fallido, o entregado HOY)
            db.collection('rutas_logistica')
              .where('chofer_asignado', '==', myId)
              .onSnapshot(snap => {
                  misViajes = [];
                  snap.forEach(doc => {
                      const data = doc.data();
                      // Si esta entregado o fallido, solo lo mostramos si fue modificado hoy
                      let mostrar = true;
                      if((data.estado === 'entregado' || data.estado === 'fallido') && data.fecha_actualizacion) {
                          if (data.fecha_actualizacion.toDate() < todayStart) mostrar = false;
                      }
                      
                      if (mostrar && (data.estado === 'camino' || data.estado === 'entregado' || data.estado === 'fallido')) {
                          misViajes.push({ id: doc.id, ...data });
                      }
                  });
                  
                  // Ordenar por el orden de ruta óptimo
                  misViajes.sort((a,b) => (a.orden_ruta || 9999) - (b.orden_ruta || 9999));
                  
                  actualizarContadores();
                  renderizarViajes();
              });
        }

        window.setTab = (estado) => {
            tabActual = estado;
            document.getElementById('tab-camino').className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition shadow-sm ${estado==='camino'?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`;
            document.getElementById('tab-entregado').className = `flex-1 py-2.5 rounded-xl font-bold text-xs transition shadow-sm ${estado==='entregado'?'bg-blue-600 text-white':'bg-slate-800 text-slate-400'}`;
            renderizarViajes();
        };

        function actualizarContadores() {
            const pends = misViajes.filter(v => v.estado === 'camino').length;
            const compts = misViajes.filter(v => v.estado === 'entregado' || v.estado === 'fallido').length;
            document.getElementById('count-camino').innerText = pends;
            document.getElementById('count-entregado').innerText = compts;
        }

        function renderizarViajes() {
            const cont = document.getElementById('contenedor-viajes');
            cont.innerHTML = '';
            
            const filtrados = misViajes.filter(v => tabActual === 'camino' ? v.estado === 'camino' : (v.estado === 'entregado' || v.estado === 'fallido'));
            
            if(filtrados.length === 0) {
                cont.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold"><div class="w-16 h-16 bg-slate-200 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 text-slate-400"><i class="fas ${tabActual==='camino'?'fa-mug-hot':'fa-inbox'}"></i></div> Nada por aquí.</div>`;
                return;
            }

            filtrados.forEach((v, idx) => {
                const esUrgente = v.urgente === true;
                const docs = v.documentacion || {};
                
                let borderColor = 'border-slate-200';
                if(v.estado === 'entregado') borderColor = 'border-emerald-500';
                if(v.estado === 'fallido') borderColor = 'border-red-500';
                if(v.estado === 'camino' && esUrgente) borderColor = 'border-red-500';
                if(v.estado === 'camino' && !esUrgente) borderColor = 'border-blue-500';

                // --- ESTRUCTURACIÓN DE LOS NUEVOS DATOS ---
                const aliasDestino = v.destino_alias ? `<div class="bg-blue-50 text-blue-800 text-xs font-black px-2 py-1.5 rounded-lg mb-2 flex items-center gap-1.5"><i class="fas fa-warehouse text-blue-500"></i> ${v.destino_alias}</div>` : '';
                const telCard = v.destino_telefono || v.telefono_contacto;
                const horarioCard = v.destino_horario ? `<div class="mt-2 bg-amber-50 border border-amber-100 p-2 text-amber-900 rounded-lg text-xs font-bold flex items-center gap-1.5"><i class="fas fa-clock text-amber-500"></i> Horario: ${v.destino_horario}</div>` : '';
                
                // --- BOTONES DE MAPA Y TELÉFONO GRANDES ---
                const btnLlamar = telCard ? `<a href="tel:${telCard}" class="flex-1 bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 py-3 rounded-xl flex items-center justify-center gap-2 font-black text-sm transition"><i class="fas fa-phone"></i> Llamar</a>` : '';
                const btnMapa = v.link_maps ? `<a href="${v.link_maps}" target="_blank" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 py-3 rounded-xl flex items-center justify-center gap-2 font-black text-sm transition"><i class="fas fa-map-marked-alt"></i> Navegar</a>` : `<a href="https://maps.google.com/?q=${encodeURIComponent(v.direccion)}" target="_blank" class="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 py-3 rounded-xl flex items-center justify-center gap-2 font-bold text-sm transition"><i class="fas fa-search-location"></i> Buscar GPS</a>`;

                // --- DOCUMENTACIÓN VISUAL ---
                let docsHTML = '';
                if(docs.factura) docsHTML += '<span class="bg-indigo-100 text-indigo-700 border border-indigo-200 text-[10px] px-2 py-1 rounded-md font-bold shadow-sm">Factura</span> ';
                if(docs.certificados) docsHTML += '<span class="bg-indigo-100 text-indigo-700 border border-indigo-200 text-[10px] px-2 py-1 rounded-md font-bold shadow-sm">Certificados</span> ';
                if(docs.orden_compra) docsHTML += '<span class="bg-indigo-100 text-indigo-700 border border-indigo-200 text-[10px] px-2 py-1 rounded-md font-bold shadow-sm">OC</span> ';
                if(docs.qr_acceso) docsHTML += '<span class="bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] px-2 py-1 rounded-md font-bold shadow-sm"><i class="fas fa-qrcode"></i> QR Acceso</span> ';
                
                const ciegoAlert = docs.envio_ciego ? `<div class="mt-3 bg-slate-800 text-white p-3 rounded-xl text-xs font-black flex items-center gap-3 shadow-md animate-pulse"><i class="fas fa-user-secret text-2xl text-red-400"></i> <div>ATENCIÓN: ENVÍO CIEGO<br><span class="text-[10px] font-medium text-slate-300">No entregar papeles con logos EEN.</span></div></div>` : '';

                // --- ACCIONES FINALES ---
                let botonesFinales = '';
                if(v.estado === 'camino') {
                    botonesFinales = `
                        <div class="flex gap-2 mt-4 pt-3 border-t border-slate-100">
                            <button onclick="abrirModalFalla('${v.id}')" class="flex-[1] bg-red-100 text-red-600 font-bold py-3.5 rounded-xl text-sm transition active:scale-95"><i class="fas fa-exclamation-triangle"></i> Problema</button>
                            <button onclick="abrirModalEntrega('${v.id}')" class="flex-[2] bg-emerald-500 text-white font-black py-3.5 rounded-xl text-lg shadow-lg shadow-emerald-500/30 transition active:scale-95"><i class="fas fa-check-circle"></i> Entregar</button>
                        </div>
                    `;
                } else if(v.estado === 'entregado') {
                    botonesFinales = `<div class="mt-4 pt-3 border-t border-slate-100 text-center text-emerald-600 font-black text-sm"><i class="fas fa-check-double text-xl mb-1 block"></i> Entregado con éxito</div>`;
                } else {
                    botonesFinales = `<div class="mt-4 pt-3 border-t border-slate-100 text-center text-red-500 font-black text-sm"><i class="fas fa-times-circle text-xl mb-1 block"></i> Reportado con falla<p class="text-[10px] text-red-400 font-medium mt-1">"${v.motivo_falla}"</p></div>`;
                }

                cont.innerHTML += `
                    <div class="card-entrega bg-white rounded-3xl p-4 shadow-sm mb-4 border-l-4 ${borderColor}">
                        <div class="flex justify-between items-start mb-1">
                            <div class="flex items-center gap-1.5">
                                <span class="bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center font-black text-[10px]">${idx + 1}</span>
                                <span class="text-[9px] font-mono font-bold text-slate-400 border border-slate-200 px-1.5 py-0.5 rounded">${v.folio_pedido || v.folio_factura || 'S/F'}</span>
                            </div>
                            ${esUrgente ? '<span class="badge-urgente text-white px-2.5 py-0.5 rounded-md text-[9px] font-black uppercase tracking-wider shadow-sm"><i class="fas fa-fire-alt"></i> URGENTE</span>' : ''}
                        </div>
                        
                        <h3 class="font-black text-slate-800 text-lg leading-tight mt-2 mb-2">${v.cliente_nombre}</h3>
                        ${aliasDestino}
                        <p class="text-[11px] font-semibold text-slate-600 leading-snug"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i> ${v.direccion}</p>
                        
                        ${horarioCard}
                        
                        <div class="flex gap-2 mt-3">
                            ${btnLlamar}
                            ${btnMapa}
                        </div>

                        ${docsHTML || ciegoAlert ? `
                        <div class="mt-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-wider mb-1.5">Requisitos Físicos:</p>
                            <div class="flex flex-wrap gap-1 leading-none">${docsHTML}</div>
                            ${ciegoAlert}
                        </div>` : ''}

                        ${botonesFinales}
                    </div>
                `;
            });
        }

        // ==========================================
        // FLUJO DE ENTREGA EXITOSA (2 FOTOS)
        // ==========================================
        window.abrirModalEntrega = (id) => {
            idViajeActivo = id;
            resetPreview('cam-doc', 'preview-doc');
            resetPreview('cam-mat', 'preview-mat');
            const m = document.getElementById('modal-entrega');
            const c = document.getElementById('modal-entrega-content');
            m.classList.remove('hidden'); m.classList.add('flex');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        };
        window.cerrarModalEntrega = () => {
            const m = document.getElementById('modal-entrega');
            m.classList.add('opacity-0'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
            idViajeActivo = null;
        };

        window.procesarEntrega = async () => {
            const btn = document.getElementById('btn-confirmar-entrega');
            
            // Validar que ambas fotos existan
            const fileDoc = document.getElementById('cam-doc').files[0];
            const fileMat = document.getElementById('cam-mat').files[0];
            
            if(!fileDoc || !fileMat) {
                return showToast("⚠️ Debes tomar AMBAS fotos para continuar", "error");
            }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo evidencias...';

            try {
                // Comprimir ambas simultáneamente
                const [b64Doc, b64Mat] = await Promise.all([
                    compressImage('cam-doc'),
                    compressImage('cam-mat')
                ]);

                await db.collection('rutas_logistica').doc(idViajeActivo).update({
                    estado: 'entregado',
                    fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp(),
                    // Guardamos la del Documento en el campo original para compatibilidad
                    foto_evidencia: b64Doc, 
                    // Y la del Material en un campo nuevo
                    foto_evidencia_material: b64Mat 
                });

                showToast("¡Entrega exitosa registrada!");
                cerrarModalEntrega();
            } catch(e) {
                showToast("Error al subir. Intenta de nuevo.", "error");
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Subir y Finalizar';
            }
        };

        // ==========================================
        // FLUJO DE FALLA / PROBLEMA
        // ==========================================
        window.abrirModalFalla = (id) => {
            idViajeActivo = id;
            document.getElementById('falla-motivo').value = '';
            resetPreview('cam-falla', 'preview-falla');
            const m = document.getElementById('modal-falla');
            m.classList.remove('hidden'); m.classList.add('flex');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        };
        window.cerrarModalFalla = () => {
            const m = document.getElementById('modal-falla');
            m.classList.add('opacity-0'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
            idViajeActivo = null;
        };

        window.procesarFalla = async () => {
            const motivo = document.getElementById('falla-motivo').value.trim();
            if(!motivo) return showToast("Escribe el motivo de la falla", "error");
            
            const btn = document.getElementById('btn-confirmar-falla');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

            try {
                const b64Foto = await compressImage('cam-falla'); // Opcional
                let data = {
                    estado: 'fallido',
                    motivo_falla: motivo,
                    fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp()
                };
                if(b64Foto) data.foto_evidencia = b64Foto;

                await db.collection('rutas_logistica').doc(idViajeActivo).update(data);

                showToast("Falla reportada a central");
                cerrarModalFalla();
            } catch(e) {
                showToast("Error al reportar", "error");
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-exclamation-circle"></i> Enviar Reporte';
            }
        };

        window.onload = initApp;

    </script>
</body>
</html>
