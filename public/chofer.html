<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Choferes - EEN</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .toast-enter { animation: slideInUp 0.3s forwards; }
        .toast-leave { animation: fadeOut 0.3s forwards; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkQ2HcaLHY7dPvg_IRmuiZNGtcfUhu05o",
            authDomain: "productoseen.firebaseapp.com",
            projectId: "productoseen",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- PANTALLA LOGIN -->
    <div id="pantalla-login" class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-900 relative">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#475569 1px, transparent 1px); background-size: 20px 20px;"></div>
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm z-10 relative">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl mb-6 mx-auto shadow-lg shadow-blue-500/30">
                <i class="fas fa-truck-fast"></i>
            </div>
            <h1 class="text-2xl font-black text-center text-slate-800 mb-1">Portal Operadores</h1>
            <p class="text-center text-slate-500 text-sm font-medium mb-8">Logística EEN</p>
            
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Selecciona tu perfil:</label>
            <select id="login-chofer" class="w-full border-2 border-slate-200 bg-slate-50 p-4 rounded-xl focus:ring-0 focus:border-blue-500 outline-none text-base font-bold text-slate-700 mb-6 cursor-pointer">
                <option value="">Cargando operadores...</option>
            </select>
            
            <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition flex justify-center items-center gap-2 text-lg active:scale-95">
                Ingresar a mi Ruta <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- PANTALLA RUTA PRINCIPAL -->
    <div id="pantalla-ruta" class="hidden flex-1 flex flex-col overflow-hidden relative">
        <header class="bg-slate-900 text-white p-5 pb-6 pt-10 rounded-b-3xl shadow-lg shrink-0 relative z-20">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">En Ruta</p>
                    <h2 id="nombre-chofer-header" class="text-xl font-black leading-tight">Operador</h2>
                </div>
                <button onclick="cerrarSesion()" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg text-sm transition"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            
            <div class="flex gap-2">
                <div class="flex-1 bg-white/10 rounded-xl p-3 text-center border border-white/5">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Pendientes</p>
                    <p id="contador-pendientes" class="text-2xl font-black text-amber-400">0</p>
                </div>
                <div class="flex-1 bg-white/10 rounded-xl p-3 text-center border border-white/5">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Entregados</p>
                    <p id="contador-entregados" class="text-2xl font-black text-emerald-400">0</p>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 space-y-4 pb-24" id="lista-viajes">
            <div class="text-center py-20">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                <p class="text-slate-500 font-semibold">Cargando tu ruta...</p>
            </div>
        </div>
    </div>

    <!-- MODAL REPORTE DE PROBLEMA (EXCLUSIVO DEL CHOFER) -->
    <div id="modal-falla" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-end justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-t-3xl shadow-2xl w-full max-w-md overflow-hidden transform translate-y-full transition-transform duration-300" id="modal-falla-content">
            <div class="bg-red-600 p-5 flex justify-between items-center text-white">
                <h3 class="font-black text-lg"><i class="fas fa-exclamation-triangle mr-2"></i> Reportar Problema</h3>
                <button onclick="cerrarModalFalla()" class="text-red-200 hover:text-white text-xl"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-6 space-y-5">
                <input type="hidden" id="falla-viaje-id">
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">¿Por qué no se pudo entregar? <span class="text-red-500">*</span></label>
                    <select id="motivo-falla" class="w-full border-2 border-slate-200 bg-slate-50 p-4 rounded-xl focus:ring-0 focus:border-red-500 outline-none text-sm font-bold text-slate-700">
                        <option value="">-- Selecciona una razón --</option>
                        <option value="Local cerrado / Nadie recibe">Local cerrado / Nadie recibe</option>
                        <option value="Cliente no tiene el pago">Cliente no tiene el pago / saldo</option>
                        <option value="Dirección incorrecta o no existe">Dirección incorrecta o no existe</option>
                        <option value="Mercancía rechazada">Mercancía rechazada por el cliente</option>
                        <option value="Se pasó el horario de recibo">Se pasó el horario de recibo</option>
                        <option value="Otro motivo">Otro motivo...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Notas adicionales (Opcional)</label>
                    <textarea id="notas-falla" rows="3" class="w-full border-2 border-slate-200 bg-slate-50 p-3 rounded-xl focus:ring-0 focus:border-red-500 outline-none text-sm font-medium" placeholder="Ej. El guardia dijo que regresáramos mañana..."></textarea>
                </div>
                
                <button onclick="confirmarFalla()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-xl shadow-lg transition flex justify-center items-center gap-2 text-base active:scale-95">
                    <i class="fas fa-paper-plane"></i> Enviar Reporte a Base
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMACIÓN ENTREGA -->
    <div id="modal-entrega" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300" id="modal-entrega-content">
            <div class="p-6 text-center">
                <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-4xl text-emerald-500 mx-auto mb-4"><i class="fas fa-check-double"></i></div>
                <h3 class="text-2xl font-black text-slate-800 mb-2">¡Entrega Exitosa!</h3>
                <p class="text-sm text-slate-500 font-medium mb-6">¿Confirmas que la mercancía fue entregada correctamente?</p>
                <input type="hidden" id="entrega-viaje-id">
                
                <div class="flex gap-3">
                    <button onclick="cerrarModalEntrega()" class="flex-1 py-3 text-sm font-bold text-slate-500 bg-slate-100 rounded-xl hover:bg-slate-200 transition">Cancelar</button>
                    <button onclick="confirmarEntrega()" class="flex-1 py-3 text-sm font-black text-white bg-emerald-500 rounded-xl hover:bg-emerald-600 transition shadow-lg shadow-emerald-200">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 w-[90%] md:w-max z-[9999]"></div>

    <script>
        let choferActualId = localStorage.getItem('een_chofer_id') || null;
        let viajesEnRuta = [];

        window.showToast = (msg, type='success') => {
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600' : (type === 'warning' ? 'bg-amber-500' : 'bg-slate-800');
            toast.className = `toast-enter text-white px-5 py-3 rounded-xl shadow-2xl ${bg} text-sm font-bold text-center border border-white/10`;
            toast.innerHTML = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-leave'); setTimeout(() => toast.remove(), 300); }, 4000);
        };

        // Cargar Lista de Choferes
        db.collection('choferes').onSnapshot(snap => {
            const select = document.getElementById('login-chofer');
            select.innerHTML = '<option value="">-- Toca aquí para buscar tu nombre --</option>';
            snap.forEach(doc => { select.innerHTML += `<option value="${doc.id}">${doc.data().nombre}</option>`; });
        });

        window.iniciarSesion = () => {
            const select = document.getElementById('login-chofer');
            if(!select.value) return showToast("Por favor selecciona tu nombre", "error");
            choferActualId = select.value;
            localStorage.setItem('een_chofer_id', choferActualId);
            const nombreChofer = select.options[select.selectedIndex].text;
            localStorage.setItem('een_chofer_nombre', nombreChofer);
            mostrarPantallaRuta();
        };

        window.cerrarSesion = () => {
            localStorage.removeItem('een_chofer_id'); localStorage.removeItem('een_chofer_nombre');
            choferActualId = null;
            document.getElementById('pantalla-login').classList.remove('hidden');
            document.getElementById('pantalla-ruta').classList.add('hidden');
        };

        function mostrarPantallaRuta() {
            document.getElementById('pantalla-login').classList.add('hidden');
            document.getElementById('pantalla-ruta').classList.remove('hidden');
            document.getElementById('nombre-chofer-header').innerText = localStorage.getItem('een_chofer_nombre') || 'Operador';
            escucharViajes();
        }

        function agruparViajesParaChofer(pedidosRaw) {
            let agrupados = [];
            const paqMap = {};
            pedidosRaw.forEach(p => {
                if (p.tipo_destino === 'paqueteria') {
                    const key = `${p.nombre_paqueteria}_${p.estado}`;
                    if (!paqMap[key]) paqMap[key] = { es_grupo: true, id: `GRP-${p.id}`, cliente_nombre: `Consolidado: ${p.nombre_paqueteria}`, direccion: p.direccion, link_maps: p.link_maps || '', coordenadas: p.coordenadas, telefono: p.telefono, horario: p.horario, excepcion: p.excepcion, estado: p.estado, pedidos: [] };
                    paqMap[key].pedidos.push(p);
                } else {
                    agrupados.push({ es_grupo: false, id: p.id, cliente_nombre: p.cliente_nombre, direccion: p.direccion, link_maps: p.link_maps || '', coordenadas: p.coordenadas, telefono: p.telefono, horario: p.horario, excepcion: p.excepcion, estado: p.estado, pedidos: [p] });
                }
            });
            Object.values(paqMap).forEach(g => agrupados.push(g));
            return agrupados;
        }

        function escucharViajes() {
            if(!choferActualId) return;
            // Solo descargamos los viajes que están 'camino' o 'entregado' para este chofer
            db.collection('rutas_logistica')
              .where('chofer_asignado', '==', choferActualId)
              .where('estado', 'in', ['camino', 'entregado'])
              .onSnapshot(snap => {
                  let raw = []; snap.forEach(doc => raw.push({id: doc.id, ...doc.data()}));
                  viajesEnRuta = agruparViajesParaChofer(raw);
                  renderizarViajes();
              });
        }

        function renderizarViajes() {
            const contenedor = document.getElementById('lista-viajes');
            let html = '';
            let pendientes = 0; let entregados = 0;

            const enCamino = viajesEnRuta.filter(v => v.estado === 'camino');
            const completados = viajesEnRuta.filter(v => v.estado === 'entregado');
            pendientes = enCamino.length; entregados = completados.length;

            document.getElementById('contador-pendientes').innerText = pendientes;
            document.getElementById('contador-entregados').innerText = entregados;

            if(pendientes === 0 && entregados === 0) {
                contenedor.innerHTML = `<div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center mt-10"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-3xl text-slate-300 mx-auto mb-4"><i class="fas fa-mug-hot"></i></div><h3 class="text-lg font-black text-slate-700">Ruta Limpia</h3><p class="text-sm text-slate-500 mt-1">No tienes entregas asignadas por el momento.</p></div>`;
                return;
            }

            enCamino.forEach((v, index) => {
                let badge = v.es_grupo ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[9px] font-black uppercase"><i class="fas fa-boxes"></i> Paquetería</span>` : `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[9px] font-black uppercase"><i class="fas fa-building"></i> Bodega</span>`;
                let facturas = v.pedidos.map(p => p.id).join(', ');
                
                // Generar Link de Maps Dinámico si no hay link manual
                let btnMapsHtml = '';
                if(v.link_maps) {
                    btnMapsHtml = `<a href="${v.link_maps}" target="_blank" class="flex-1 bg-blue-50 text-blue-700 border border-blue-200 py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition text-sm"><i class="fas fa-location-arrow"></i> GPS</a>`;
                } else if(v.coordenadas && v.coordenadas.lat) {
                    // Si Base ajustó el pin, usamos la coordenada satelital para el chofer
                    btnMapsHtml = `<a href="https://www.google.com/maps/dir/?api=1&destination=${v.coordenadas.lat},${v.coordenadas.lng}" target="_blank" class="flex-1 bg-blue-50 text-blue-700 border border-blue-200 py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition text-sm"><i class="fas fa-location-arrow"></i> GPS</a>`;
                }

                html += `
                <div class="bg-white rounded-2xl shadow-sm border-2 border-slate-200 overflow-hidden mb-4">
                    <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-slate-800 text-white rounded-full flex items-center justify-center font-black text-sm shadow">${index + 1}</div>
                            <div>${badge}<h3 class="font-black text-slate-800 text-base leading-tight mt-1">${v.cliente_nombre}</h3></div>
                        </div>
                    </div>
                    <div class="p-4">
                        <p class="text-xs text-slate-500 mb-3"><i class="fas fa-map-marker-alt text-red-500 w-4 text-center"></i> <span class="font-medium">${v.direccion}</span></p>
                        
                        ${v.horario || v.excepcion ? `<div class="bg-amber-50 border border-amber-100 p-2.5 rounded-lg mb-3 text-[11px] text-amber-800 font-medium">` + (v.horario ? `<p><i class="fas fa-clock w-4"></i> ${v.horario}</p>` : '') + (v.excepcion ? `<p class="mt-1 font-bold"><i class="fas fa-exclamation-triangle w-4"></i> ${v.excepcion}</p>` : '') + `</div>` : ''}
                        
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 mb-4">
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Facturas a Entregar:</p>
                            <p class="text-xs font-black text-slate-700">${facturas}</p>
                        </div>

                        <!-- BOTONES DE ACCIÓN DEL CHOFER -->
                        <div class="flex gap-2">
                            ${btnMapsHtml}
                            <button onclick="abrirModalFalla('${v.id}')" class="w-12 bg-red-50 text-red-600 border border-red-200 rounded-xl font-bold flex items-center justify-center active:scale-95 transition text-lg shadow-sm" title="Reportar Problema"><i class="fas fa-exclamation-triangle"></i></button>
                            <button onclick="abrirModalEntrega('${v.id}')" class="flex-[1.5] bg-emerald-500 text-white py-3 rounded-xl font-black flex items-center justify-center gap-2 active:scale-95 transition text-sm shadow-md shadow-emerald-200"><i class="fas fa-check-double"></i> Entregado</button>
                        </div>
                    </div>
                </div>`;
            });

            if (completados.length > 0) {
                html += `<div class="flex items-center gap-3 my-6"><div class="h-px bg-slate-300 flex-1"></div><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Ya Entregados</span><div class="h-px bg-slate-300 flex-1"></div></div>`;
                completados.forEach(v => {
                    html += `<div class="bg-emerald-50 rounded-xl border border-emerald-100 p-3 mb-2 flex justify-between items-center opacity-70"><div class="flex items-center gap-3"><div class="w-8 h-8 bg-emerald-200 text-emerald-700 rounded-full flex items-center justify-center text-sm"><i class="fas fa-check"></i></div><div><h3 class="font-bold text-slate-700 text-sm">${v.cliente_nombre}</h3><p class="text-[10px] text-slate-500 truncate w-48">${v.direccion}</p></div></div></div>`;
                });
            }

            contenedor.innerHTML = html;
        }

        // --- LÓGICA DE REPORTE DE PROBLEMA ---
        window.abrirModalFalla = (idGrupo) => {
            document.getElementById('falla-viaje-id').value = idGrupo;
            document.getElementById('motivo-falla').value = '';
            document.getElementById('notas-falla').value = '';
            
            const modal = document.getElementById('modal-falla');
            const content = document.getElementById('modal-falla-content');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('translate-y-full'); }, 10);
        };
        
        window.cerrarModalFalla = () => {
            const modal = document.getElementById('modal-falla');
            const content = document.getElementById('modal-falla-content');
            modal.classList.add('opacity-0'); content.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        window.confirmarFalla = async () => {
            const idGrupo = document.getElementById('falla-viaje-id').value;
            const motivo = document.getElementById('motivo-falla').value;
            const notas = document.getElementById('notas-falla').value.trim();

            if (!motivo) return showToast("Selecciona una razón", "error");

            const grupo = viajesEnRuta.find(v => v.id === idGrupo);
            if(!grupo) return;

            const razonFinal = notas ? `${motivo} - ${notas}` : motivo;

            try {
                const batch = db.batch();
                grupo.pedidos.forEach(p => {
                    // Actualizamos a estado 'fallido' y guardamos el motivo
                    batch.update(db.collection('rutas_logistica').doc(p.id), { 
                        estado: 'fallido', 
                        motivo_falla: razonFinal,
                        fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp() 
                    });
                });
                await batch.commit();
                showToast("Reporte enviado a la Base", "warning");
                cerrarModalFalla();
            } catch(e) {
                showToast("Error de conexión", "error");
            }
        };

        // --- LÓGICA DE ENTREGA EXITOSA ---
        window.abrirModalEntrega = (idGrupo) => {
            document.getElementById('entrega-viaje-id').value = idGrupo;
            const modal = document.getElementById('modal-entrega');
            const content = document.getElementById('modal-entrega-content');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.cerrarModalEntrega = () => {
            const modal = document.getElementById('modal-entrega');
            const content = document.getElementById('modal-entrega-content');
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        window.confirmarEntrega = async () => {
            const idGrupo = document.getElementById('entrega-viaje-id').value;
            const grupo = viajesEnRuta.find(v => v.id === idGrupo);
            if(!grupo) return;

            try {
                const batch = db.batch();
                grupo.pedidos.forEach(p => {
                    batch.update(db.collection('rutas_logistica').doc(p.id), { 
                        estado: 'entregado', 
                        fecha_actualizacion: firebase.firestore.FieldValue.serverTimestamp() 
                    });
                });
                await batch.commit();
                showToast("¡Excelente! Entrega registrada.");
                cerrarModalEntrega();
            } catch(e) {
                showToast("Error de conexión", "error");
            }
        };

        window.onload = () => { if(choferActualId) mostrarPantallaRuta(); };
    </script>
</body>
</html>
