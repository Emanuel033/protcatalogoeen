<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Inventario - EEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script> <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800 font-sans pb-10">

    <script src="assets/js/firebase-config.js"></script>

    <header class="bg-slate-900 text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <i class="fas fa-boxes text-2xl text-emerald-400"></i>
            <div>
                <h1 class="font-black leading-none">Conteo Físico</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">Almacén EEN</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 flex flex-col gap-4 max-w-md mx-auto w-full">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center">
            <div id="reader" class="w-full rounded-xl overflow-hidden mb-4 bg-slate-100 min-h-[200px] flex items-center justify-center border-2 border-dashed border-slate-300">
                <p class="text-slate-400 text-sm font-bold"><i class="fas fa-camera text-2xl mb-2 block"></i>Cámara apagada / Lista</p>
            </div>
            <div class="flex gap-2">
                <button id="btnScan" onclick="toggleScanner()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-qrcode"></i> Escanear
                </button>
                <button onclick="buscarManual()" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition flex items-center justify-center gap-2">
                    <i class="fas fa-search"></i> Manual
                </button>
            </div>
        </div>

        <div id="fichaProducto" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500 fade-in">
            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-wider mb-1">Producto Identificado</p>
            <h2 id="prodNombre" class="font-black text-lg leading-tight mb-2">Cargando...</h2>
            <p class="font-mono text-xs bg-slate-100 inline-block px-2 py-1 rounded text-slate-600 mb-4" id="prodCodigo">---</p>
            
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
                <h3 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3"><i class="fas fa-layer-group text-blue-500 mr-1"></i> Desglose de Conteo</h3>
                
                <div class="flex justify-between items-center mb-3 pb-3 border-b border-slate-200">
                    <div>
                        <span class="font-bold text-slate-700 block text-sm">Piezas Sueltas</span>
                        <span class="text-[10px] text-slate-500">Unidades individuales</span>
                    </div>
                    <input type="number" id="conteoSueltas" oninput="recalcularTotalFisico()" class="w-20 text-center font-black text-slate-900 bg-white border-2 border-slate-300 rounded-lg py-2 outline-none focus:border-blue-500 transition-colors" placeholder="0">
                </div>

                <div id="contenedorEmpaques" class="space-y-3 mb-3">
                    </div>

                <button onclick="crearNuevoEmpaque()" class="w-full text-xs font-bold text-blue-600 bg-blue-50 py-2 rounded border border-blue-200 hover:bg-blue-100 transition border-dashed">
                    <i class="fas fa-plus"></i> Añadir Tipo de Empaque
                </button>
            </div>

            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 mb-4 text-center">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Total Calculado (Piezas):</label>
                <div id="conteoFisicoTotalDisplay" class="text-4xl font-black text-blue-700">0</div>
            </div>

            <button onclick="guardarAuditoria()" id="btnGuardar" class="w-full bg-emerald-500 text-white py-4 rounded-xl font-black shadow-lg shadow-emerald-500/30 text-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                <i class="fas fa-save"></i> Guardar Conteo Final
            </button>
        </div>

        <div id="toast" class="fixed bottom-4 left-4 right-4 bg-slate-800 text-white p-4 rounded-xl shadow-2xl hidden font-bold text-center z-50 transition-opacity duration-300"></div>

    </main>

    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        let html5QrcodeScanner = null;
        let isScanning = false;
        let productoActual = null;
        let empaquesActuales = [];
        let catalogoEnMemoria = [];

        window.onload = async () => {
            try {
                const res = await fetch('/catalogo_completo.json?v=' + new Date().getTime());
                catalogoEnMemoria = await res.json();
            } catch(e) {
                showToast("Aviso: Catálogo local no cargado", true);
            }
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-4 left-4 right-4 p-4 rounded-xl shadow-2xl font-bold text-center z-50 transition-opacity duration-300 ${isError ? 'bg-red-500 text-white' : 'bg-slate-900 text-emerald-400'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function toggleScanner() {
            if (isScanning) {
                html5QrcodeScanner.clear();
                isScanning = false;
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-qrcode"></i> Escanear';
            } else {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    (err) => {} // ignorar errores cámara
                ).catch(e => {
                    showToast("Error de cámara. Asegúrate de dar permisos.", true);
                    isScanning = false;
                });
                isScanning = true;
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-stop"></i> Detener';
            }
        }

        async function onScanSuccess(decodedText) {
            if(isScanning) toggleScanner();
            procesarCodigo(decodedText);
        }

        async function buscarManual() {
            const codigo = prompt("Ingresa el código base, SKU de paquete, o código de barras:");
            if(codigo) procesarCodigo(codigo.trim());
        }

        async function procesarCodigo(codigoBuscado) {
            if(catalogoEnMemoria.length === 0) return showToast("El catálogo aún no carga, espera un segundo.", true);
            showToast("Buscando...");
            document.getElementById('fichaProducto').classList.add('hidden');
            
            try {
                // 1. Buscar en memoria (JSON) primero, busca Base o Empaque
                let prodEncontrado = catalogoEnMemoria.find(p => String(p.codigo).toLowerCase() === codigoBuscado.toLowerCase());
                
                // Si no se encuentra como base, buscar si es el SKU de un empaque
                if (!prodEncontrado) {
                    for (const p of catalogoEnMemoria) {
                        if (p.empaques && p.empaques.some(e => String(e.sku).toLowerCase() === codigoBuscado.toLowerCase() || String(e.codigo_barras).toLowerCase() === codigoBuscado.toLowerCase())) {
                            prodEncontrado = p; break;
                        }
                    }
                }

                // 2. Si lo encontramos, bajamos la versión FRESCA de Firebase
                if (prodEncontrado) {
                    let docReal = null;
                    
                    // CORRECCIÓN PRINCIPAL: Buscamos usando .where() para que la diagonal (/) no rompa el sistema
                    // NOTA: Si tu colección oficial se llama 'catalogo_facturacion', cámbialo aquí abajo.
                    const snapshot = await db.collection('productos').where('codigo_sistema_oficial', '==', prodEncontrado.codigo).get();
                    
                    if (!snapshot.empty) {
                        docReal = snapshot.docs[0];
                    } else {
                        // Plan B: Intentar con el ID sanitizado por si Vercel lo guardó con guiones bajos
                        const idSeguro = String(prodEncontrado.id).replace(/\//g, '_');
                        const docAlterno = await db.collection('productos').doc(idSeguro).get();
                        if (docAlterno.exists) docReal = docAlterno;
                    }

                    if(docReal) {
                        const data = docReal.data();
                        
                        // SANITIZAMOS LA DIAGONAL PARA BUSCAR LA SOMBRA CORRECTA
                        const codigoSeguro = String(prodEncontrado.codigo).replace(/\//g, '_');
                        let sombraCant = 0;
                        const sombraDoc = await db.collection('stock_por_fuera').doc(codigoSeguro).get();
                        if(sombraDoc.exists) sombraCant = sombraDoc.data().cantidad_vendida || 0;

                        productoActual = {
                            id: docReal.id, // Guardamos el ID real con el que lo encontró
                            codigo_contpaqi: prodEncontrado.codigo,
                            nombre_producto: data.nombre_flexible || data.descripcion_sistema_oficial || prodEncontrado.nombre,
                            stock_oficial_snapshot: data.stock_oficial || prodEncontrado.stock || 0,
                            sombra_web_snapshot: sombraCant
                        };

                        empaquesActuales = data.empaques || prodEncontrado.empaques || [];
                        renderEmpaques();

                        document.getElementById('prodNombre').innerText = productoActual.nombre_producto;
                        document.getElementById('prodCodigo').innerText = productoActual.codigo_contpaqi;
                        document.getElementById('conteoSueltas').value = '';
                        document.getElementById('conteoFisicoTotalDisplay').innerText = '0';
                        document.getElementById('fichaProducto').classList.remove('hidden');
                        
                        // Pequeña animación si detectó un paquete específico
                        if(codigoBuscado !== productoActual.codigo_contpaqi) {
                            showToast("¡Paquete detectado!");
                        }
                    } else {
                        showToast("Producto en JSON pero no en la Base de Datos en vivo.", true);
                    }
                } else {
                    showToast("Producto o paquete no encontrado", true);
                }
            } catch (error) {
                console.error(error);
                showToast("Error de conexión al buscar", true);
            }
        }

        function renderEmpaques() {
            const container = document.getElementById('contenedorEmpaques');
            container.innerHTML = '';
            
            empaquesActuales.forEach((emp, index) => {
                const pzas = emp.cantidad_piezas || emp.cantidad || 0;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 border border-slate-200 rounded shadow-sm">
                        <div class="flex-1">
                            <span class="font-bold text-slate-700 block text-xs">Paquetes de ${pzas} pzs</span>
                            <span class="text-[9px] font-mono text-slate-400">${emp.sku || 'S/SKU'}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400 font-bold">Cant:</span>
                            <input type="number" id="conteoEmpaque_${index}" data-piezas="${pzas}" oninput="recalcularTotalFisico()" class="w-16 text-center font-bold text-slate-800 bg-slate-50 border border-slate-300 rounded py-1 outline-none focus:border-blue-500" placeholder="0">
                        </div>
                    </div>
                `;
            });
        }

        function recalcularTotalFisico() {
            let total = 0;
            // Sumar sueltas
            const sueltas = parseInt(document.getElementById('conteoSueltas').value) || 0;
            total += sueltas;

            // Sumar empaques (Cajas * Piezas por caja)
            empaquesActuales.forEach((emp, index) => {
                const cajas = parseInt(document.getElementById(`conteoEmpaque_${index}`).value) || 0;
                const pzasPorCaja = emp.cantidad_piezas || emp.cantidad || 0;
                total += (cajas * pzasPorCaja);
            });

            document.getElementById('conteoFisicoTotalDisplay').innerText = total;
        }

        async function crearNuevoEmpaque() {
            if(!productoActual) return;
            const pzasStr = prompt(`Crear nuevo empaque para ${productoActual.codigo_contpaqi}\n¿Cuántas piezas contiene el nuevo paquete?`);
            const pzas = parseInt(pzasStr);
            
            if(isNaN(pzas) || pzas <= 0) return showToast("Cantidad no válida", true);

            const nuevoSku = `${productoActual.codigo_contpaqi}-${pzas}`;
            const nuevoEmpaque = { sku: nuevoSku, cantidad_piezas: pzas, codigo_barras: nuevoSku };

            try {
                showToast("Creando paquete...");
                await db.collection('productos').doc(productoActual.id).update({
                    empaques: firebase.firestore.FieldValue.arrayUnion(nuevoEmpaque)
                });
                empaquesActuales.push(nuevoEmpaque);
                renderEmpaques();
                showToast(`Paquete ${nuevoSku} creado.`);
            } catch(e) {
                console.error(e);
                showToast("Error al guardar paquete", true);
            }
        }

        async function guardarAuditoria() {
            const conteoTotal = parseInt(document.getElementById('conteoFisicoTotalDisplay').innerText);
            if (isNaN(conteoTotal) || conteoTotal < 0) return showToast("El conteo no es válido", true);
            if (!productoActual) return;

            const btn = document.getElementById('btnGuardar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            // FOTOGRAFÍA: Lo que CONTPAQi decía MENOS lo que Mostrador ya vendió
            const esperado = productoActual.stock_oficial_snapshot - productoActual.sombra_web_snapshot;
            const ajuste = conteoTotal - esperado;

            // Guardamos todo el detalle para la bitácora
            const detalleConteo = {
                sueltas: parseInt(document.getElementById('conteoSueltas').value) || 0,
                empaques: empaquesActuales.map((emp, idx) => ({
                    sku: emp.sku,
                    piezas_por_paquete: emp.cantidad_piezas || emp.cantidad || 0,
                    cantidad_paquetes: parseInt(document.getElementById(`conteoEmpaque_${idx}`).value) || 0
                }))
            };

            const ticket = {
                id_producto: productoActual.id,
                codigo_contpaqi: productoActual.codigo_contpaqi,
                nombre_producto: productoActual.nombre_producto,
                esperado: esperado,
                conteo_fisico: conteoTotal, // Siempre mandamos el total en PIEZAS a Admin/Contpaqi
                ajuste_calculado: ajuste,
                detalle_conteo: detalleConteo,
                fecha: firebase.firestore.FieldValue.serverTimestamp(),
                estado: 'pendiente'
            };

            try {
                await db.collection('auditorias_pendientes').add(ticket);
                showToast("¡Inventario guardado!");
                document.getElementById('fichaProducto').classList.add('hidden');
                productoActual = null;
            } catch (error) {
                console.error(error);
                showToast("Error al guardar", true);
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> Guardar Conteo Final';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
