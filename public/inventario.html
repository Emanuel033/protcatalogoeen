<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Inventario - EEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800 font-sans">

    <script src="assets/js/firebase-config.js"></script>

    <header class="bg-slate-900 text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <i class="fas fa-boxes text-2xl text-emerald-400"></i>
            <div>
                <h1 class="font-black leading-none">Conteo Físico</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">Almacén EEN</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 flex flex-col gap-4 max-w-md mx-auto w-full">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center">
            <div id="reader" class="w-full rounded-xl overflow-hidden mb-4 bg-slate-100 min-h-[250px] flex items-center justify-center border-2 border-dashed border-slate-300">
                <p class="text-slate-400 text-sm font-bold"><i class="fas fa-camera text-2xl mb-2 block"></i>Cámara apagada</p>
            </div>
            <div class="flex gap-2">
                <button id="btnScan" onclick="toggleScanner()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-qrcode"></i> Escanear
                </button>
                <button onclick="buscarManual()" class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-300 transition flex items-center justify-center gap-2">
                    <i class="fas fa-keyboard"></i> Manual
                </button>
            </div>
        </div>

        <div id="fichaProducto" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500 fade-in">
            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-wider mb-1">Producto Identificado</p>
            <h2 id="prodNombre" class="font-black text-lg leading-tight mb-2">Cargando...</h2>
            <p class="font-mono text-xs bg-slate-100 inline-block px-2 py-1 rounded text-slate-600 mb-4" id="prodCodigo">---</p>
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Conteo Físico Real:</label>
                <input type="number" id="conteoFisico" class="w-full text-center text-3xl font-black text-slate-900 bg-white border-2 border-blue-200 rounded-xl py-3 outline-none focus:border-blue-500 transition-colors" placeholder="0">
            </div>

            <button onclick="guardarAuditoria()" id="btnGuardar" class="w-full bg-emerald-500 text-white py-4 rounded-xl font-black shadow-lg shadow-emerald-500/30 text-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                <i class="fas fa-save"></i> Guardar Conteo
            </button>
        </div>

        <div id="toast" class="fixed bottom-4 left-4 right-4 bg-slate-800 text-white p-4 rounded-xl shadow-2xl hidden font-bold text-center z-50 transition-opacity duration-300"></div>

    </main>

    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        const db = firebase.firestore();
        let html5QrcodeScanner = null;
        let isScanning = false;
        let productoActual = null; // Guardará el snapshot

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `fixed bottom-4 left-4 right-4 p-4 rounded-xl shadow-2xl font-bold text-center z-50 transition-opacity duration-300 ${isError ? 'bg-red-500 text-white' : 'bg-slate-900 text-emerald-400'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function toggleScanner() {
            if (isScanning) {
                html5QrcodeScanner.clear();
                isScanning = false;
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-qrcode"></i> Escanear';
                document.getElementById('reader').innerHTML = '<p class="text-slate-400 text-sm font-bold"><i class="fas fa-camera text-2xl mb-2 block"></i>Cámara apagada</p>';
            } else {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    onScanSuccess,
                    (err) => {} // ignorar errores constantes de lectura
                );
                isScanning = true;
                document.getElementById('btnScan').innerHTML = '<i class="fas fa-stop"></i> Detener';
            }
        }

        async function onScanSuccess(decodedText) {
            if(isScanning) toggleScanner();
            procesarCodigo(decodedText);
        }

        async function buscarManual() {
            const codigo = prompt("Ingresa el código o ID del producto:");
            if(codigo) procesarCodigo(codigo);
        }

        async function procesarCodigo(codigo) {
            showToast("Buscando producto...");
            try {
                // Buscar en Firestore (Ajusta 'productos' al nombre real de tu colección si es diferente)
                const snapshot = await db.collection('productos').where('codigo_sistema_oficial', '==', codigo).get();
                
                let doc = null;
                if (!snapshot.empty) {
                    doc = snapshot.docs[0];
                } else {
                    // Si no lo encuentra por código, intenta por ID de Firebase
                    const docById = await db.collection('productos').doc(codigo).get();
                    if(docById.exists) doc = docById;
                }

                if(doc) {
                    const data = doc.data();
                    
                    // TOMAMOS LA FOTOGRAFÍA AL INSTANTE
                    productoActual = {
                        id: doc.id,
                        codigo_contpaqi: data.codigo_sistema_oficial || 'S/N',
                        nombre_producto: data.nombre_flexible || 'Desconocido',
                        stock_oficial_snapshot: data.stock_oficial || 0, // Lo que diga la BD maestra
                        sombra_web_snapshot: data.sombra_web || 0       // Las ventas pendientes de PVM
                    };

                    document.getElementById('prodNombre').innerText = productoActual.nombre_producto;
                    document.getElementById('prodCodigo').innerText = productoActual.codigo_contpaqi;
                    document.getElementById('conteoFisico').value = '';
                    document.getElementById('fichaProducto').classList.remove('hidden');
                    setTimeout(() => document.getElementById('conteoFisico').focus(), 100);
                } else {
                    showToast("Producto no encontrado en la base de datos", true);
                }
            } catch (error) {
                console.error(error);
                showToast("Error de conexión", true);
            }
        }

        async function guardarAuditoria() {
            const conteo = parseInt(document.getElementById('conteoFisico').value);
            if (isNaN(conteo) || conteo < 0) return showToast("Ingresa un conteo válido", true);
            if (!productoActual) return;

            const btn = document.getElementById('btnGuardar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            // CÁLCULO DE LA FOTOGRAFÍA
            const esperado = productoActual.stock_oficial_snapshot + productoActual.sombra_web_snapshot;
            const ajuste = conteo - esperado;

            const ticket = {
                ...productoActual,
                esperado: esperado,
                conteo_fisico: conteo,
                ajuste_calculado: ajuste,
                fecha: firebase.firestore.FieldValue.serverTimestamp(),
                estado: 'pendiente' // Clave para que aparezca en el admin.html
            };

            try {
                // Guardamos el ticket en una colección dedicada a auditorías
                await db.collection('auditorias_pendientes').add(ticket);
                showToast("¡Conteo guardado y enviado a Admin!");
                document.getElementById('fichaProducto').classList.add('hidden');
                productoActual = null;
            } catch (error) {
                console.error(error);
                showToast("Error al guardar el conteo", true);
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> Guardar Conteo';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
