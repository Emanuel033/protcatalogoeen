name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      # ESTO ES LO IMPORTANTE: Escucha el grito de Vercel
  repository_dispatch:
    types: [actualizar-catalogo]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Instalar dependencias
      - run: npm ci
      
      # 2. Compilar React (Esto junta React y tus HTML en la carpeta dist)
      - run: npm run build
      
      # 3. Subir a Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTOSEEN }}'
          channelId: live
          projectId: productoseen
